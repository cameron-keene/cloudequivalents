# Title and meta description split test for service and compare pages.
# Treatment pages get seo_title / seo_description in the YAML data. Control pages stay on the
# generated title and description. Do not change either group's titles mid-test.
# Score a later Search Console Pages export with: npm run title-test -- Pages.csv
id: title-test-2026-11
name: Service and compare page title split test
status: live  # shipped to main on 2026-11-23; /azure/virtual-desktop/ is excluded from scoring
hypothesis: >
  Comparison-style titles and descriptions that name the equivalent services, and that reuse
  the wording people actually search (equivalent, vs, service short names), will increase
  click-through rate on service hub and compare pages relative to the generated
  "Azure equivalent of X | Cloud Equivalents" titles.

scope:
  included: service hubs (/aws|azure|gcp/<seg>/) and compare pages (/compare/.../).
  excluded: home, blog, category indexes, provider indexes, exams, about, /data/, /changes/, API files.
  held_constant: URL, H1, body copy, and Open Graph PNG artwork. Only <title>, meta description, og:title and og:description change on treatment pages (JSON-LD description follows the meta description). /azure/virtual-desktop/ also received a title override at launch, but it is excluded from the test and must not be scored in either group.

design:
  method: matched pairs by impressions
  target_n: 40  # 20 pairs
  source_export: Google Search Console Pages.csv, last 28 days, search type Web, 2026-10-25 to 2026-11-21
  selection: >
    Take every service or compare page in the Pages export, dedupe by path, sort by impressions
    descending, then clicks descending, then path ascending. Keep the first 40. A 57-impression
    tie at the cutoff was broken by path order, so /aws/bedrock-knowledge-bases/ is #40 and
    /compare/aws-s3-storage-classes-vs-azure-blob-access-tiers/ and /gcp/model-garden/ are not in the test.
  pairing: Adjacent pages in that ranked list (1 with 2, 3 with 4, …, 39 with 40).
  assignment: >
    Python 3.13.5 random.Random(20261123). For each pair, if rng.random() < 0.5 the first
    page is treatment; otherwise the second is. First five rng.random() values were
    0.7548469049910241, 0.8974816498515421, 0.6549820415218462, 0.15991237888778564,
    0.8128309738671603. first_is_treatment for the 20 pairs:
    [false, false, false, true, false, true, false, true, true, false, true, true, true, true, false, true, true, true, false, false].
  start_date: '2026-11-23'  # America/New_York; date the titles go live on cloudequivalents.com
  review_after_days: 21
  review_date: '2026-12-14'  # America/New_York
  metric: >
    Group CTR (sum of clicks / sum of impressions) and total clicks per group, from a Search
    Console Pages export covering 2026-11-23 to 2026-12-14. Also compare each group to its
    baseline CTR from the 28-day window below. Do not include excluded pages (currently
    /azure/virtual-desktop/) in either group's totals. Pair-level contrasts should skip pair 1,
    which no longer has a control after Azure Virtual Desktop was pulled out at launch.
  power_note: >
    The site had only 55 clicks (Chart.csv / Devices.csv) in the baseline window, and the 39
    scored pages had 21 clicks combined. A conclusive result may take longer than 3 weeks.
    Review on 2026-12-14 and extend if needed. Do not change remaining group titles mid-test.

baseline:
  window: 2026-10-25 to 2026-11-21  # Filters.csv: Last 28 days, search type Web
  source: Google Search Console export unzipped 2026-11-23
  site:
    # GSC property totals disagree slightly across reports; all three are recorded here.
    chart: { clicks: 55, impressions: 11252 }      # Chart.csv daily sum
    devices: { clicks: 55, impressions: 11252 }    # Devices.csv (desktop 48/10028, mobile 7/1145, tablet 0/79)
    pages: { clicks: 56, impressions: 12073, rows: 525 }  # Pages.csv; page-level baselines below use this file
    queries: { clicks: 3, impressions: 3849, rows: 1000 }  # Queries.csv is anonymized and incomplete; used only to word treatment titles
  treatment_group:
    pages: 20
    clicks: 11
    impressions: 2053
    ctr: 0.005358  # 0.54%
  control_group:
    pages: 19  # 20 at assignment, minus /azure/virtual-desktop/ which was excluded at launch
    clicks: 10
    impressions: 1752  # 2689 minus AVD's 937
    ctr: 0.005708  # 0.57%
    as_assigned_including_avd: { pages: 20, clicks: 10, impressions: 2689, ctr: 0.003719 }

