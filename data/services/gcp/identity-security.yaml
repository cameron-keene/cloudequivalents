- slug: cloud-iam
  name: Identity and Access Management (IAM)
  status: ga
  summary: Allow policies that grant roles to principals on resources in the organization, folder, and project hierarchy.
  docs: https://docs.cloud.google.com/iam/docs/overview
- slug: iam-deny-policies
  name: IAM deny policies
  status: ga
  summary: Guardrails that deny specific permissions to principals regardless of what allow policies grant.
  docs: https://docs.cloud.google.com/iam/docs/deny-overview
- slug: cloud-identity
  name: Cloud Identity
  status: ga
  summary: Google identity service for users and groups, with free and premium editions, 2-Step Verification, and SSO.
  docs: https://docs.cloud.google.com/identity/docs/editions
- slug: workforce-identity-federation
  name: Workforce Identity Federation
  status: ga
  summary: Lets users from an external IdP access Google Cloud with SSO, without syncing accounts.
  docs: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
- slug: service-accounts
  name: Service accounts
  status: ga
  summary: Identities for workloads; attach a service account to a resource to get short-lived credentials without keys.
  docs: https://docs.cloud.google.com/iam/docs/service-account-overview
- slug: workload-identity-federation
  name: Workload Identity Federation
  status: ga
  summary: Lets workloads on AWS, Azure, or OIDC/SAML identity providers access Google Cloud without service account keys.
  docs: https://docs.cloud.google.com/iam/docs/workload-identity-federation
- slug: privileged-access-manager
  name: Privileged Access Manager
  status: ga
  summary: Just-in-time, temporary privilege elevation through entitlements with optional approvals.
  docs: https://docs.cloud.google.com/iam/docs/pam-overview
- slug: policy-intelligence
  name: Policy Intelligence (role recommendations, Policy Analyzer)
  status: ga
  summary: Role recommendations to remove excess permissions and Policy Analyzer to find who has access to what.
  docs: https://docs.cloud.google.com/policy-intelligence/docs/role-recommendations-overview
- slug: identity-platform
  name: Identity Platform
  status: ga
  summary: Customer identity and access management that backs Firebase Authentication, billed per monthly active user.
  docs: https://docs.cloud.google.com/identity-platform/docs/product-comparison
  pricing: https://cloud.google.com/identity-platform/pricing
- slug: managed-microsoft-ad
  name: Managed Service for Microsoft Active Directory
  status: ga
  summary: Highly available, hardened Microsoft Active Directory domains hosted by Google Cloud.
  docs: https://docs.cloud.google.com/managed-microsoft-ad/docs/overview
  pricing: https://cloud.google.com/managed-microsoft-ad/pricing
- slug: identity-aware-proxy
  name: Identity-Aware Proxy (IAP)
  status: ga
  summary: Identity- and context-based access to applications and VMs (including TCP forwarding) without a VPN.
  docs: https://docs.cloud.google.com/iap/docs/concepts-overview
  pricing: https://cloud.google.com/iap/pricing
- slug: chrome-enterprise-premium
  name: Chrome Enterprise Premium
  status: ga
  summary: Zero trust access and data protection that extends IAP with paid capabilities.
  docs: https://docs.cloud.google.com/chrome-enterprise-premium/docs/overview
- slug: resource-manager
  name: Resource Manager (organization, folders, projects)
  status: ga
  summary: The resource hierarchy of organization, folders, and projects used for policy and billing.
  docs: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
- slug: organization-policy
  name: Organization Policy Service
  status: ga
  summary: Managed and custom constraints that restrict resource configurations across the hierarchy.
  docs: https://docs.cloud.google.com/organization-policy/overview
- slug: cloud-setup
  name: Google Cloud Setup
  status: ga
  summary: Guided flow for administrators to configure an organization foundation.
  docs: https://docs.cloud.google.com/docs/enterprise/cloud-setup
- slug: enterprise-foundations-blueprint
  name: Enterprise foundations blueprint
  status: ga
  summary: Google-recommended reference architecture and deployable code for a secure foundation.
  docs: https://docs.cloud.google.com/architecture/blueprints/security-foundations
- slug: cloud-audit-logs
  name: Cloud Audit Logs
  status: ga
  summary: Admin Activity, Data Access, System Event, and Policy Denied audit logs in Cloud Logging.
  docs: https://docs.cloud.google.com/logging/docs/audit
  pricing: https://cloud.google.com/products/observability/pricing
- slug: cloud-asset-inventory
  name: Cloud Asset Inventory
  status: ga
  summary: Inventory of resources and policies with up to 35 days of change history.
  docs: https://docs.cloud.google.com/asset-inventory/docs/asset-inventory-overview
- slug: security-posture
  name: Security Command Center security posture
  status: ga
  summary: Define and deploy security postures and detect drift from them.
  docs: https://docs.cloud.google.com/security-command-center/docs/security-posture-overview
  pricing: https://cloud.google.com/security-command-center/pricing
- slug: compliance-manager
  name: Compliance Manager (Security Command Center)
  status: ga
  summary: Cloud controls and frameworks with auditing and evidence collection in Premium and Enterprise tiers.
  docs: https://docs.cloud.google.com/security-command-center/docs/compliance-manager-overview
  pricing: https://cloud.google.com/security-command-center/pricing
- slug: assured-workloads
  name: Assured Workloads
  status: ga
  summary: Control packages for data residency, access, and personnel controls for regulated workloads.
  docs: https://docs.cloud.google.com/assured-workloads/docs/overview
- slug: compliance-reports-manager
  name: Compliance Reports Manager
  status: ga
  summary: Download Google Cloud compliance reports and certifications.
