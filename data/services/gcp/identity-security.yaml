  pricing: https://cloud.google.com/kms/pricing
- slug: single-tenant-cloud-hsm
  name: Single-tenant Cloud HSM
  status: ga
  summary: A single-tenant instance of HSM partitions for your exclusive use, managed through Cloud KMS.
  docs: https://docs.cloud.google.com/kms/docs/single-tenant-hsm
  pricing: https://cloud.google.com/kms/pricing
- slug: cloud-ekm
  name: Cloud External Key Manager
  status: ga
  summary: Use keys held in a supported external key manager outside Google Cloud.
