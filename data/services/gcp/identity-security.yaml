  pricing: https://cloud.google.com/certificate-manager/pricing
- slug: certificate-authority-service
  name: Certificate Authority Service
  status: ga
  summary: Managed private CAs, with custom root and subordinate CAs, in DevOps and Enterprise tiers.
  docs: https://docs.cloud.google.com/certificate-authority-service/docs/ca-service-overview
  pricing: https://cloud.google.com/certificate-authority-service/pricing
- slug: security-command-center
  name: Security Command Center
  status: ga
  summary: Security and risk management in Standard and Premium tiers; the Enterprise tier is deprecated and shuts down May 21, 2027.
  docs: https://docs.cloud.google.com/security-command-center/docs/security-command-center-overview
  pricing: https://cloud.google.com/security-command-center/pricing
- slug: event-threat-detection
  name: Event Threat Detection
  status: ga
  summary: Security Command Center service that detects threats in near real time from logs.
