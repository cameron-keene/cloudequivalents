  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-inference
  name: SageMaker AI inference (endpoints)
  status: ga
  summary: Real-time, serverless, asynchronous, and batch-transform inference options.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-pipelines
  name: Amazon SageMaker Pipelines
  status: ga
  summary: Serverless ML workflow orchestration with a visual editor, SDK, and lineage tracking.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-feature-store
  name: Amazon SageMaker Feature Store
  status: ga
  summary: Online (low-latency latest values) and offline (historical) feature stores, organized as feature groups.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-model-registry
