  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-a2i
  name: Amazon Augmented AI (A2I)
  status: maintenance
  status_note: No longer open to new customers (lifecycle announcement June 30, 2026).
