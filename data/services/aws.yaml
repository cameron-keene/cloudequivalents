# AWS service registry. status: ga | preview | maintenance | sunset | retired
#   maintenance = no new customers / no new features (AWS "Maintenance" lifecycle stage)
#   sunset      = end-of-support date announced
#   retired     = full shutdown
# Lifecycle source: https://docs.aws.amazon.com/general/latest/gr/service-lifecycle.html
- slug: bedrock
  name: Amazon Bedrock
  status: ga
  summary: Fully managed API access to 100+ foundation models (Amazon Nova, Anthropic Claude, OpenAI, xAI Grok, Meta Llama, Mistral, DeepSeek, Qwen, Cohere, and more) plus RAG, guardrails, evaluation, and customization.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-marketplace
  name: Amazon Bedrock Marketplace
  status: ga
  summary: Discover and deploy additional third-party and specialized models onto managed endpoints, used through Bedrock APIs.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/amazon-bedrock-marketplace.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-model-customization
  name: Amazon Bedrock model customization
  status: ga
  summary: Supervised fine-tuning, reinforcement fine-tuning (reward functions in Lambda), and distillation for supported Bedrock models.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-provisioned-throughput
  name: Amazon Bedrock Provisioned Throughput & cross-Region inference
  status: ga
  summary: Reserved model capacity, plus Global and Geo cross-Region inference profiles that route requests across Regions for throughput.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-agentcore
  name: Amazon Bedrock AgentCore
  status: ga
  summary: Modular agent platform. Harness (managed agent loop), Runtime, Memory, Gateway (MCP), Identity, Code Interpreter, Browser, Observability, Evaluations, Optimization, Policy, Registry, Payments. Works with any framework and any model.
  docs: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
  pricing: https://aws.amazon.com/bedrock/agentcore/pricing/
- slug: bedrock-agents-classic
  name: Amazon Bedrock Agents Classic
  status: maintenance
  status_note: The original Bedrock Agents (launched Nov 2023), renamed Agents Classic. Not open to new customers from July 30, 2026. AWS recommends migrating to AgentCore.
  summary: Configuration-based agents with action groups and knowledge bases.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: strands-agents
  name: Strands Agents SDK
  status: ga
  summary: AWS open-source, model-driven SDK for building agents in code. Deployable on AgentCore Runtime or anywhere.
  docs: https://strandsagents.com/docs/
  pricing: null
- slug: bedrock-guardrails
  name: Amazon Bedrock Guardrails
  status: ga
  summary: Content filters (hate, insults, sexual, violence, misconduct, prompt attack), denied topics, word filters, PII filters, contextual grounding checks, and Automated Reasoning checks. Also usable standalone through the ApplyGuardrail API.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-knowledge-bases
  name: Amazon Bedrock Knowledge Bases
  status: ga
  summary: Managed RAG. Managed Knowledge Base (AWS runs ingestion, storage, and agentic retrieval) or customer-managed (bring your own vector store, such as OpenSearch Serverless, Aurora, or Neptune).
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-flows
  name: Amazon Bedrock Flows & Prompt management
  status: ga
  summary: Visual or API-built workflows linking prompts, models, knowledge bases, Lambda, and other AWS services, with versions and aliases.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-evaluations
  name: Amazon Bedrock Evaluations
  status: ga
  summary: Automatic, LLM-as-a-judge, and human evaluation jobs for models and RAG sources, including sources outside Bedrock.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: bedrock-data-automation
  name: Amazon Bedrock Data Automation
  status: ga
  summary: GenAI-based extraction of structured output from documents, images, video, and audio.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/bda.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: amazon-nova
  name: Amazon Nova
  status: ga
  summary: Amazon's first-party foundation models. Understanding (Nova Micro/Lite/Pro, Nova 2 Lite), creative (Nova Canvas image, Nova Reel video), speech-to-speech (Nova 2 Sonic), and multimodal embeddings.
  docs: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
  pricing: https://aws.amazon.com/bedrock/pricing/
- slug: kendra
  name: Amazon Kendra
  status: maintenance
  status_note: Maintenance Mode from June 30, 2026. No longer open to new customers from July 30, 2026. AWS recommends Bedrock Managed Knowledge Base.
  summary: ML-powered enterprise search with connectors and relevance tuning.
  docs: https://docs.aws.amazon.com/kendra/latest/dg/kendra-availability-change.html
  pricing: https://aws.amazon.com/kendra/pricing/
- slug: sagemaker-ai
  name: Amazon SageMaker AI
  status: ga
  status_note: Renamed from "Amazon SageMaker" on Dec 3, 2024. API namespaces are unchanged.
  summary: Fully managed service to build, train, and deploy ML models.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-unified-studio
  name: Amazon SageMaker Unified Studio
  status: ga
  summary: Single development experience across AWS data, analytics, and AI/ML services, organized as domains and projects. Part of the "next generation of Amazon SageMaker".
  docs: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/what-is-sagemaker-unified-studio.html
  pricing: https://aws.amazon.com/sagemaker/pricing/
- slug: sagemaker-studio
  name: Amazon SageMaker Studio
  status: ga
  summary: Web IDE suite for ML. JupyterLab, Code Editor (Code-OSS), RStudio, and Studio Classic.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-training
  name: SageMaker AI training jobs
  status: ga
  summary: Managed, ephemeral training clusters with built-in algorithms or your own containers and frameworks. Billed per instance-second.
  docs: https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-training.html
  pricing: https://aws.amazon.com/sagemaker/ai/pricing/
- slug: sagemaker-hyperpod
  name: Amazon SageMaker HyperPod
  status: ga
