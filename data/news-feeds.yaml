# Official provider news feeds for the weekly blog job (read by `npm run news`).
# Every URL below was fetched and parsed as valid RSS 2.0 or Atom with at least one entry on the
# `verified` date. Re-check with `npm run news -- --check`. Only add feeds published by the provider itself.
# format: rss | atom.  kind: announcements | blog | release-notes | certification | security
feeds:
  # ---- AWS ----
  - id: aws-whats-new
    name: AWS What's New
    provider: aws
    kind: announcements
    format: rss
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
    site: https://aws.amazon.com/new/
    verified: 2026-10-28
  - id: aws-news-blog
    name: AWS News Blog
    provider: aws
    kind: blog
    format: rss
    url: https://aws.amazon.com/blogs/aws/feed/
    site: https://aws.amazon.com/blogs/aws/
    verified: 2026-10-28
  - id: aws-training-certification-blog
    name: AWS Training and Certification Blog
    provider: aws
    kind: certification
    format: rss
    url: https://aws.amazon.com/blogs/training-and-certification/feed/
    site: https://aws.amazon.com/blogs/training-and-certification/
    verified: 2026-10-28
  - id: aws-architecture-blog
    name: AWS Architecture Blog
    provider: aws
    kind: blog
    format: rss
    url: https://aws.amazon.com/blogs/architecture/feed/
    site: https://aws.amazon.com/blogs/architecture/
    verified: 2026-10-28
  - id: aws-security-blog
    name: AWS Security Blog
    provider: aws
    kind: security
    format: rss
