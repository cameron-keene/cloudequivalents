    - Live metadata. S3 Metadata keeps journal and live inventory tables in S3 Tables that you query with SQL. On Azure, you process change feed logs yourself (for example, with Spark) to get a similar view.
  pricing:
    aws: Inventory is billed per million objects listed. Metadata adds per-update charges plus S3 Tables storage.
    azure: Inventory is billed per million objects scanned. Change feed is billed per change event recorded, plus storage.
  exams:
