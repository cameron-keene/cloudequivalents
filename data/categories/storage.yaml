- id: tape-gateway
  group: hybrid-storage
  capability: Virtual tape library in the cloud
  what_for: Replace physical tapes with cloud-stored virtual tapes while keeping your existing backup software.
  match: none
  answer: Azure has no equivalent of AWS Storage Gateway Tape Gateway, and Microsoft's comparison lists "None". On Azure, point backup software at Blob Storage directly (cool, cold, or archive tiers), or use Azure Backup.
  providers:
    aws: [tape-gateway]
    azure: []
  differences:
    - Many enterprise backup products can write to Azure Blob Storage natively, which removes the need for a virtual tape layer. Add immutable storage for ransomware protection.
  pricing:
    aws: Per GB written to AWS (capped monthly per gateway), plus virtual tape storage in S3, Glacier Flexible Retrieval, or Deep Archive, and retrieval fees.
    azure: Not applicable.
  exams:
