  pricing:
    aws: Per GB-month of SSD or Intelligent-Tiering storage, plus throughput capacity and backups.
    azure: Not applicable.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [netapp-files, nfs-file-storage]
  sources:
    - https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/what-is-fsx.html
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: lustre-file-storage
  group: file-storage
  capability: Managed Lustre parallel file system (HPC and AI)
  what_for: Feed thousands of compute or GPU nodes with very high aggregate throughput, typically linked to object storage.
  match: direct
  answer: Amazon FSx for Lustre maps to Azure Managed Lustre. Both run the open-source Lustre file system as a managed service and link to object storage (S3 or Blob Storage) for importing and exporting data.
  providers:
    aws: [fsx-lustre]
    azure: [managed-lustre]
  differences:
    - Object integration. FSx for Lustre links to S3 (or on-premises) data repositories. Azure Managed Lustre uses Lustre HSM with a Blob container for import and export.
    - Storage classes. FSx for Lustre offers scratch or persistent file systems on SSD, HDD, or the elastic Intelligent-Tiering class. Azure Managed Lustre is sold as throughput tiers of provisioned capacity.
    - Redundancy. For long-term redundancy, Azure Managed Lustre exports to Blob Storage with its own redundancy setting.
    - Kubernetes. Both have CSI drivers (EKS and AKS).
  pricing:
    aws: Per GB-month by deployment type, storage class, and throughput tier, plus Intelligent-Tiering storage and request charges.
    azure: Billed per provisioned capacity by throughput tier.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [file-caching, kubernetes-storage]
  sources:
    - https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html
    - https://learn.microsoft.com/en-us/azure/azure-managed-lustre/amlfs-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: file-caching
  group: file-storage
  capability: High-speed file cache in front of NFS or object data
  what_for: Present remote NFS or object data to cloud compute as a fast file system, loading data on first access.
  match: none
  answer: Amazon File Cache no longer has an Azure equivalent. Azure HPC Cache, the closest match, retired on Sep 30, 2025. For Blob-backed data, Azure Managed Lustre with Blob integration covers much of the same need.
  providers:
    aws: [file-cache]
    azure: [hpc-cache]
  differences:
    - Amazon File Cache is Lustre-based and can link up to eight S3 or NFSv3 repositories (all of one type). Azure Managed Lustre covers the Blob-backed case, but Azure has no managed cache in front of on-premises NFS exports.
  pricing:
    aws: Per GB-month of provisioned cache storage, plus metadata storage.
    azure: Not applicable (retired).
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [lustre-file-storage]
