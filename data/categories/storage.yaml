# ───────────────────────── HYBRID ─────────────────────────
- id: file-gateway
  group: hybrid-storage
  capability: On-premises file gateway to cloud object storage
  what_for: Give on-premises apps NFS or SMB shares whose data lands in cloud object storage, with a local cache for recent files.
  match: partial
  answer: Microsoft maps AWS Storage Gateway S3 File Gateway to Azure Data Box Gateway and Azure File Sync. Data Box Gateway is the closer technical match (NFS or SMB in, Azure Storage out). File Sync works only with Windows Server and syncs to Azure Files rather than Blob.
  providers:
    aws: [s3-file-gateway]
    azure: [data-box-gateway, azure-file-sync]
  differences:
    - Data Box Gateway is a virtual appliance (Hyper-V or VMware) that caches data locally and uploads it to Blob Storage or Azure Files, similar to S3 File Gateway. Its current release notes date from 2021.
    - Azure File Sync uses your Windows Servers as the cache, with cloud tiering, and can sync many sites through one Azure file share.
    - S3 File Gateway stores files as normal S3 objects. Data Box Gateway also writes normal blobs or files. File Sync stores data in Azure Files.
  pricing:
    aws: Per GB written to AWS (capped monthly per gateway), plus S3 storage and requests.
    azure: Data Box Gateway has a monthly device fee plus storage. Azure File Sync is billed per registered server per month, plus Azure Files charges.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  flags:
    - Data Box Gateway has no announced retirement, but it hasn't had a release since 2021. Check its status before you build on it.
  related: [file-server-caching, block-gateway, tape-gateway]
  sources:
    - https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
    - https://learn.microsoft.com/en-us/azure/databox-gateway/data-box-gateway-overview
    - https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: file-server-caching
  group: hybrid-storage
  capability: On-premises cache for cloud Windows file shares
  what_for: Let branch offices work with fast local copies of cloud file shares over SMB.
  match: partial
  answer: Amazon FSx File Gateway, closed to new customers since Oct 28, 2024, maps to Azure File Sync. File Sync caches Azure file shares on your own Windows Servers, with cloud tiering.
  providers:
    aws: [fsx-file-gateway]
    azure: [azure-file-sync]
  differences:
    - FSx File Gateway is an appliance in front of FSx for Windows File Server. Azure File Sync is an agent you install on existing Windows Servers, which then act as the cache.
    - Azure File Sync syncs multiple sites through the cloud and keeps the full namespace visible, recalling tiered files when they're opened.
  pricing:
    aws: Existing customers pay gateway charges plus FSx charges.
    azure: Per registered server per month, plus Azure Files charges.
  exams:
