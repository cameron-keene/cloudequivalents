rows:
# ───────────────────────── OBJECT STORAGE ─────────────────────────
- id: object-storage
  group: object-storage
  capability: Object storage
  what_for: Store any amount of unstructured data (files, images, backups, logs, data lake files) behind an HTTP API, with high durability and pay-per-use pricing.
  match: direct
  answer: The Azure equivalent of Amazon S3 is Azure Blob Storage. Both store objects in flat containers (S3 buckets, Blob containers) with an HTTP API, multiple cost tiers, versioning, replication, and WORM locking.
  providers:
    aws: [s3]
    azure: [blob-storage]
  differences:
    - Account model. S3 buckets are top-level resources with globally unique names. Blob containers live inside a storage account, and the account sets the redundancy, default access tier, network rules, and some features (such as the hierarchical namespace) for every container in it.
    - Redundancy. S3 Standard stores data across at least three AZs by default; One Zone classes and Express One Zone use a single AZ. On Azure you choose per account. LRS is a single datacenter, ZRS spans zones, and GRS/GZRS add an asynchronous copy in the paired region. Pick ZRS explicitly if you want S3-like zone resilience.
    - Object types. S3 has one object type (with multipart upload). Blob Storage has block blobs (the S3 equivalent), append blobs (for logs), and page blobs (random-access, used by legacy unmanaged disks).
    - Bucket types. S3 also has directory buckets (Express One Zone), table buckets (S3 Tables), and vector buckets (S3 Vectors). Azure gets the equivalent features from premium block blob accounts, Fabric OneLake, and Azure AI Search.
    - Consistency. Both offer strong read-after-write consistency for objects in the primary region.
  pricing:
    aws: Per GB-month by storage class, plus per-request charges, retrieval fees for IA and Glacier classes, and data transfer out.
    azure: Per GB-month by access tier and redundancy option, plus per-10,000-operation charges, retrieval fees for cool, cold, and archive, geo-replication data transfer for GRS/GZRS, and data transfer out.
  exams:
    aws: [CLF-C02, SAA-C03, SOA-C03, SAP-C02]
    azure: [AZ-900, AZ-104, AZ-305]
  faq:
    - q: What is the Azure equivalent of an S3 bucket?
      a: A Blob Storage container. Bucket-level settings such as redundancy, firewall, and encryption defaults mostly live on the storage account that holds the container, so many AWS teams create one storage account per workload or data classification.
    - q: Is Azure Blob Storage as durable as S3?
      a: It depends on the redundancy you choose. Microsoft documents at least 11 nines of annual durability for LRS, 12 nines for ZRS, and 16 nines for GRS and GZRS. S3 Standard is designed for 11 nines across multiple AZs.
  related: [storage-classes, object-replication, object-access-control, data-lake-storage]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-overview
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: object-access-control
  group: object-storage
  capability: Object storage access control and temporary sharing links
  what_for: Decide who can read or write objects, from which networks, and hand out short-lived links without sharing credentials.
  match: direct
  answer: S3 IAM policies, bucket policies, and presigned URLs map to Microsoft Entra ID with Azure RBAC data roles, the storage account firewall and private endpoints, and shared access signatures (SAS).
  providers:
    aws: [s3-access-control]
    azure: [storage-access-control]
  differences:
    - Resource policies. S3 bucket policies are JSON resource policies that can grant cross-account access and restrict by VPC endpoint or source IP. Azure has no bucket policy. Access is RBAC role assignments (optionally with ABAC conditions) plus account-level network rules.
    - Network control. On AWS, network restriction is usually written into the bucket policy (aws:SourceVpce). On Azure it's the storage firewall, private endpoints, or network security perimeter, configured on the storage account, not per container.
    - Temporary links. A presigned URL is signed with the creator's credentials and lasts up to 7 days. A user delegation SAS is signed with Entra credentials and is the recommended SAS type. Service and account SAS are signed with the account key, so Microsoft recommends disallowing shared key access where possible.
    - Public access. S3 Block Public Access is on by default for new buckets. On Azure, anonymous access is controlled by the account's "Allow Blob anonymous access" setting and each container's public access level.
  pricing:
    aws: No charge for IAM or bucket policies. Requests are billed normally.
    azure: No charge for RBAC or SAS. Private endpoints are billed per hour and per GB processed.
  exams:
    aws: [SAA-C03, SCS-C03, SOA-C03]
    azure: [AZ-104, AZ-305, SC-500]
  related: [object-storage, access-points]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-access-control.html
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/ShareObjectPreSignedURL.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: access-points
  group: object-storage
  capability: Per-application access endpoints for a shared dataset
  what_for: Give each team or app its own named endpoint, permissions, and network restriction onto the same shared bucket.
  match: none
  answer: Azure has no equivalent of S3 Access Points. On Azure you get a similar result by splitting data into containers or directories with their own RBAC assignments (or ABAC conditions), and using private endpoints for network isolation.
  providers:
    aws: [s3-access-points]
    azure: []
  differences:
    - S3 Access Points can also front FSx for NetApp ONTAP and FSx for OpenZFS volumes, so S3-API tools can read file data. On Azure, Azure NetApp Files has its own S3-compatible object REST API on volumes.
    - Multi-Region Access Points (one global endpoint across buckets in several Regions) also have no direct Azure equivalent. RA-GRS gives a secondary read endpoint, and Front Door can route across accounts.
  pricing:
    aws: No extra charge for Access Points. Multi-Region Access Points add a per-GB data routing fee.
    azure: Not applicable.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [object-access-control, netapp-files]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html
    - https://learn.microsoft.com/en-us/azure/azure-netapp-files/object-rest-api-introduction
    - https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory

- id: low-latency-object
  group: object-storage
  capability: Low-latency, high-request-rate object storage
  what_for: Serve objects with consistent single-digit-millisecond latency for request-heavy jobs such as ML training, analytics, and interactive apps.
  match: partial
  answer: S3 Express One Zone maps most closely to Azure premium block blob storage accounts. Both use SSDs and trade higher storage prices for lower latency and lower request costs, but they differ in zone placement and API.
  providers:
    aws: [s3-express-one-zone]
    azure: [premium-block-blob]
  differences:
    - Placement. Express One Zone lives in one AZ you choose (to sit next to your compute) and isn't replicated across AZs. Premium block blob accounts support LRS or ZRS, and you don't pick the zone.
    - API. Express One Zone uses directory buckets and session-based authentication (CreateSession), with some API differences. Premium block blob uses the normal Blob API, so tools work unchanged.
    - Tiering. Neither can use the colder tiers. To move data to cheaper storage you copy it to a standard bucket or GPv2 account.
  pricing:
    aws: Per GB-month at a higher rate than S3 Standard, with lower per-request charges.
    azure: Higher per GB-month than hot, with lower per-operation charges. Microsoft shows it is cheaper overall for transaction-heavy workloads.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [object-storage, storage-classes]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/directory-bucket-high-performance.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-block-blob-premium

# ───────────────────────── OBJECT DATA MANAGEMENT ─────────────────────────
- id: storage-classes
  group: object-data-management
  capability: Object storage cost tiers (infrequent access and archive)
  what_for: Pay less for data you rarely read, in exchange for retrieval fees, minimum storage durations, or slower access.
  match: direct
  answer: S3 storage classes map to Blob access tiers. Standard-IA maps to cool (30-day minimum), Glacier Instant Retrieval maps to cold (90 days), and Glacier Flexible Retrieval and Deep Archive both map to archive (180 days, offline).
  providers:
    aws: [s3-storage-classes, amazon-glacier-vaults]
    azure: [blob-access-tiers]
  differences:
    - Granularity. In S3 the storage class is set per object. On Azure the tier is set per block blob, with a default tier (hot, cool, cold, or smart) set on the account.
    - Archive. Azure has one archive tier. Rehydration takes up to 15 hours and must go to an online tier before you can read. S3 has two archive classes, Glacier Flexible Retrieval (minutes to hours) and Deep Archive (within 12 hours for standard retrieval, lowest cost), and restores create a temporary copy.
    - Redundancy limits. Blob archive isn't supported in ZRS, GZRS, or RA-GZRS accounts. S3 Glacier classes keep their multi-AZ design.
    - Single-zone tiers. S3 One Zone-IA has no matching Azure tier. The nearest is the cool tier in an LRS account.
    - Legacy. The original standalone Amazon Glacier vault service accepts no new customers. Use the S3 Glacier storage classes.
  pricing:
    aws: Lower GB-month as you go colder, with per-GB retrieval fees, minimum durations (30, 90, or 180 days), and a 128 KB minimum billable object size on the IA classes and Glacier Instant Retrieval.
    azure: Lower GB-month as you go colder, with per-GB retrieval fees and prorated early-deletion charges for cool (30 days), cold (90 days), and archive (180 days).
  exams:
    aws: [CLF-C02, SAA-C03, SOA-C03]
    azure: [AZ-900, AZ-104, AZ-305]
  faq:
    - q: Is the Azure cold tier the same as S3 Glacier Instant Retrieval?
      a: Microsoft's AWS comparison maps them. Both are online, millisecond-access tiers for rarely read data, with a 90-day minimum. Azure archive is offline and maps to Glacier Flexible Retrieval and Deep Archive.
  related: [auto-tiering, object-lifecycle, low-latency-object]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
    - https://docs.aws.amazon.com/amazonglacier/latest/dev/introduction.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: auto-tiering
  group: object-data-management
  capability: Automatic access-based tiering
  what_for: Let the service move each object to a cheaper tier when nobody reads it, and back when they do, without writing rules.
  match: direct
  answer: S3 Intelligent-Tiering maps to Azure Blob smart tier. Both watch access patterns, move cold objects down automatically, move them back on access, and skip retrieval and early-deletion fees in exchange for a monitoring fee.
  providers:
    aws: [s3-intelligent-tiering]
    azure: [blob-smart-tier]
  differences:
    - Timing. Intelligent-Tiering moves objects to Infrequent Access after 30 days and Archive Instant Access after 90. Smart tier moves to cool after 30 days and to cold after 60 more days (90 in total).
    - Archive. Intelligent-Tiering can optionally add Archive Access and Deep Archive Access tiers. Smart tier stays on online tiers and never archives.
    - Scope. Intelligent-Tiering is a storage class you set per object or with lifecycle rules. Smart tier is the account's default access tier and applies to blobs without an explicit tier. Once a blob gets an explicit tier, it can't go back to smart tier.
    - Requirements. Smart tier needs a zone-redundant (ZRS, GZRS, or RA-GZRS) GPv2 account. Intelligent-Tiering works in any general purpose bucket.
    - Small objects. Both leave objects under 128 KB (KiB on Azure) in the frequent or hot tier and don't charge monitoring for them.
  pricing:
    aws: Per GB-month for each access tier plus a monthly monitoring and automation fee per object of 128 KB or larger. No retrieval fees.
    azure: Capacity billed at the hot, cool, or cold rate for wherever each blob currently sits, plus a monthly monitoring fee per object over 128 KiB. No retrieval, early-deletion, or in-tier transition fees, and operations are billed at hot-tier rates.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  flags:
    - Smart tier is new, so current AZ-104 and AZ-305 study guides may not cover it yet.
  related: [storage-classes, object-lifecycle]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-smart

- id: object-lifecycle
  group: object-data-management
  capability: Object lifecycle rules
  what_for: Automatically move objects to cheaper tiers, or delete them, as they age.
  match: direct
  answer: S3 Lifecycle configurations map to Azure Blob lifecycle management policies. Both use rules filtered by prefix or tags to transition and expire current and previous versions.
  providers:
    aws: [s3-lifecycle]
    azure: [blob-lifecycle-management]
  differences:
    - Conditions. S3 rules use object age (days since creation or since becoming noncurrent) and can filter by object size. Azure rules can use creation time, last-modified time, or last-access time (when access tracking is on), and filter by prefix or blob index tags.
    - Archive restores. Neither can rehydrate archived objects with lifecycle rules.
    - Timing. Both apply rules asynchronously. Azure says new or edited policies can take up to 24 hours to start.
    - At scale. For conditions across many accounts, Azure adds Storage Actions. AWS uses S3 Batch Operations for one-off bulk changes.
  pricing:
    aws: No charge for rules. Transition requests are billed per 1,000 objects.
    azure: No charge for the policy. Tier changes are billed as operations for the destination tier.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104]
  related: [storage-classes, auto-tiering, batch-object-operations]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview

- id: object-replication
  group: object-data-management
  capability: Object replication across regions or accounts
  what_for: Keep a copy of objects in another region or account for disaster recovery, compliance, or lower-latency reads.
  match: direct
  answer: S3 Cross-Region and Same-Region Replication map to Azure Blob object replication. Azure also has a no-configuration option, geo-redundant storage (GRS or GZRS), which copies the whole account to its paired region.
  providers:
    aws: [s3-replication]
    azure: [object-replication, storage-redundancy]
  differences:
    - Prerequisites. S3 replication needs versioning on both buckets. Azure object replication needs versioning on both accounts and change feed on the source.
    - SLA. S3 Replication Time Control offers a 15-minute SLA. Azure has an optional priority replication mode with its own performance target for same-continent pairs.
    - Existing data. S3 live replication covers new objects, and Batch Replication handles existing ones. Azure object replication can also copy existing blobs when you set the policy's copy scope.
    - Account-wide geo-redundancy. GRS/GZRS has no S3 equivalent. It replicates every object to the fixed paired region with no rules, and the secondary is readable only with RA-GRS/RA-GZRS or after failover.
    - Cross-tenant replication is off by default on Azure accounts created since Dec 15, 2023. Cross-account S3 replication needs an IAM role and a destination bucket policy.
  pricing:
    aws: Destination storage, replication requests, inter-Region data transfer, and a per-GB RTC fee when enabled.
    azure: Object replication bills destination storage, write operations, change feed, versions, and cross-region transfer. GRS/GZRS pricing includes the secondary copy plus a geo-replication transfer charge.
  exams:
    aws: [SAA-C03, SAP-C02, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [object-storage, object-lock]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: object-lock
  group: object-data-management
  capability: WORM / immutable object storage
  what_for: Make objects impossible to change or delete for a retention period or until a legal hold is lifted, for compliance or ransomware protection.
  match: direct
  answer: S3 Object Lock maps to immutable storage for Azure Blob Storage. Both support time-based retention and legal holds, and both are assessed for SEC 17a-4(f), CFTC, and FINRA.
  providers:
    aws: [s3-object-lock]
    azure: [immutable-blob-storage]
  differences:
    - Modes. Object Lock has governance mode (users with special permission can bypass it) and compliance mode (nobody can shorten it, not even root). Azure time-based policies are unlocked (editable, for testing) or locked (can only be extended), which is closest to compliance mode.
    - Scope. Object Lock applies per object version, with bucket defaults. Azure has container-level WORM and version-level WORM (account, container, or blob version).
    - Versioning. Object Lock requires versioning. Azure version-level WORM requires versioning; container-level WORM doesn't.
  pricing:
    aws: No extra charge beyond storage and requests.
    azure: No extra charge beyond storage and operations.
  exams:
    aws: [SAA-C03, SCS-C03]
    azure: [AZ-104, AZ-305]
  related: [object-replication, backup-vault-lock]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview

- id: batch-object-operations
  group: object-data-management
  capability: Bulk operations on billions of objects
  what_for: Run one action (copy, tag, change tier, delete, restore) across a huge set of objects without writing your own job runner.
  match: partial
  answer: S3 Batch Operations maps most closely to Azure Storage Actions. Both are serverless engines that apply an operation to very large object sets. S3 works from a manifest of objects, while Storage Actions evaluates conditions across one or more accounts.
  providers:
    aws: [s3-batch-operations]
    azure: [storage-actions]
  differences:
    - Selection. S3 Batch Operations works from a CSV manifest, an S3 Inventory report, or a generated manifest. Storage Actions defines conditions (such as name, tags, age, or tier) evaluated against every blob in the assigned accounts.
    - Operations. S3 can invoke a Lambda function per object for custom logic. Storage Actions offers a fixed set of operations (such as set tier, tags, immutability, legal hold, and delete).
    - Accounts. Storage Actions can target many storage accounts with one task. An S3 Batch Operations job works on one manifest.
  pricing:
    aws: Per job plus per million objects processed, plus the underlying request charges.
    azure: Billed per task execution and per object evaluated and operated on, plus the underlying storage operations.
  exams:
    aws: [SOA-C03]
    azure: [AZ-104]
  related: [object-lifecycle, object-inventory]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops.html
    - https://learn.microsoft.com/en-us/azure/storage-actions/overview

# ───────────────────────── OBJECT ACCESS & ANALYTICS ─────────────────────────
- id: data-lake-storage
  group: object-access
  capability: Data lake storage with real directories
  what_for: Store analytics data in folders that Spark, Hadoop, and SQL engines can list, rename, and secure efficiently.
  match: partial
  answer: On AWS, data lakes are built directly on S3 general purpose buckets. On Azure, you turn on the hierarchical namespace for a storage account to get Azure Data Lake Storage, which adds real directories, atomic renames, and POSIX-style ACLs.
  providers:
    aws: [s3]
    azure: [data-lake-storage]
  differences:
    - Namespace. S3 general purpose buckets are flat, and folders are key prefixes, so "renaming" a folder copies every object. ADLS directories are real, with atomic rename and delete. (S3 directory buckets do have a hierarchical namespace, but only for Express One Zone.)
    - Permissions. ADLS supports POSIX-like ACLs on directories and files as well as RBAC. On AWS, fine-grained data lake permissions usually come from Lake Formation or S3 Access Grants.
    - Feature trade-offs. The hierarchical namespace is required for SFTP and NFS 3.0 on Blob, but some Blob features have limits on ADLS accounts. Check the feature support matrix before enabling it.
    - Drivers. Hadoop and Spark use S3A on AWS and ABFS on Azure.
  pricing:
    aws: Standard S3 pricing by storage class and requests.
    azure: Blob pricing by tier, with Data Lake Storage transaction pricing for hierarchical-namespace accounts.
  exams:
    aws: [DEA-C01, SAA-C03]
    azure: [AZ-305]
  related: [lake-tables, object-storage, object-file-access]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction

- id: lake-tables
  group: object-access
  capability: Managed open table storage (Apache Iceberg)
  what_for: Store analytics tables in an open format that many query engines can read and write, with the storage service handling table maintenance.
  match: partial
  answer: Amazon S3 Tables (Iceberg table buckets) maps most closely to Microsoft Fabric OneLake. OneLake stores tables in Delta Lake format and can expose them as Iceberg (and Iceberg as Delta) through metadata virtualization. Azure Blob Storage itself has no table bucket type.
  providers:
    aws: [s3-tables]
    azure: [onelake]
  differences:
    - Native format. S3 Tables is Iceberg-native. OneLake is Delta-first, and Iceberg works through virtualized metadata and shortcuts.
    - Platform. S3 Tables is a storage feature you use from Athena, Redshift, EMR, or any Iceberg engine. OneLake comes with Microsoft Fabric and is used through a Fabric capacity.
    - Maintenance. S3 Tables automatically compacts files and manages snapshots. In Fabric, table maintenance runs from Fabric workloads.
  pricing:
    aws: Per GB-month storage and per-request charges, plus monitoring and compaction charges.
    azure: OneLake storage is billed per GB-month. Compute comes from the Fabric capacity you buy.
  exams:
    aws: [DEA-C01]
    azure: [AZ-305]
  flags:
    - This mapping crosses into analytics. A later Analytics category may refine it.
  related: [data-lake-storage, object-inventory]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html
    - https://learn.microsoft.com/en-us/fabric/onelake/onelake-iceberg-tables
    - https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview

- id: object-file-access
  group: object-access
  capability: Mount object storage as a file system
  what_for: Let file-based applications, scripts, and AI agents read and write bucket data through normal file paths.
  match: partial
  answer: Amazon S3 Files (a managed shared file system over a bucket) and Mountpoint for Amazon S3 map to NFS 3.0 support for Blob Storage and BlobFuse2. Azure has no managed file-system layer over Blob comparable to S3 Files.
  providers:
    aws: [s3-files, mountpoint-s3]
    azure: [blob-nfs, blobfuse2]
  differences:
    - Semantics. S3 Files provides full file-system semantics with a managed high-performance layer and two-way sync to the bucket. Mountpoint, BlobFuse2, and NFS 3.0 on Blob are thinner layers that aren't fully POSIX (for example, renames aren't atomic in BlobFuse2).
    - Where it mounts. S3 Files mounts on EC2, Lambda, EKS, and ECS. NFS 3.0 on Blob mounts from Linux clients in Azure or on premises over a private network. BlobFuse2 and Mountpoint are client-side FUSE drivers on Linux.
    - Prerequisites. NFS 3.0 on Blob needs the hierarchical namespace. BlobFuse2 works with flat or hierarchical accounts.
    - Workload fit. NFS 3.0 on Blob is tuned for large, sequential, read-heavy jobs. For general shared file workloads on Azure, use Azure Files or Azure NetApp Files.
  pricing:
    aws: S3 Files charges for data on its high-performance storage, small-file reads and all writes, and S3 requests made during sync. Mountpoint is free; you pay for S3 requests.
    azure: NFS 3.0 and BlobFuse2 are free. You pay normal Blob storage and transaction charges.
  exams:
    aws: [SAA-C03]
    azure: [AZ-104]
  flags:
    - S3 Files launched Apr 7, 2026, so current AWS exams may not cover it yet.
  related: [data-lake-storage, nfs-file-storage]
  sources:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files.html
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/mountpoint.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/network-file-system-protocol-support
    - https://learn.microsoft.com/en-us/azure/storage/blobs/blobfuse2-what-is

- id: vector-storage
  group: object-access
  capability: Low-cost vector storage and similarity search
  what_for: Store large numbers of embeddings cheaply and query them for RAG and semantic search, without running a vector database.
  match: partial
  answer: Amazon S3 Vectors has no Azure storage-layer equivalent. The closest Azure service is Azure AI Search, a search engine with vector, hybrid, and keyword search. Azure Blob Storage doesn't offer vector indexes.
  providers:
    aws: [s3-vectors]
    azure: [ai-search]
  differences:
    - Model. S3 Vectors is storage with built-in similarity queries, billed per use with no cluster. AI Search is a provisioned search service (billed per search unit) with much richer querying, including hybrid search, semantic ranking, filters, and agentic retrieval.
    - Latency. S3 Vectors favors cost over speed (subsecond for infrequent queries, as low as about 100 ms for frequent ones). AI Search is built for interactive search latency.
    - Integration. S3 Vectors plugs into Bedrock Knowledge Bases and can serve as a lower-cost tier for OpenSearch. AI Search plugs into Microsoft Foundry.
  pricing:
    aws: Per GB-month of vector storage, plus per-request charges for uploads and queries.
    azure: Billed per search unit-hour by tier, plus semantic ranker and enrichment add-ons.
  exams:
    aws: [AIF-C01, SAA-C03]
    azure: [AI-102, AZ-305]
  related: [object-storage]
  sources:
