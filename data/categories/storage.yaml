# ───────────────────────── BACKUP & DR ─────────────────────────
- id: backup-service
  group: backup-dr
  capability: Centralized backup service
  what_for: Define backup schedules and retention once, apply them to many resources, and restore from one place.
  match: direct
  answer: AWS Backup maps to Azure Backup. Both are policy-based managed backup services that cover VMs, disks, file shares, object storage, databases, and Kubernetes, plus some on-premises workloads.
  providers:
    aws: [aws-backup]
    azure: [azure-backup]
  differences:
    - Vaults. AWS Backup uses backup vaults, with cross-Region and cross-account copies. Azure Backup uses two vault types. Recovery Services vaults cover VMs, SQL Server and SAP HANA in VMs, Azure Files, and on-premises machines. Backup vaults cover disks, blobs, AKS, and PostgreSQL.
    - Databases. AWS Backup covers RDS, Aurora, DynamoDB, and other AWS databases. Azure Backup covers SQL Server, SAP HANA, and SAP ASE in VMs, plus PostgreSQL and MySQL flexible servers. Azure SQL Database and Cosmos DB rely on their own built-in backups.
    - Object storage. AWS Backup backs up S3 buckets. Azure Backup has operational backup for blobs (local and continuous) and vaulted backup (offsite copies).
    - On premises. AWS Backup supports VMware VMs through a gateway appliance. Azure Backup uses the MARS agent or Microsoft Azure Backup Server (MABS).
    - Governance. AWS Backup integrates with AWS Organizations backup policies. Azure Backup uses Azure Policy and at-scale management in the Azure portal.
  pricing:
    aws: Per GB-month of backup storage (warm or cold tier) by resource type, plus restores and cross-Region transfer.
    azure: A monthly protected-instance fee based on size, plus backup storage per GB-month (LRS, ZRS, or GRS) and snapshot storage.
  exams:
    aws: [SAA-C03, SOA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  related: [backup-vault-lock, block-snapshots, disaster-recovery]
  sources:
    - https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
    - https://learn.microsoft.com/en-us/azure/backup/backup-overview
    - https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: backup-vault-lock
  group: backup-dr
  capability: Immutable and isolated backup vaults (ransomware protection)
  what_for: Make sure backups can't be deleted or shortened, even by an attacker with admin rights, and can still be restored if an account is compromised.
  match: partial
  answer: AWS Backup Vault Lock and logically air-gapped vaults map to Azure Backup immutable vaults (which can be locked), combined with soft delete and multi-user authorization through Resource Guard.
  providers:
    aws: [backup-air-gapped-vault]
    azure: [backup-immutable-vault]
  differences:
    - Isolation. Logically air-gapped vaults can be shared to a recovery account through AWS RAM and support multi-party approval to recover if the owning account is lost. Azure has no direct equivalent of that recovery path. Its protection comes from locked immutability, soft delete, and a Resource Guard kept in a separate subscription or tenant.
    - WORM. Azure is moving locked-immutable backups onto WORM storage by region and workload, and the backup service enforces immutability until then. AWS Vault Lock in compliance mode can't be removed after its grace period.
  pricing:
    aws: Logically air-gapped vault storage is billed per GB-month by resource type. Vault Lock has no extra charge.
    azure: No extra charge for immutability or soft delete beyond normal backup pricing.
  exams:
    aws: [SAA-C03, SCS-C03]
    azure: [AZ-104, AZ-305, SC-500]
  related: [backup-service, object-lock]
  sources:
    - https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
    - https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept

- id: disaster-recovery
  group: backup-dr
  capability: Server replication and disaster recovery
  what_for: Continuously replicate servers to another site or region and fail over quickly if the primary site goes down.
  match: direct
  answer: AWS Elastic Disaster Recovery (DRS) maps to Azure Site Recovery (ASR). Both replicate servers continuously, run non-disruptive test failovers, and support failback.
  providers:
    aws: [elastic-disaster-recovery]
    azure: [site-recovery]
  differences:
    - Sources. DRS replicates on-premises and cloud servers into AWS, and EC2 instances between Regions. ASR replicates Azure VMs between regions, plus on-premises VMware and Hyper-V VMs and physical servers into Azure.
    - Staging. DRS keeps a low-cost staging area (lightweight replication servers and volumes) and launches full instances only for drills or recovery. ASR replicates to disks in the target region and creates VMs on failover.
    - Orchestration. ASR has recovery plans with scripts and manual steps. DRS uses launch settings and post-launch actions.
  pricing:
    aws: Per replicating source server per hour, plus staging-area EC2, EBS, and snapshots, and recovery instances while running.
    azure: Per protected instance per month, plus replica disk storage and compute after failover.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  related: [backup-service, block-snapshots]
  sources:
    - https://docs.aws.amazon.com/drs/latest/userguide/what-is-drs.html
    - https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
    - https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture

# ───────────────────────── DATA TRANSFER ─────────────────────────
- id: online-data-migration
  group: data-transfer
  capability: Online file and object migration
  what_for: Copy large file shares or buckets into the cloud, or between clouds, over the network with verification and scheduling.
  match: partial
  answer: AWS DataSync maps to Azure Storage Mover (managed migration from NFS, SMB, and S3 sources) and AzCopy (command-line copy, including directly from S3). Microsoft's comparison page pairs DataSync with Azure File Sync, but File Sync is for ongoing sync of Windows servers, not migration.
  providers:
    aws: [datasync]
    azure: [storage-mover, azcopy]
  differences:
    - Direction. DataSync moves data into, out of, and between AWS storage services, including from Azure Blob Storage, Azure Files, and Google Cloud Storage. Storage Mover moves data into Azure only.
    - Sources. Storage Mover supports NFS and SMB shares (through an agent) and AWS S3, with FSx SMB and Google Cloud Storage in preview. Objects in S3 Glacier classes must be restored first.
    - Cost. DataSync bills per GB transferred. Storage Mover features are currently free, and AzCopy is a free tool, so you pay only for storage, transactions, and network.
  pricing:
    aws: Per GB transferred, plus any S3 request and data transfer charges.
    azure: Storage Mover and AzCopy are free. You pay for target storage and transactions, plus any egress charged by the source.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  flags:
    - Microsoft's aws-professional storage page maps DataSync to Azure File Sync. This guide maps it to Storage Mover and AzCopy because they match DataSync's migration purpose.
  related: [offline-data-transfer, managed-file-transfer, file-gateway]
  sources:
    - https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
    - https://learn.microsoft.com/en-us/azure/storage-mover/service-overview
    - https://learn.microsoft.com/en-us/azure/storage-mover/billing
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: managed-file-transfer
  group: data-transfer
  capability: Managed SFTP / FTP endpoints
  what_for: Let partners and legacy systems drop off and pick up files over SFTP or FTPS straight into cloud storage, without running servers.
  match: partial
  answer: AWS Transfer Family maps to SFTP support for Azure Blob Storage. Azure covers SFTP only. For FTPS, FTP, or AS2 you need a partner product or Logic Apps.
  providers:
    aws: [transfer-family]
    azure: [blob-sftp]
  differences:
    - Protocols. Transfer Family supports SFTP, FTPS, FTP, and AS2, plus web apps and SFTP connectors to remote servers. Blob SFTP is SFTP only.
    - Targets. Transfer Family stores to S3 or EFS. Blob SFTP writes to a Blob Storage account with the hierarchical namespace enabled.
    - Identity. Transfer Family supports service-managed users, AWS Directory Service, or a custom identity provider. Blob SFTP uses local users (password or SSH key, up to 50,000 per account) or Microsoft Entra ID.
  pricing:
    aws: Per protocol enabled per endpoint-hour, plus per GB uploaded and downloaded, and connector and web app charges.
    azure: An hourly charge while SFTP is enabled on the account, plus normal Blob storage, transaction, and egress charges.
  exams:
    aws: [SAA-C03]
    azure: [AZ-104]
  related: [online-data-migration, data-lake-storage]
  sources:
    - https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
    - https://learn.microsoft.com/en-us/azure/storage/blobs/secure-file-transfer-protocol-support

- id: offline-data-transfer
  group: data-transfer
  capability: Offline bulk data transfer (ship or carry your data)
  what_for: Move tens or hundreds of terabytes when the network is too slow, by moving physical devices instead.
  match: partial
  answer: Microsoft maps AWS Snowball Edge to Azure Data Box, but AWS's full-shutdown page lists Snowball Edge as shut down on November 12, 2025. AWS now points to Data Transfer Terminal (you bring your own devices to an AWS location) or DataSync. Azure Data Box ships Microsoft devices to you, now in 120 TB and 525 TB next-gen models.
  providers:
    aws: [snowball-edge, data-transfer-terminal]
    azure: [data-box]
  differences:
    - Model. Data Box is a shipped appliance you fill on site and send back. Data Transfer Terminal is a reservable facility where you bring your own storage devices and upload over high-speed links.
    - Direction. Data Box supports both import and export.
    - Edge compute. Snowball Edge could also run compute at the edge. AWS now recommends Outposts or partners for that, and the Azure counterparts are Azure Local and Azure Stack Edge.
    - Legacy devices. Azure Data Box Heavy is retired, and the 80 TB Data Box is being retired region by region as next-gen devices arrive.
  pricing:
    aws: Data Transfer Terminal is billed for the time you reserve. Snowball jobs were billed per job, per day, and for shipping.
    azure: A per-order service fee that includes a set number of days, plus extra days, shipping, and target storage.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  flags:
    - AWS sources conflict. The full-shutdown page lists Snowball Edge as shut down on November 12, 2025, while the Snowball developer guide only says it's unavailable to new customers. Check with AWS if you still depend on it.
  related: [online-data-migration]
  sources:
    - https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html
    - https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html
    - https://docs.aws.amazon.com/datatransferterminal/latest/userguide/what-is-dtt.html
    - https://learn.microsoft.com/en-us/azure/databox/data-box-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage
