- id: block-gateway
  group: hybrid-storage
  capability: Cloud-backed iSCSI volumes on premises
  what_for: Give on-premises servers iSCSI disks whose data is stored or backed up in the cloud.
  match: none
  answer: Azure has no current equivalent of AWS Storage Gateway Volume Gateway. Microsoft's comparison lists "None", and StorSimple, Azure's former hybrid storage array, has reached end of support.
  providers:
    aws: [volume-gateway]
    azure: [storsimple]
  differences:
    - On Azure, the usual alternatives are Azure Backup for on-premises servers, Azure Site Recovery for replication into Azure, or Azure Local with its own storage.
  pricing:
    aws: Per GB written to AWS (capped monthly per gateway), plus volume storage and EBS snapshots.
    azure: Not applicable.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [file-gateway, tape-gateway]
