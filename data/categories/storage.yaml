# ───────────────────────── BLOCK STORAGE ─────────────────────────
- id: block-volumes
  group: block-storage
  capability: VM block storage volumes
  what_for: Give virtual machines persistent disks for operating systems, databases, and applications.
  match: direct
  answer: The Azure equivalent of Amazon EBS is Azure managed disks. Microsoft maps gp2/gp3 to Standard SSD or Premium SSD, gp3 to Premium SSD v2, and io2 to Ultra Disk, and recommends testing, because performance limits don't line up exactly.
  providers:
    aws: [ebs]
    azure: [managed-disks]
  differences:
    - Performance model. gp3 includes 3,000 IOPS and 125 MiB/s and lets you buy more separately, the same idea and baseline as Premium SSD v2. Classic Premium SSD and Standard SSD use fixed size tiers where performance comes with size, plus bursting.
    - Limits. gp3 goes to 64 TiB, 80,000 IOPS, and 2,000 MiB/s, and io2 Block Express to 64 TiB, 256,000 IOPS, and 4,000 MiB/s. Premium SSD v2 goes to 64 TiB, 80,000 IOPS, and 2,000 MB/s, and Ultra Disk to 64 TiB, 400,000 IOPS, and 10,000 MB/s. VM or instance limits often bind first.
    - OS disks. Any EBS SSD type can be a boot volume. On Azure, Premium SSD v2 and Ultra Disk can only be data disks, so OS disks use Premium SSD, Standard SSD, or (until Sep 8, 2028) Standard HDD.
    - Zones. EBS volumes live in one AZ. Azure Premium SSD and Standard SSD also offer ZRS disks that replicate synchronously across three zones.
    - Durability. io2 Block Express is designed for 99.999% durability and other EBS types for 99.8–99.9%. Azure documents 11 nines for LRS managed disks.
    - HDD. EBS st1 and sc1 are throughput-oriented HDDs for big sequential workloads. Azure Standard HDD is a general low-cost disk without that throughput focus.
  pricing:
    aws: Per GB-month by volume type, plus provisioned IOPS and throughput above the baselines (gp3, io1, io2).
    azure: Premium SSD, Standard SSD, and Standard HDD are billed per size tier per month (Standard types also per transaction). Premium SSD v2 and Ultra Disk are billed per GiB plus provisioned IOPS and throughput.
  exams:
    aws: [CLF-C02, SAA-C03, SOA-C03]
    azure: [AZ-900, AZ-104, AZ-305]
  faq:
    - q: What is the Azure equivalent of EBS gp3?
      a: Premium SSD v2 is the closest. It also includes 3,000 IOPS and 125 MB/s and lets you set capacity, IOPS, and throughput independently. Unlike gp3, it can't be used as an OS disk.
  related: [shared-block-volumes, block-snapshots, local-instance-storage, san-storage]
  sources:
    - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
    - https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: shared-block-volumes
  group: block-storage
  capability: Attach one disk to several VMs (clustering)
  what_for: Share a single block device between cluster nodes for failover clusters and shared-disk databases.
  match: direct
  answer: EBS Multi-Attach maps to Azure shared disks. Both expose one volume to several VMs, and both need a cluster manager or cluster-aware file system to coordinate writes.
  providers:
    aws: [ebs-multi-attach]
    azure: [shared-disks]
  differences:
    - Disk types. Multi-Attach supports only io1 and io2 (io2 only on Windows), on up to 16 Nitro instances in one AZ. Azure shared disks work with Ultra Disk, Premium SSD v2, Premium SSD, and Standard SSD, with a per-disk limit on attached VMs (maxShares).
    - Coordination. Azure documents SCSI persistent reservations and NVMe reservations, used by WSFC and Pacemaker. On AWS, the application or a cluster-aware file system must manage write ordering.
    - Zones. ZRS shared disks can be attached to VMs in different zones. EBS Multi-Attach is single-AZ.
  pricing:
    aws: No extra charge beyond io1 or io2 volume pricing.
    azure: Normal managed disk pricing. Check the pricing page for shared-disk specifics.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [block-volumes, san-storage]
  sources:
    - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/disks-shared

- id: block-snapshots
  group: block-storage
  capability: Block volume snapshots
  what_for: Take point-in-time copies of disks for backup, cloning, and copying to other regions.
  match: direct
  answer: EBS snapshots map to managed disk incremental snapshots. Both store only changed blocks after the first copy, and both can be copied to other regions.
  providers:
    aws: [ebs-snapshots]
    azure: [disk-snapshots]
  differences:
    - Storage. EBS snapshots are stored by AWS in S3-backed storage, with an optional lower-cost archive tier. Azure incremental snapshots are stored on Standard HDD storage and billed on used size, with no archive tier.
    - Restore speed. EBS fast snapshot restore pre-initializes volumes in chosen AZs. Azure has no equivalent per-snapshot feature.
    - Protection. EBS adds snapshot lock (WORM) and Recycle Bin. On Azure, use Azure Backup (immutable vaults and soft delete) for equivalent protection of disk backups.
    - Limits. Azure allows up to seven incremental snapshots per disk every five minutes, and incremental snapshots can't move between subscriptions.
  pricing:
    aws: Per GB-month of stored blocks (standard or archive tier), plus fast snapshot restore per AZ-hour and archive retrieval per GB.
    azure: Per GB-month of used snapshot size, plus data transfer for cross-region copies.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104]
  related: [block-volumes, backup-service]
  sources:
    - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/disks-incremental-snapshots

- id: local-instance-storage
  group: block-storage
  capability: Local (ephemeral) VM disks
  what_for: Use very fast disks physically attached to the host for scratch data, caches, and stateless nodes, accepting that the data can disappear.
  match: direct
  answer: EC2 instance store maps to Azure VM temporary disks and local NVMe disks. Azure can also put the OS disk itself on local storage (ephemeral OS disks), which helps stateless scale sets.
  providers:
    aws: [ec2-instance-store]
    azure: [vm-local-storage]
  differences:
    - Data loss. Instance store data is lost on stop, hibernate, or terminate (it survives reboots). Azure temp and local NVMe data is lost when the VM is deallocated or moved to another host.
    - OS disk. Ephemeral OS disks are a current Azure feature, with partial (default) or full caching and fast reimage. On EC2, boot volumes are normally EBS.
    - Availability. Both depend on the instance or VM size. Many newer Azure sizes come in versions without a temp disk, and some offer local NVMe instead.
  pricing:
    aws: Included in the instance price.
    azure: Included in the VM price. Ephemeral OS disks have no storage charge.
  exams:
    aws: [SAA-C03]
    azure: [AZ-104]
  related: [block-volumes]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks
    - https://learn.microsoft.com/en-us/azure/virtual-machines/enable-nvme-temp-faqs

- id: san-storage
  group: block-storage
  capability: Managed SAN (pooled iSCSI block storage)
  what_for: Provide shared, pooled block storage over standard SAN protocols to many hosts, as an on-premises SAN array would.
  match: partial
  answer: Microsoft maps FSx for NetApp ONTAP iSCSI or NVMe/TCP LUNs to Azure Elastic SAN. Elastic SAN pools capacity and performance across many iSCSI volumes, while ONTAP is a full storage OS that also serves file protocols.
  providers:
    aws: [fsx-ontap]
    azure: [elastic-san]
  differences:
    - Scope. Elastic SAN is block-only (iSCSI), with volume groups for policy and network rules. FSx for ONTAP serves iSCSI and NVMe/TCP LUNs alongside NFS and SMB, with ONTAP snapshots, SnapMirror, and FlexCache.
    - Consumers. Elastic SAN volumes connect to VMs, AKS (through Azure Container Storage), and Azure VMware Solution. FSx for ONTAP LUNs connect to EC2 and EKS, among others.
    - On Azure, Azure NetApp Files is the ONTAP-based option, but it serves files (NFS and SMB), not LUNs.
  pricing:
    aws: SSD storage per GB-month, provisioned throughput, provisioned IOPS above the included amount, and capacity pool storage and requests.
    azure: Billed per TiB of base capacity (which includes performance) and capacity-only units, priced by LRS or ZRS.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [block-volumes, shared-block-volumes, netapp-files, kubernetes-storage]
  sources:
    - https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html
    - https://learn.microsoft.com/en-us/azure/storage/elastic-san/elastic-san-introduction
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: kubernetes-storage
  group: block-storage
  capability: Kubernetes persistent volumes
  what_for: Give stateful pods durable disks or shared file systems through Kubernetes storage classes.
  match: partial
  answer: The EKS CSI drivers (EBS, EFS, FSx, Mountpoint for S3) map to the AKS built-in CSI drivers (Azure Disks, Azure Files, Blob Storage), plus Azure Container Storage, which adds local NVMe and Elastic SAN volumes.
  providers:
    aws: [eks-storage-csi]
    azure: [azure-container-storage]
  differences:
    - Installation. EKS CSI drivers are add-ons you install (EBS block storage is built into EKS Auto Mode). AKS enables the Disk and Files CSI drivers by default and offers the Blob driver.
    - Local NVMe. Azure Container Storage v2 exposes local NVMe disks as persistent volumes with an open-source driver. EKS has no AWS-managed equivalent for instance store volumes.
    - Pooled block. Azure Container Storage can carve many volumes out of one Elastic SAN. On EKS, each persistent volume is its own EBS volume.
  pricing:
    aws: The drivers are free. You pay for the EBS, EFS, FSx, or S3 resources they use.
    azure: The CSI drivers are free. You pay for the disks, shares, Elastic SAN, or VMs (local NVMe) underneath. Check the Container Storage pricing page for any orchestration charges.
  exams:
    aws: [SAA-C03, DOP-C02]
    azure: [AZ-104]
  related: [block-volumes, san-storage, nfs-file-storage]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/storage.html
    - https://learn.microsoft.com/en-us/azure/aks/csi-storage-drivers
    - https://learn.microsoft.com/en-us/azure/storage/container-storage/container-storage-introduction

# ───────────────────────── FILE STORAGE ─────────────────────────
- id: nfs-file-storage
  group: file-storage
  capability: Serverless NFS file system for Linux
  what_for: Share one elastic file system across many Linux servers or containers over NFS without managing file servers.
  match: partial
  answer: Microsoft maps Amazon EFS to Azure Files with NFS 4.1 shares. Both are managed NFS services, but EFS grows automatically and bills for what you store, while Azure Files NFS shares are SSD-only and provisioned.
  providers:
    aws: [efs]
    azure: [azure-files]
  differences:
    - Billing. EFS is elastic and billed on stored data by storage class, plus throughput charges. Azure Files NFS uses SSD shares, and Microsoft recommends the provisioned v2 model (you set storage, IOPS, and throughput) for new shares.
    - Tiers. EFS has Standard, Infrequent Access, and Archive storage classes with lifecycle policies. Azure Files NFS has no colder tier.
    - Redundancy. EFS Regional stores data across multiple AZs, and One Zone uses a single AZ. Azure Files NFS supports LRS and ZRS, but not GRS or GZRS.
    - Protocol. EFS supports NFSv4.0 and 4.1, with IAM authorization and access points. Azure Files NFS supports most of NFSv4.1, but not Kerberos, delegations, or NFS ACLs, and it isn't supported on Windows clients.
    - Resource model. Microsoft.FileShares (GA June 2026) lets you create NFS shares as top-level resources without a storage account, with per-share networking and billing.
    - Alternatives. For higher performance or richer NFS features on Azure, look at Azure NetApp Files.
  pricing:
    aws: Per GB-month by storage class (Standard, IA, Archive), per-GB access charges for IA and Archive, and throughput charges (Elastic is billed per GB read and written).
    azure: Provisioned v2 bills the storage, IOPS, and throughput you provision each month, whether you use them or not, plus snapshots.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  flags:
    - Microsoft.FileShares supports NFS only and isn't in every region yet. Check the regional list.
  related: [windows-file-storage, netapp-files, object-file-access]
  sources:
    - https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
    - https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol
    - https://learn.microsoft.com/en-us/azure/storage/files/understanding-billing
    - https://learn.microsoft.com/en-us/azure/storage/files/files-management-concepts
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: windows-file-storage
  group: file-storage
  capability: Managed SMB / Windows file shares
  what_for: Replace Windows file servers with a managed SMB service that uses Active Directory permissions.
  match: partial
  answer: Microsoft maps Amazon FSx for Windows File Server to Azure Files over SMB. FSx runs real Windows Server file servers for you, while Azure Files is a serverless SMB service that authenticates through AD DS, Microsoft Entra Domain Services, or Microsoft Entra Kerberos.
  providers:
    aws: [fsx-windows]
    azure: [azure-files]
  differences:
    - Architecture. FSx provisions Windows file servers (Single-AZ or Multi-AZ) with SSD or HDD storage and a set throughput capacity. Azure Files has no servers to size. Classic shares sit in a storage account and scale with the billing model you pick.
    - Windows features. FSx supports DFS namespaces, shadow copies, data deduplication, and user storage quotas. Azure Files supports share snapshots, but not every Windows Server file-server feature.
    - Identity. Both can join on-premises AD or a managed directory. Azure Files can also use Microsoft Entra Kerberos for hybrid identities.
    - Hybrid caching. For on-premises caching, Azure Files pairs with Azure File Sync. FSx File Gateway is closed to new customers.
    - Redundancy. Azure Files HDD shares can use GRS or GZRS. SSD shares support LRS and ZRS.
  pricing:
    aws: Per GB-month of SSD or HDD storage, plus provisioned throughput capacity, optional extra SSD IOPS, and backups.
    azure: Provisioned v2 (recommended) bills provisioned storage, IOPS, and throughput. Pay-as-you-go HDD shares bill used storage plus transactions.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [nfs-file-storage, file-server-caching, netapp-files]
  sources:
    - https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
    - https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
    - https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: netapp-files
  group: file-storage
  capability: Managed NetApp ONTAP file storage
  what_for: Run enterprise NAS (NFS, SMB, dual-protocol) with NetApp features such as snapshots and replication, without managing filers.
  match: direct
  answer: Amazon FSx for NetApp ONTAP maps to Azure NetApp Files. Both offer NetApp technology as a managed service, with NFS, SMB, and dual-protocol volumes and NetApp-style snapshots and replication.
  providers:
    aws: [fsx-ontap]
    azure: [azure-netapp-files]
  differences:
    - Operating model. FSx for ONTAP gives you an ONTAP file system and storage VMs that you can manage with ONTAP tools (for example, SnapMirror to on-premises and FlexCache). Azure NetApp Files is a first-party Azure service with Azure-native capacity pools and volumes.
    - Protocols. FSx for ONTAP also serves iSCSI and NVMe/TCP block LUNs. Azure NetApp Files is file-only, but adds an S3-compatible object REST API on volumes.
    - Performance tiers. FSx for ONTAP uses SSD plus an elastic capacity pool tier. Azure NetApp Files has five service levels (Flexible, Standard, Premium, Ultra, and Elastic zone-redundant), plus cool access that moves cold data to Azure Storage.
    - Scale. Azure NetApp Files large volumes reach 1 PiB, or 7.2 PiB with cool access.
  pricing:
    aws: SSD storage per GB-month, throughput capacity, provisioned IOPS, capacity pool storage and requests, and backups.
    azure: Billed on provisioned capacity-pool size by service level, plus cool-access and replication charges.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [san-storage, nfs-file-storage, windows-file-storage]
  sources:
    - https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html
    - https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-introduction
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/storage

- id: openzfs-file-storage
  group: file-storage
  capability: Managed OpenZFS file system
  what_for: Move ZFS-based or Linux NFS file servers to a managed service that keeps ZFS features such as snapshots and compression.
  match: none
  answer: Azure has no managed OpenZFS service. For NFS workloads moving from FSx for OpenZFS, the usual Azure targets are Azure NetApp Files or Azure Files NFS.
  providers:
    aws: [fsx-openzfs]
    azure: []
  differences:
