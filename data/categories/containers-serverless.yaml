    - Cloud Scheduler uses unix-cron syntax with time zones; one-time schedules are not its focus (Cloud Tasks handles delayed one-off tasks).
    pricing: Billed per job per month (paused jobs count), with a free allowance per billing account.
    sources:
    - https://docs.cloud.google.com/scheduler/docs/overview
    - https://cloud.google.com/scheduler/pricing
- id: event-bus
  group: messaging
  capability: Event bus and event routing
  what_for: Route events from cloud services, SaaS apps, and your own code to the right consumers with filtering rules.
  match: partial
  answer: Amazon EventBridge maps to Azure Event Grid. Both are serverless event routers with filtering and native cloud-service events, but they differ in schema, delivery modes, and extras such as archive and replay (EventBridge) or MQTT (Event Grid).
  providers:
    aws: [eventbridge]
    azure: [event-grid]
  differences:
    - Sources. EventBridge gets AWS service events on the default bus, SaaS partner event sources, and custom buses. Event Grid gets Azure resource events on system topics, plus custom topics and namespaces. Partner events are also supported.
    - Format. EventBridge uses its own event envelope with JSON pattern matching. Event Grid supports CloudEvents 1.0 (recommended) and the Event Grid schema, with advanced filters.
    - Delivery. EventBridge pushes to targets (Lambda, SQS, Step Functions, API destinations) and supports archive and replay. Event Grid namespaces add pull delivery and an MQTT broker. Push delivery has retries and dead-lettering.
    - Point-to-point. EventBridge Pipes connects a source (SQS, Kinesis, DynamoDB streams, and others) through filtering and enrichment to a target. On Azure, that's typically Functions or Logic Apps.
  pricing:
    aws: Per million custom or partner events published (AWS service events on the default bus are free), plus per-GB fees for archive, replay, and Pipes requests.
    azure: Per million operations, with a monthly free grant on basic topics. Namespaces are billed per throughput unit plus operations, and MQTT adds connections.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [AZ-204, AI-200]
  related: [pubsub-fanout, message-queues, scheduled-jobs]
  sources:
    - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html
    - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html
    - https://learn.microsoft.com/en-us/azure/event-grid/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/messaging
  gcp:
    services:
    - eventarc
    match: direct
    answer: Amazon EventBridge maps to Eventarc. Eventarc Advanced adds a central bus with enrollments and pipelines, similar to EventBridge buses, rules, and Pipes.
    differences:
    - Eventarc Standard routes events from Google Cloud sources to targets such as Cloud Run and Workflows.
    - Events use the CloudEvents format.
    pricing: Billed per event processed; see the Eventarc pricing page for Standard and Advanced rates.
    sources:
    - https://docs.cloud.google.com/eventarc/docs/overview
    - https://docs.cloud.google.com/eventarc/advanced/docs/overview
    - https://cloud.google.com/eventarc/pricing

- id: message-queues
  group: messaging
  capability: Message queues
  what_for: Decouple producers and consumers with a durable queue so work is buffered, retried, and processed at the consumer's pace.
  match: direct
  answer: Amazon SQS maps to Azure Service Bus queues (feature parity, including FIFO via sessions) or Azure Queue Storage (simple, cheap queues).
  providers:
    aws: [sqs]
    azure: [service-bus, queue-storage]
  differences:
    - Ordering. SQS FIFO queues order messages per message group ID with exactly-once processing. Service Bus uses sessions for ordered, grouped processing and duplicate detection. Queue Storage has no ordering guarantees.
    - Features. Service Bus adds transactions, scheduled delivery, deferral, auto-forwarding, and AMQP 1.0. SQS adds long polling, delay queues, and a visibility timeout. Both have dead-letter queues.
    - Limits. SQS messages can be up to 1 MiB (larger with the extended client library and S3). Queue Storage messages are up to 64 KB. Service Bus allows 256 KB on Standard and up to 100 MB on Premium.
    - Tiers. SQS has no tiers. Service Bus has Basic (queues only), Standard (topics), and Premium (dedicated capacity, VNet, larger messages).
  pricing:
    aws: Per million requests (64 KB chunks), with FIFO priced higher, plus a monthly free tier and data transfer.
    azure: Service Bus Basic and Standard are billed per million operations (Standard adds a base charge). Premium is billed per messaging unit-hour. Queue Storage is billed per GB stored plus per 10,000 operations.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [AZ-204, AI-200]
  related: [pubsub-fanout, managed-message-broker, event-bus]
  sources:
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview
    - https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
  flags:
    - The SQS 1 MiB message size comes from the current SQS developer guide. The Service Bus per-tier message size limits come from Service Bus quota documentation, not the overview page.
  gcp:
    services:
    - pubsub
    - cloud-tasks
    match: partial
    answer: Amazon SQS maps partly to Pub/Sub pull subscriptions for queue-style consumption, and to Cloud Tasks for dispatching individual tasks with rate limits and scheduled delivery.
    differences:
    - Pub/Sub is a topic/subscription model; each subscription acts like its own queue.
    - Cloud Tasks pushes tasks to HTTP targets rather than letting consumers poll.
    pricing: Pub/Sub bills for message throughput (publish and delivery), storage, and cross-zone or cross-region transfer. Cloud Tasks bills per billable operation (API call or push delivery attempt).
    sources:
    - https://docs.cloud.google.com/pubsub/docs/overview
    - https://docs.cloud.google.com/tasks/docs/dual-overview
    - https://cloud.google.com/pubsub/pricing

- id: pubsub-fanout
  group: messaging
  capability: Pub/sub fan-out and notifications
  what_for: Publish a message once and deliver it to many subscribers (queues, functions, webhooks, email, SMS, mobile push).
  match: partial
  answer: Amazon SNS maps to Azure Service Bus topics (durable fan-out to subscriptions) and Azure Event Grid (push to webhooks and services). For SMS, email, and mobile push, Azure uses Azure Communication Services and Notification Hubs, which aren't mapped here.
  providers:
    aws: [sns]
    azure: [service-bus, event-grid]
  differences:
    - SNS combines app-to-app fan-out (to SQS, Lambda, HTTP, Firehose) and app-to-person delivery (SMS, email, mobile push) in one service. Azure splits these across Service Bus topics or Event Grid (A2A) and Communication Services or Notification Hubs (A2P).
    - Filtering. SNS uses subscription filter policies on attributes or the body. Service Bus subscriptions use SQL or correlation filters. Event Grid has subject and advanced filters.
    - FIFO. SNS FIFO topics pair with SQS FIFO queues. Service Bus sessions on topic subscriptions provide ordering.
  pricing:
    aws: Per million publishes plus per-delivery charges that vary by endpoint type (HTTP, SQS, and Lambda are cheap, while SMS is priced per message by country).
    azure: Service Bus Standard and Premium pricing (operations or messaging units). Event Grid per million operations.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [AZ-204, AI-200]
  related: [message-queues, event-bus]
  sources:
    - https://docs.aws.amazon.com/sns/latest/dg/welcome.html
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview
    - https://learn.microsoft.com/en-us/azure/event-grid/overview
  gcp:
    services:
    - pubsub
    match: direct
    answer: Amazon SNS maps to Pub/Sub topics with multiple subscriptions for fan-out.
    differences:
    - Pub/Sub doesn't send SMS, email, or mobile push like SNS; use Firebase Cloud Messaging or a partner for that.
    - Push subscriptions deliver to HTTPS endpoints; pull subscriptions let consumers poll.
    pricing: Billed for throughput (publish and delivery), retained message storage, and data transfer.
    sources:
    - https://docs.cloud.google.com/pubsub/docs/overview
    - https://cloud.google.com/pubsub/pricing

- id: managed-message-broker
  group: messaging
  capability: Managed open-source message brokers (ActiveMQ, RabbitMQ)
  what_for: Move apps that speak JMS, AMQP 0-9-1, MQTT, or STOMP to the cloud without rewriting them for a proprietary queue API.
  match: partial
  answer: Azure has no managed ActiveMQ or RabbitMQ service like Amazon MQ. The nearest first-party target is Azure Service Bus Premium (AMQP 1.0 and JMS 2.0); otherwise use Marketplace or self-managed brokers.
  providers:
    aws: [amazon-mq]
    azure: [service-bus]
  differences:
    - Amazon MQ runs the actual open-source broker engines, so existing clients and protocols work unchanged. Service Bus is a different broker with its own semantics, and RabbitMQ (AMQP 0-9-1) clients need code changes.
    - JMS. Service Bus Premium supports JMS 2.0 over AMQP 1.0, which covers many ActiveMQ/JMS migrations.
    - MQTT. Event Grid namespaces include an MQTT broker (v3.1.1 and v5), an option for IoT-style MQTT clients.
  pricing:
    aws: Per broker instance-hour (single-instance or active/standby or cluster) plus storage.
    azure: Service Bus Premium is billed per messaging unit-hour.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [message-queues]
  sources:
    - https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/messaging

