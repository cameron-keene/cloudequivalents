    differences:
    - SQL Connect is tied to PostgreSQL; AppSync resolves to many data sources.
    - For real-time sync, Firebase's Firestore and Realtime Database are the usual choices.
    pricing: Billed through Firebase plans for operations, plus the Cloud SQL instance.
    sources:
