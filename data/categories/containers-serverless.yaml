- id: api-gateway-managed
  group: apis-web
  capability: Managed API gateway
  what_for: Publish, secure, throttle, and monitor APIs in front of functions, containers, or backends.
  match: partial
  answer: Amazon API Gateway maps to Azure API Management. API Management is a fuller API management platform (developer portal, products, policies across many backends). API Gateway is a serverless front door that is especially tight with Lambda.
  providers:
    aws: [api-gateway]
    azure: [api-management]
  differences:
    - API types. API Gateway offers REST APIs (usage plans, API keys, caching, request validation, private APIs), HTTP APIs (cheaper, simpler, JWT auth), and WebSocket APIs. API Management handles REST, SOAP, GraphQL, WebSocket, and gRPC, plus AI gateway policies for LLM APIs.
    - Tiers. API Gateway is pay-per-request with no tiers. API Management has Consumption (serverless), Developer (no SLA), Basic/Standard/Premium (classic), and Basic v2/Standard v2/Premium v2.
    - Developer portal. Built into API Management. API Gateway has none built in (AWS offers an open-source portal).
    - Self-hosted gateway. API Management can run gateways on-premises or in Kubernetes (Premium). API Gateway is cloud-only.
  pricing:
    aws: Per million API calls (REST priced higher than HTTP), WebSocket messages and connection minutes, optional cache per hour, and data transfer.
    azure: Consumption is billed per million calls with a free grant. Other tiers are billed per unit-hour, by tier and units.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [AZ-204, AZ-305]
  related: [function-http-endpoint, graphql-realtime]
  sources:
    - https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html
    - https://learn.microsoft.com/en-us/azure/api-management/api-management-key-concepts
    - https://learn.microsoft.com/en-us/azure/api-management/api-management-features
  gcp:
    services:
    - api-gateway
    - apigee
    match: partial
    answer: Amazon API Gateway maps to API Gateway for serverless backends (defined with OpenAPI), and to Apigee for full API management.
    differences:
    - API Gateway fronts Cloud Run, Cloud Run functions, and App Engine; it has no WebSocket APIs.
    - Apigee covers usage plans, developer portals, and monetization that AWS spreads across API Gateway features.
    pricing: API Gateway is billed by the number of API calls. Apigee has pay-as-you-go and subscription plans.
    sources:
    - https://docs.cloud.google.com/api-gateway/docs/about-api-gateway
    - https://cloud.google.com/api-gateway/pricing
    - https://docs.cloud.google.com/apigee/docs/api-platform/get-started/what-apigee
    flags:
    - API Gateway's lack of WebSocket support is based on its documented backends and protocols, not an explicit statement.

- id: graphql-realtime
  group: apis-web
  capability: Managed GraphQL and real-time pub/sub APIs
  what_for: Expose a GraphQL API over several data sources, or push real-time updates to web and mobile clients over WebSockets.
  match: partial
  answer: AWS AppSync maps to two Azure services. API Management covers GraphQL (pass-through or synthetic GraphQL with resolvers), and Azure Web PubSub covers real-time WebSocket pub/sub (like AppSync Events).
  providers:
    aws: [appsync]
    azure: [api-management, web-pubsub]
  differences:
    - AppSync is a dedicated GraphQL engine with resolvers (JavaScript or VTL) for DynamoDB, Aurora, OpenSearch, Lambda, and HTTP, plus subscriptions, caching, and merged APIs. API Management's synthetic GraphQL uses resolver policies (for example HTTP data sources), and pass-through GraphQL fronts an existing GraphQL server.
    - Real-time. AppSync GraphQL subscriptions and AppSync Events (channels over WebSockets). Web PubSub provides WebSocket and Socket.IO pub/sub with groups and serverless event handlers.
    - Data API Builder (open source) and Microsoft Fabric GraphQL are other Azure options for GraphQL over databases.
  pricing:
    aws: Per million query and mutation operations, real-time messages and connection minutes, plus optional caching.
    azure: API Management tier pricing. Web PubSub is billed per unit per day plus messages beyond the included quota.
  exams:
    aws: [DVA-C02]
    azure: [AZ-204]
  related: [api-gateway-managed]
  sources:
    - https://docs.aws.amazon.com/appsync/latest/devguide/what-is-appsync.html
    - https://learn.microsoft.com/en-us/azure/api-management/graphql-apis-overview
    - https://learn.microsoft.com/en-us/azure/azure-web-pubsub/overview
  gcp:
