- id: serverless-functions
  group: functions
  capability: Serverless functions (FaaS)
  what_for: Run small pieces of code in response to events or HTTP requests, scaling to zero and paying only when they run.
  match: direct
  answer: The Azure equivalent of AWS Lambda is Azure Functions. Both run event-triggered code on managed infrastructure, but Azure Functions has several hosting plans, and its declarative bindings have no counterpart on Lambda.
  providers:
    aws: [lambda]
    azure: [azure-functions]
  differences:
    - Hosting. Lambda has one service, with optional Managed Instances. Azure Functions runs on Flex Consumption (recommended serverless), Premium, Dedicated (App Service), Container Apps, or legacy Consumption. The Linux Consumption plan retires Sep 30, 2028.
    - Triggers and bindings. Lambda uses event source mappings and service integrations (200+ AWS services). Azure Functions uses triggers plus input and output bindings that read from and write to services declaratively.
    - Concurrency. A Lambda Event Function handles one request per environment by default. Flex Consumption has configurable per-instance concurrency.
    - Limits. Lambda invocations run up to 15 minutes (up to 90 minutes for some invocations on Managed Instances). Azure timeouts depend on the plan, and Premium and Dedicated allow longer or unbounded runs.
    - Naming. AWS now calls classic functions "Event Functions" to separate them from Web Functions and MicroVMs. The APIs are unchanged.
  pricing:
    aws: Per request plus GB-seconds of duration (x86 or Arm rates), with a monthly free tier. Provisioned concurrency and SnapStart are billed separately. Compute Savings Plans apply.
    azure: Flex Consumption bills per execution plus GB-seconds of on-demand instances, with always-ready instances billed at their own rate. Premium bills per vCPU and GB of instances, and Dedicated bills per App Service plan.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [AZ-204, AZ-305]
  related: [function-cold-start, function-http-endpoint, durable-workflows-code, web-app-functions]
  sources:
    - https://docs.aws.amazon.com/lambda/latest/dg/welcome.html
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
    - https://learn.microsoft.com/en-us/azure/azure-functions/consumption-plan
  gcp:
    services:
    - cloud-run-functions
    match: direct
    answer: AWS Lambda maps to Cloud Run functions (formerly Cloud Functions), which deploy functions from source onto Cloud Run.
    differences:
    - Functions run as Cloud Run services, so one instance can handle multiple concurrent requests, unlike Lambda's one request per environment.
    - Event triggers come through Eventarc and Pub/Sub instead of Lambda event source mappings.
    pricing: Request-based billing (default) charges vCPU-seconds and GiB-seconds while instances handle requests, plus a per-request fee; instance-based billing charges for the whole instance lifetime. A monthly free tier applies.
    sources:
    - https://docs.cloud.google.com/run/docs/functions/comparison
    - https://cloud.google.com/run/pricing

- id: function-cold-start
  group: functions
  capability: Cold-start mitigation for functions
  what_for: Keep serverless functions warm or start them from snapshots so latency-sensitive requests don't wait for initialization.
  match: partial
  answer: Lambda provisioned concurrency and SnapStart map to always-ready instances in Azure Functions (Flex Consumption and Premium plans). Azure has no snapshot-restore equivalent of SnapStart.
  providers:
    aws: [lambda-provisioned-concurrency, lambda-snapstart]
    azure: [functions-flex-consumption, functions-premium]
  differences:
    - Pre-warming. Provisioned concurrency keeps N initialized environments per version or alias and can be scaled on a schedule or by target tracking. Azure always-ready instances keep a baseline of instances per function or group (Flex) or per app (Premium, which also has prewarmed buffer instances).
    - Snapshots. SnapStart snapshots the initialized environment (Java 11+, Python 3.12+, .NET 8+) and restores it on cold start. Azure has nothing comparable, so reduce init time in code or keep instances warm.
    - Lambda Managed Instances avoid cold starts by running on dedicated EC2 capacity. The closest Azure parallel is the Premium or Dedicated plan.
  pricing:
    aws: Provisioned concurrency is billed per GB-second configured, plus a lower duration rate. SnapStart has no extra charge for Java but charges caching and restore for Python and .NET.
    azure: Always-ready instances in Flex Consumption are billed for baseline memory time plus execution. Premium bills for minimum instances continuously.
  exams:
    aws: [DVA-C02]
    azure: [AZ-204]
  related: [serverless-functions, function-dedicated-compute]
  sources:
    - https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
    - https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
    - https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  flags:
    - SnapStart pricing for Python and .NET (caching plus restore charges) is summarized from the Lambda pricing page's structure.
  gcp:
    services:
    - cloud-run
    match: partial
    answer: Lambda provisioned concurrency and SnapStart map partly to Cloud Run minimum instances (keep instances warm) and startup CPU boost (extra CPU during startup).
    differences:
    - There is no snapshot-restore feature like SnapStart.
    - Minimum instances are billed while idle, similar to provisioned concurrency.
    pricing: Minimum instances are billed while idle; see Cloud Run pricing for idle rates.
    sources:
    - https://docs.cloud.google.com/run/docs/configuring/min-instances
    - https://docs.cloud.google.com/run/docs/configuring/services/cpu
    - https://cloud.google.com/run/pricing

