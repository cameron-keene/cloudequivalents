rows:
# ───────────────────────── KUBERNETES ─────────────────────────
- id: managed-kubernetes
  group: kubernetes
  capability: Managed Kubernetes
  what_for: Run standard Kubernetes without operating the control plane yourself.
  match: direct
  answer: The Azure equivalent of Amazon EKS is Azure Kubernetes Service (AKS). Both are conformant managed Kubernetes services where the provider runs the control plane and you choose how nodes are managed.
  providers:
    aws: [eks]
    azure: [aks]
  differences:
    - Control-plane pricing. EKS charges a per-cluster hourly fee (higher in extended support). AKS has a Free tier (no SLA, for under 10 nodes), a Standard tier (uptime SLA, up to 5,000 nodes), and a Premium tier (adds LTS).
    - Nodes. EKS uses managed node groups, self-managed nodes, Karpenter, Fargate, Auto Mode, or Hybrid Nodes. AKS uses node pools backed by VM scale sets, node autoprovisioning (Karpenter-based), virtual nodes (ACI), or the Automatic SKU.
    - Networking. The EKS default is the Amazon VPC CNI (pods get VPC IPs). AKS offers Azure CNI (VNet or overlay) and Azure CNI powered by Cilium. Kubenet is legacy.
    - Identity. EKS authenticates users with IAM (access entries) and pods with Pod Identity or IRSA. AKS uses Microsoft Entra ID with Azure RBAC or Kubernetes RBAC, and Workload ID for pods.
    - Add-ons. EKS add-ons (VPC CNI, CoreDNS, EBS CSI, and others) and EKS Capabilities (Argo CD, ACK, kro). AKS add-ons and extensions (Istio, KEDA, Flux, Argo CD, Dapr, App Routing, Container Insights).
  pricing:
    aws: A per-cluster hourly fee (standard or extended support), plus the EC2, Fargate, or Auto Mode compute. Auto Mode adds a per-instance management fee, and Hybrid Nodes are billed per vCPU.
    azure: Free tier has no control-plane fee. Standard and Premium tiers are billed per cluster-hour. Node VMs, disks, load balancers, and public IPs are billed separately.
  exams:
    aws: [SAA-C03, DOP-C02, SAP-C02]
    azure: [AZ-104, AZ-305, AI-200]
  related: [kubernetes-automatic, kubernetes-versions, pod-identity, container-orchestrator]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
    - https://learn.microsoft.com/en-us/azure/aks/what-is-aks
    - https://learn.microsoft.com/en-us/azure/aks/free-standard-pricing-tiers
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/compute
  gcp:
    services:
    - gke
    match: direct
    answer: The Google Cloud equivalent of Amazon EKS is Google Kubernetes Engine (GKE), in Standard mode (you manage node pools) or Autopilot mode (Google manages nodes).
    differences:
    - GKE clusters are zonal or regional; regional clusters replicate the control plane across zones.
    - Upgrades follow release channels with automatic upgrades by default, rather than EKS's opt-in version upgrades.
    - Pods get identity through Workload Identity Federation for GKE instead of EKS Pod Identity or IRSA.
    pricing: A per-cluster management fee (with a free-tier credit), plus nodes billed as Compute Engine VMs in Standard mode or Pod resource requests in Autopilot.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
    - https://cloud.google.com/kubernetes-engine/pricing

- id: kubernetes-automatic
  group: kubernetes
  capability: Fully managed Kubernetes nodes ("autopilot" mode)
  what_for: Let the provider pick, scale, patch, and replace worker nodes and core add-ons so you only deploy workloads.
  match: direct
  answer: Amazon EKS Auto Mode maps to AKS Automatic. Both run Karpenter-based node provisioning and preconfigure networking, storage, and security, while still exposing the full Kubernetes API.
  providers:
    aws: [eks-auto-mode]
    azure: [aks-automatic]
  differences:
    - Scope. EKS Auto Mode manages compute autoscaling, pod and service networking, load balancing, cluster DNS, EBS block storage, and GPU support. AKS Automatic also preconfigures node autoprovisioning, deployment safeguards, workload identity, Managed Prometheus, and automatic upgrade channels.
    - Enablement. EKS Auto Mode can be turned on for existing clusters. AKS Automatic is a cluster SKU chosen at creation, and AKS Standard clusters can enable node autoprovisioning on their own.
    - Billing. EKS Auto Mode adds a management fee per managed EC2 instance on top of the instance price. AKS Automatic runs on the Standard tier (per-cluster fee) plus node VMs.
  pricing:
    aws: EKS cluster fee plus EC2 instances plus a per-instance Auto Mode management fee.
    azure: AKS Standard-tier cluster fee plus the VMs that node autoprovisioning creates.
  exams:
    aws: [SAA-C03, DOP-C02]
    azure: [AZ-104, AZ-305]
  related: [managed-kubernetes, serverless-containers]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
    - https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
    - https://learn.microsoft.com/en-us/azure/aks/node-autoprovision
  gcp:
    services:
    - gke-autopilot
    match: direct
    answer: EKS Auto Mode maps to GKE Autopilot, where Google provisions, scales, and secures the nodes.
    differences:
    - Autopilot bills general-purpose workloads per Pod resource request, not per node; EKS Auto Mode adds a management fee on top of EC2 instance prices.
    - Autopilot enforces security defaults that block some privileged workloads.
    pricing: Billed per vCPU, memory, and ephemeral storage requested by Pods (some compute classes bill per node), plus the cluster management fee.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
    - https://cloud.google.com/kubernetes-engine/pricing

- id: kubernetes-versions
  group: kubernetes
  capability: Kubernetes version support windows
  what_for: Know how long a Kubernetes minor version gets patches, and what it costs to stay on an older one.
  match: direct
  answer: EKS standard plus extended support maps to AKS community support plus Long Term Support (LTS). Both give about two years per minor version if you pay for the extension.
  providers:
    aws: [eks-extended-support]
    azure: [aks-lts]
  differences:
    - Length. EKS gives 14 months of standard support plus 12 months of extended support (26 months). AKS gives about 12 months of community support plus 12 months of LTS (about 24 months).
    - Opt-in. EKS extended support is on by default and billed automatically when a cluster passes standard support (you can disable it). AKS LTS requires the Premium tier and explicitly choosing the LTS support plan.
    - Forced upgrades. EKS auto-upgrades clusters at the end of extended support. AKS will upgrade clusters left on unsupported versions after a 60-day grace period, starting June 1, 2027, and those upgrades ignore maintenance windows.
    - Node OS. Azure Linux 2.0 is out of support on AKS (node images frozen). Plan for Azure Linux 3.0. On EKS, check AMI and Bottlerocket support separately.
  pricing:
    aws: The standard-support cluster fee, then a higher per-cluster-hour fee during extended support.
    azure: Community support is included in all tiers. LTS requires the Premium tier, which is billed per cluster-hour.
  exams:
    aws: [DOP-C02, SOA-C03]
    azure: [AZ-104]
  related: [managed-kubernetes]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
    - https://learn.microsoft.com/en-us/azure/aks/supported-kubernetes-versions
    - https://learn.microsoft.com/en-us/azure/aks/long-term-support
  gcp:
    services:
    - gke-release-channels
    match: direct
    answer: 'EKS standard and extended version support maps to GKE release channels. The Extended channel keeps a minor version for up to 24 months: 14 months of standard support plus about 10 months of extended support.'
    differences:
    - GKE upgrades clusters automatically within a channel; EKS waits for you to upgrade until end of support.
    - Like EKS extended support, the Extended channel costs an additional per-cluster fee during the extended period.
    pricing: No extra fee for standard support. Extended support adds a per-cluster fee.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/release-channels
    - https://docs.cloud.google.com/kubernetes-engine/versioning

- id: pod-identity
  group: kubernetes
  capability: Pod-level cloud identity
  what_for: Give each Kubernetes workload its own cloud identity to call cloud APIs, with no stored secrets.
  match: direct
  answer: EKS Pod Identity (and IAM Roles for Service Accounts) maps to Microsoft Entra Workload ID for AKS. Both exchange a Kubernetes service account token for short-lived cloud credentials.
  providers:
    aws: [eks-pod-identity]
    azure: [workload-identity]
  differences:
    - Mechanism. Pod Identity uses an EKS Pod Identity Agent and association API, with no OIDC provider setup per cluster. IRSA and Workload ID both use the cluster's OIDC issuer and a federated credential or trust policy.
    - The credentials are AWS STS credentials for an IAM role on AWS, versus Microsoft Entra access tokens for a user-assigned managed identity or app registration on Azure (then authorized with Azure RBAC).
    - The older AAD Pod Identity add-on on AKS is deprecated in favor of Workload ID.
  pricing:
    aws: No extra charge.
    azure: No extra charge.
  exams:
    aws: [SCS-C03, DOP-C02]
    azure: [AZ-104, SC-500]
  related: [managed-kubernetes]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
    - https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  gcp:
    services:
    - gke-workload-identity
    match: direct
    answer: EKS Pod Identity and IRSA map to Workload Identity Federation for GKE, which lets Kubernetes service accounts act as IAM principals.
    differences:
    - You grant IAM roles directly to the Kubernetes service account principal, or let it impersonate a Google service account.
    pricing: No additional charge.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity

- id: kubernetes-hybrid
  group: kubernetes
  capability: Managed Kubernetes on-premises and at the edge
  what_for: Run the cloud provider's Kubernetes distribution in your data centers or edge sites, managed from the cloud.
  match: partial
  answer: Amazon EKS Hybrid Nodes and EKS Anywhere map to AKS Hybrid and Edge (AKS enabled by Azure Arc). Azure manages on-premises clusters through Arc, while AWS either keeps the control plane in the Region (Hybrid Nodes) or leaves the cluster fully customer-managed (EKS Anywhere).
  providers:
    aws: [eks-hybrid-nodes]
    azure: [aks-hybrid-edge]
  differences:
    - Control plane location. With EKS Hybrid Nodes, the control plane stays in an AWS Region, so you need reliable connectivity. With EKS on Outposts, the control plane is in the Region or local. AKS on Azure Local runs the cluster locally and projects it into Azure through Arc.
    - Air-gapped. EKS Anywhere supports air-gapped sites (customer-managed, optional Enterprise Subscription). Azure Local supports disconnected operations with a locally hosted control plane.
    - Any cluster. Azure Arc-enabled Kubernetes can attach any CNCF-conformant cluster (including EKS) for policy, GitOps, and monitoring. AWS has the EKS Connector for read-only console visibility.
  pricing:
    aws: Hybrid Nodes are billed per vCPU-hour on top of the EKS cluster fee. EKS Anywhere is free to use, with optional paid Enterprise Subscriptions for support.
    azure: AKS on Azure Local is included with Azure Local host fees (check current terms). Arc-enabled Kubernetes features such as Defender and Monitor are billed per vCPU or per usage.
  exams:
    aws: [SAP-C02]
    azure: [AZ-305]
  related: [managed-kubernetes, on-prem-cloud]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/hybrid-nodes-overview.html
    - https://docs.aws.amazon.com/eks/latest/userguide/eks-deployment-options.html
    - https://learn.microsoft.com/en-us/azure/aks/aksarc/aks-overview
  flags:
    - AKS pricing on Azure Local and other hybrid substrates differs by deployment option and has changed several times. Confirm on the Azure Local and Arc pricing pages.
  gcp:
    services:
    - distributed-cloud-software
    - gke-attached-clusters
    match: partial
    answer: EKS Anywhere and Hybrid Nodes map partly to Google Distributed Cloud (software only) for bare metal or VMware, which runs Google-managed Kubernetes on your servers, and GKE attached clusters, which manage existing clusters from a Google Cloud fleet.
    differences:
    - There is no equivalent of EKS Hybrid Nodes (on-premises nodes joining a cloud-hosted control plane).
    - Attached clusters can register EKS and AKS clusters, so one fleet can span clouds.
    pricing: See the GKE pricing page for Distributed Cloud software and attached clusters; some options are contract-priced.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/distributed-cloud/bare-metal/docs/concepts/about-bare-metal
    - https://docs.cloud.google.com/kubernetes-engine/multi-cloud/docs/attached
    - https://cloud.google.com/kubernetes-engine/pricing
    flags:
    - Current rates for Distributed Cloud software and GKE attached clusters were not confirmed on 2026-10-27.

- id: kubernetes-platform-addons
  group: kubernetes
  capability: Managed GitOps and platform add-ons for Kubernetes
  what_for: Get GitOps continuous delivery and cloud-resource controllers for Kubernetes as managed features instead of installing them yourself.
  match: partial
  answer: Amazon EKS Capabilities (managed Argo CD, ACK, and kro) map partly to AKS GitOps extensions (Flux v2 and Argo CD). AWS runs these components outside your cluster, while Azure installs them as managed cluster extensions.
  providers:
    aws: [eks-capabilities]
    azure: [aks-gitops]
  differences:
    - Where it runs. EKS Capabilities run in EKS-owned infrastructure, not on your worker nodes. Azure GitOps extensions run in your cluster and are lifecycle-managed by Azure.
    - Cloud resources from Kubernetes. ACK manages AWS resources with Kubernetes CRDs. The Azure counterpart is Azure Service Operator (open source, self-installed), which isn't a managed extension.
    - Fleet. Azure Kubernetes Fleet Manager adds multi-cluster update orchestration and resource propagation (some features in preview). AWS has no first-party fleet manager for EKS beyond Argo CD multi-cluster.
  pricing:
    aws: EKS Capabilities are billed per capability per cluster-hour (see the EKS pricing page).
    azure: The Flux and Argo CD extensions are free on AKS. On Arc-enabled clusters, GitOps is billed per vCPU.
  exams:
    aws: [DOP-C02]
    azure: [AZ-400]
  related: [managed-kubernetes]
  sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/capabilities.html
    - https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-gitops-flux2
    - https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-gitops-argocd
    - https://learn.microsoft.com/en-us/azure/kubernetes-fleet/overview
  flags:
    - The billing models for EKS Capabilities and for Arc GitOps were summarized from the pricing pages' structure. Check current rates.
  gcp:
    services:
    - config-sync
    - config-controller
    match: partial
    answer: EKS Capabilities (Argo CD, ACK, kro) map partly to Config Sync for GitOps and Config Controller (hosted Config Connector) for managing Google Cloud resources as Kubernetes objects.
    differences:
    - Config Sync is Google's own GitOps engine, not managed Argo CD.
    - Config Connector plays the role of AWS Controllers for Kubernetes (ACK).
    pricing: Config Sync is included with GKE; Config Controller is billed for the hosted cluster it runs on. See GKE pricing.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/config-sync/docs/overview
    - https://docs.cloud.google.com/kubernetes-engine/config-controller/docs/overview

- id: managed-openshift
  group: kubernetes
  capability: Managed Red Hat OpenShift
  what_for: Run OpenShift (Red Hat's Kubernetes platform) as a managed service, billed by the cloud provider.
  match: direct
  answer: Red Hat OpenShift Service on AWS (ROSA) maps to Azure Red Hat OpenShift (ARO). Both are jointly supported by Red Hat and the cloud provider and billed on the cloud bill.
  providers:
    aws: [rosa]
    azure: [aro]
  differences:
    - Both offer a hosted control plane architecture. ARO also keeps a standard (self-contained) architecture.
    - Operations. ARO is jointly engineered and operated by Microsoft and Red Hat. ROSA is operated by Red Hat SRE with AWS integration.
  pricing:
    aws: ROSA service fees per 4 vCPUs of worker nodes (hourly or under annual contracts), plus a cluster fee for HCP, plus EC2 and other AWS resources.
    azure: VM costs plus OpenShift license fees for worker nodes (hourly or reserved). Control-plane cost depends on architecture.
  exams:
    aws: [SAP-C02]
    azure: [AZ-305]
  related: [managed-kubernetes]
  sources:
    - https://docs.aws.amazon.com/rosa/latest/userguide/what-is-rosa.html
    - https://learn.microsoft.com/en-us/azure/openshift/intro-openshift
  gcp:
    services: []
    match: none
    answer: Google Cloud has no first-party managed OpenShift service like ROSA. OpenShift on Google Cloud is sold and run by Red Hat (OpenShift Dedicated) or self-managed on Compute Engine.
    differences:
    - ROSA is jointly operated and billed through AWS; on Google Cloud, Red Hat is the provider.
    pricing: Not applicable.
    sources:
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
    flags:
    - Red Hat's OpenShift Dedicated on Google Cloud is described from Red Hat's offering, not a Google page.

- id: service-mesh
  group: kubernetes
  capability: Service mesh
  what_for: Add mTLS, retries, traffic shifting, and service-to-service telemetry between microservices without changing code.
  match: partial
  answer: AWS App Mesh was retired on Sep 30, 2026, and AWS points ECS users to ECS Service Connect (and VPC Lattice for cross-service networking). On Azure, the supported mesh is the Istio-based add-on for AKS. The Open Service Mesh add-on loses support on Sep 30, 2027.
  providers:
    aws: [ecs-service-connect, app-mesh]
    azure: [istio-aks, open-service-mesh]
  differences:
    - Both clouds retired their first-party Envoy/SMI-style meshes (App Mesh, OSM) in favor of other options. AWS chose ECS-native Service Connect and VPC Lattice. Azure chose managed Istio.
    - On EKS, AWS has no managed mesh, so run Istio, Linkerd, or Cilium yourself, or use VPC Lattice. On Azure Container Apps, Dapr and the built-in Envoy ingress cover many mesh use cases.
    - The Istio add-on has its own version support window and revision-based (canary) upgrades. It doesn't support automatic upgrades, even on AKS Automatic.
  pricing:
    aws: There's no extra charge for Service Connect beyond the proxy's task resources. VPC Lattice is billed per service-hour, data, and requests.
    azure: The Istio add-on has no separate fee. You pay for the sidecar and gateway compute in your node pools.
  exams:
    aws: [DOP-C02, ANS-C01]
    azure: [AZ-305]
  related: [managed-kubernetes, container-orchestrator]
  sources:
    - https://docs.aws.amazon.com/app-mesh/latest/userguide/what-is-app-mesh.html
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect.html
    - https://learn.microsoft.com/en-us/azure/aks/istio-about
    - https://learn.microsoft.com/en-us/azure/aks/open-service-mesh-about

# ───────────────────────── CONTAINER PLATFORMS ─────────────────────────
  gcp:
    services:
    - cloud-service-mesh
    match: partial
    answer: ECS Service Connect (and the retired App Mesh) map partly to Cloud Service Mesh, Google's managed service mesh based on the Istio APIs.
    differences:
    - Cloud Service Mesh is a full Istio-compatible mesh with mTLS and traffic policies; Service Connect is a simpler ECS-only service discovery and proxy feature.
    - Cloud Service Mesh supports GKE and other supported platforms.
    pricing: Standalone use is billed per mesh client (for example per mesh-enabled Pod) per hour.
    sources:
    - https://docs.cloud.google.com/service-mesh/docs/overview
    - https://cloud.google.com/service-mesh/pricing
- id: container-orchestrator
  group: container-platforms
  capability: Provider-native container orchestrator
  what_for: Run long-running containerized services and jobs without learning or operating Kubernetes.
  match: partial
  answer: Amazon ECS maps most closely to Azure Container Apps. Both hide Kubernetes and run services with scaling, revisions, and load balancing. ECS gives more infrastructure control (EC2 capacity, task placement, managed instances), while Container Apps is more opinionated and serverless-first.
  providers:
    aws: [ecs]
    azure: [container-apps]
  differences:
    - Abstraction. ECS uses task definitions, services, and clusters on Fargate, ECS Managed Instances, or EC2. Container Apps uses apps, revisions, jobs, and environments on Consumption or Dedicated workload profiles. It's built on Kubernetes, KEDA, Envoy, and Dapr, but you can't reach the Kubernetes API.
    - Scaling. ECS uses Application Auto Scaling (target tracking, step) and capacity providers. Container Apps scales on HTTP, TCP, or any KEDA scaler, including scale to zero.
    - Service-to-service traffic. ECS uses Service Connect or Cloud Map. Container Apps has built-in DNS discovery, Dapr service invocation, and an Envoy-based ingress with traffic splitting across revisions.
    - Windows containers. ECS supports Windows on EC2 and Fargate. Container Apps runs Linux containers only. On Azure, use AKS Windows node pools or ACI for Windows.
  pricing:
    aws: ECS itself is free. You pay for Fargate (vCPU and GB per second), EC2 instances, or ECS Managed Instances (EC2 plus a management fee).
    azure: Consumption is billed per vCPU-second and GiB-second plus requests, with a monthly free grant. Dedicated workload profiles are billed per profile instance plus an environment management fee.
  exams:
    aws: [SAA-C03, DVA-C02, DOP-C02]
    azure: [AZ-104, AI-200]
  related: [serverless-containers, simple-container-web, managed-kubernetes]
  sources:
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html
    - https://learn.microsoft.com/en-us/azure/container-apps/overview
    - https://learn.microsoft.com/en-us/azure/container-apps/plans
  gcp:
    services:
    - cloud-run
    match: partial
    answer: Amazon ECS, a provider-native orchestrator, maps partly to Cloud Run, which runs containers as services, jobs, and worker pools without a cluster.
    differences:
    - Cloud Run has no clusters, task definitions, or capacity providers; you deploy a container and set scaling limits.
    - For full orchestration control, GKE (Kubernetes) is the Google Cloud choice.
    pricing: Request-based billing (default) charges vCPU-seconds and GiB-seconds while instances handle requests, plus a per-request fee; instance-based billing charges for the whole instance lifetime. A monthly free tier applies.
    sources:
    - https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
    - https://cloud.google.com/run/pricing

- id: serverless-containers
  group: container-platforms
  capability: Serverless container compute
  what_for: Run a container or pod without provisioning or patching any servers, paying only for the resources it requests.
  match: partial
  answer: AWS Fargate maps to Azure Container Instances (single container groups and AKS virtual nodes) and to Azure Container Apps' Consumption profile. Fargate is a compute engine for ECS and EKS, while ACI is a standalone service.
  providers:
    aws: [fargate]
    azure: [container-instances, container-apps]
  differences:
    - Fargate isn't used on its own. It's the capacity behind ECS tasks or EKS pods (selected through Fargate profiles). ACI can be called directly (container groups) or used as AKS virtual nodes. Virtual Nodes v2 is in preview.
    - OS and options. Fargate on ECS supports Linux (x86 and Arm) and Windows Server. ACI supports Linux and Windows, plus confidential containers, Spot containers, NGroups, and standby pools.
    - Fargate Spot gives interruptible capacity at a discount for ECS. ACI has Spot containers.
  pricing:
    aws: Per-second billing for requested vCPU, memory, and extra ephemeral storage (1-minute minimum). Fargate Spot and Compute Savings Plans discount it.
    azure: ACI is billed per second for vCPU and memory of the container group (Windows has a surcharge). Container Apps Consumption is billed per vCPU-second and GiB-second.
  exams:
    aws: [SAA-C03, DVA-C02]
    azure: [AZ-104, AI-200]
  related: [container-orchestrator, kubernetes-automatic]
  sources:
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
    - https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
    - https://learn.microsoft.com/en-us/azure/aks/virtual-nodes
  gcp:
    services:
    - cloud-run
    - gke-autopilot
    match: partial
    answer: AWS Fargate maps to Cloud Run for serverless containers, and to GKE Autopilot for serverless Kubernetes Pods.
    differences:
    - Fargate is a compute engine for ECS and EKS; Cloud Run is a complete platform with its own HTTPS endpoints and scale to zero.
    - Autopilot is the closest match to EKS on Fargate.
    pricing: Request-based billing (default) charges vCPU-seconds and GiB-seconds while instances handle requests, plus a per-request fee; instance-based billing charges for the whole instance lifetime. A monthly free tier applies.
    sources:
    - https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
    - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
    - https://cloud.google.com/run/pricing

- id: simple-container-web
  group: container-platforms
  capability: Simplest way to run a containerized web app
  what_for: Hand over a container image and get an HTTPS URL with autoscaling, with as little cloud configuration as possible.
  match: partial
  answer: On AWS this is now Amazon ECS Express Mode, since App Runner is closed to new customers. On Azure, the equivalent is Azure Container Apps (or App Service for containers).
  providers:
    aws: [ecs-express-mode, app-runner]
    azure: [container-apps, app-service]
  differences:
    - App Runner (source code or image to URL) entered maintenance on Mar 31, 2026. Existing customers can still create services, but no new features are coming. AWS publishes a blue/green migration path to ECS Express Mode.
    - ECS Express Mode creates visible resources in your account (ECS service on Fargate, ALB with TLS, auto scaling, networking) from one API call. Container Apps is a managed environment where you deploy with az containerapp up or from source.
