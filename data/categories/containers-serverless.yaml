  what_for: Connect a Git repo and get build, global hosting, preview environments, and custom domains for a front-end or full-stack web app.
  match: direct
  answer: AWS Amplify Hosting maps to Azure Static Web Apps. Both build from Git, host on a global edge network, and create preview environments for pull requests.
