# ───────────────────────── VM SECURITY & OPERATIONS ─────────────────────────
- id: confidential-compute
  group: vm-security
  capability: Confidential computing
  what_for: Protect data while it's being processed (in memory) from the cloud operator and host admins, with hardware attestation.
