rows:
# ───────────────────────── VIRTUAL MACHINES & IMAGES ─────────────────────────
- id: virtual-servers
  group: vm-core
  capability: Virtual machines (IaaS)
  what_for: Rent a virtual server by the second, pick its CPU, memory, disk, and OS, and run anything you would run on a physical server.
  match: direct
  answer: The Azure equivalent of Amazon EC2 is Azure Virtual Machines. Both are general-purpose IaaS VMs with per-second billing, Spot, commitment discounts, and dedicated-host options.
  providers:
    aws: [ec2]
    azure: [virtual-machines]
  differences:
    - Networking model. An EC2 instance sits in a VPC subnet with security groups attached to its network interface. An Azure VM's NIC sits in a VNet subnet, filtered by NSGs on the NIC and/or subnet. Public IPs are separate resources on Azure.
    - Stopping. A stopped EC2 instance isn't billed for compute. On Azure, a VM stopped from inside the OS keeps billing for compute. Only "Stopped (deallocated)" from the portal, CLI, or API stops compute charges.
    - Disks. EC2 uses EBS volumes plus optional instance store. Azure uses managed disks (Standard HDD/SSD, Premium SSD v1/v2, Ultra) plus an optional temporary or local NVMe disk on "d" sizes.
    - Resiliency constructs. AWS uses Availability Zones and placement groups. Azure uses availability zones, availability sets (fault/update domains), and scale sets. Azure also has single-instance VM SLAs that depend on disk type.
    - Security defaults. New Azure Gen2 VMs default to Trusted Launch (Secure Boot plus vTPM). On EC2, UEFI Secure Boot and NitroTPM depend on the AMI's configuration.
    - Resource organization. Every Azure VM lives in a resource group and subscription, which is the scope for RBAC, policy, and cost. EC2 instances are scoped to an account and Region, with tags.
  pricing:
    aws: Per-second On-Demand billing (60-second minimum) for Linux and Windows. Spot, Savings Plans, and Reserved Instances discount it, and Dedicated Hosts are billed per host. EBS, data transfer, and public IPv4 addresses are billed separately.
    azure: Per-second pay-as-you-go billing for running (allocated) VMs. Spot VMs, reservations, and the savings plan discount it. Azure Hybrid Benefit removes the Windows Server or SQL Server license charge if you bring licenses. Managed disks, bandwidth, and public IPs are billed separately.
  exams:
    aws: [CLF-C02, SAA-C03, SOA-C03, SAP-C02]
    azure: [AZ-900, AZ-104, AZ-305]
  faq:
    - q: Does a stopped Azure VM cost money?
      a: Only if it's merely stopped from inside the OS. You stop paying for compute when the VM is "Stopped (deallocated)". Disks and static public IPs keep billing in both cases, just as EBS volumes and Elastic IPs do on AWS.
  related: [instance-families, machine-images, auto-scaling, purchase-spot]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/compute

- id: instance-families
  group: vm-core
  capability: Instance types and VM sizes
  what_for: Choose the right shape (CPU vendor, vCPU-to-memory ratio, local disk, network, accelerators) for a workload.
  match: direct
  answer: EC2 instance types map to Azure VM sizes (series). Both group shapes by workload type and use letters in the name for the CPU vendor and features, but the naming schemes are different.
  slug: aws-ec2-instance-types-vs-azure-vm-sizes
  providers:
    aws: [ec2-instance-types]
    azure: [vm-sizes]
  differences:
    - "Rough family mapping: general purpose M/T ↔ D/B, compute optimized C ↔ F, memory optimized R/X/U ↔ E/M, storage optimized I/D ↔ L, GPU P/G ↔ N (ND/NC/NV), HPC Hpc ↔ H (HB/HX)."
    - "Naming. EC2 is family + generation + suffix + size (m7i.2xlarge, where i = Intel, a = AMD, g = Graviton, d = local NVMe, n = network). Azure is family + vCPUs + features + version (Standard_D8as_v6, where a = AMD, p = Arm, d = local disk, s = premium storage capable, l = low memory)."
    - Burstable. T-series uses CPU credits, with an "unlimited" mode. Azure B-series uses banked credits as well. Check each side's credit and baseline rules before comparing.
    - Azure sizes are named by vCPU count, while EC2 uses size words (large, xlarge, and so on). The vCPU:memory ratios per family are similar but not identical, so map by numbers, not names.
    - End of sale. AWS stopped new launches of U-9tb1 through U-24tb1 (move to U7i). Azure regularly retires older series too (for example, isolated sizes give 12 months' notice). Check both lifecycle pages before standardizing.
  pricing:
    aws: Each instance type has its own per-second On-Demand price per Region and OS. Newer generations are usually cheaper per unit of performance.
    azure: Each size has its own per-second price per region and OS. Newer versions (v6, v7) and AMD or Arm variants usually cost less for the same vCPU count.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [virtual-servers, arm-cpus, gpu-instances, bare-metal]
  sources:
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
  flags:
    - Family letters change as new generations ship. Check the size lists on both sides at decision time.

- id: arm-cpus
  group: vm-core
  capability: Cloud provider's own Arm CPUs
  what_for: Run Linux workloads on cheaper, more power-efficient Arm64 server CPUs designed by the cloud provider.
  match: direct
  answer: AWS Graviton maps to Azure Cobalt. Both are provider-designed Arm64 CPUs offered as general-purpose and memory-optimized VM families ("g" on EC2, "p" on Azure).
  providers:
    aws: [graviton]
    azure: [cobalt]
  differences:
    - Maturity. Graviton is in its fourth and fifth generations (Graviton4 in M8g/C8g/R8g/X8g; Graviton5 in M9g/C9g/R9g) and covers general, compute, memory, storage, and burstable families. Cobalt 100 is GA (Dpsv6/Dplsv6/Epsv6 and more), and Cobalt 200 has been in early-access preview since June 2026.
    - Breadth of managed services. Many AWS managed services offer Graviton options (RDS, ElastiCache, Lambda, Fargate, and others). On Azure, Arm options are mostly IaaS VMs and AKS node pools.
    - Windows. Neither side offers general Windows Server on its Arm VMs. Plan for Linux.
    - Azure "p" sizes also include older Ampere Altra-based VMs (Dpsv5/Epsv5), so not every "p" size is Cobalt.
  pricing:
    aws: Graviton instances are priced per second like other instance types and generally cost less than comparable x86 instances. Savings Plans and RIs apply.
    azure: Cobalt VMs are priced per second like other sizes. Reservations and the savings plan apply. Cobalt 200 preview pricing may differ from GA.
  exams:
    aws: [SAA-C03]
    azure: [AZ-104, AZ-305]
  related: [instance-families, custom-training-chips]
  sources:
    - https://aws.amazon.com/ec2/graviton/
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/general-purpose/dpsv6-series
    - https://azure.microsoft.com/en-us/blog/new-azure-cobalt-200-vms-deliver-50-performance-improvement-fully-optimized-for-modern-agentic-ai-workloads/
  flags:
    - Cobalt 200 was in early-access preview (8 regions) when verified. Microsoft said broader availability would come later in 2026, so check for GA.
    - Graviton5 (M9g/C9g/R9g) is listed as current generation, but regional availability may still be limited.

- id: machine-images
  group: vm-core
  capability: VM images and image sharing
  what_for: Capture a configured server as a reusable image, version it, and share it across accounts and regions to launch identical machines.
  match: direct
  answer: Amazon Machine Images (AMIs) map to Azure Compute Gallery image versions. Azure's standalone "managed images" are now documented as legacy.
  slug: aws-ami-vs-azure-compute-gallery
  providers:
    aws: [ami]
    azure: [azure-compute-gallery]
  differences:
    - Structure. An AMI is one regional artifact (snapshots plus launch metadata) that you copy to other Regions. A Compute Gallery has image definitions with numbered versions, and each version replicates to the regions you choose, with a replica count per region.
    - Sharing. AMIs are shared with accounts, organizations or OUs, or publicly. Gallery images are shared through Azure RBAC, direct shared galleries (subscriptions or tenants), or community galleries (public).
    - Legacy managed images can't be created from Trusted Launch VMs and don't support versioning or replication. Use Compute Gallery for new work.
    - Compute Gallery also stores "VM applications" (packages applied at deployment). AWS has no direct counterpart; the closest are Image Builder components or Systems Manager Distributor.
    - Deprecation. AMIs support deprecation and disable timestamps. Gallery image versions use end-of-life dates and "exclude from latest".
  pricing:
    aws: There's no AMI charge. You pay for the EBS snapshots behind the AMI, and copying across Regions incurs data transfer.
    azure: There's no Compute Gallery charge. You pay snapshot storage for each replica and egress for the first copy of each version to other regions.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104]
  related: [image-pipelines, virtual-servers]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
    - https://learn.microsoft.com/en-us/azure/virtual-machines/capture-image-resource

- id: image-pipelines
  group: vm-core
  capability: Automated image build pipelines
  what_for: Build, patch, test, and publish golden images automatically instead of hand-crafting them.
  match: direct
  answer: EC2 Image Builder maps to Azure VM Image Builder. Both are managed services that run your customization steps on a temporary VM and publish the resulting image.
  providers:
    aws: [ec2-image-builder]
    azure: [vm-image-builder]
  differences:
    - Engine. Azure VM Image Builder is built on HashiCorp Packer and is driven by an image template (ARM, Bicep, or CLI). EC2 Image Builder uses recipes, reusable components (AWSTOE YAML documents), and pipelines with schedules.
    - Outputs. EC2 Image Builder outputs AMIs and container images (to ECR). Azure VM Image Builder outputs Compute Gallery versions, managed images, or VHDs. For containers on Azure, use ACR Tasks.
    - Testing. EC2 Image Builder has built-in test phases and vulnerability scanning (via Inspector). Azure supports validation steps in the template, and scanning is done with Defender for Cloud or your own tools.
  pricing:
    aws: There's no charge for Image Builder itself. You pay for the EC2 instances, EBS, and other resources used during builds and for stored images.
    azure: There's no charge for VM Image Builder itself. You pay for the build VM, storage, networking, and gallery replicas.
  exams:
    aws: [SOA-C03, DOP-C02]
    azure: [AZ-104, AZ-400]
  related: [machine-images]
  sources:
    - https://docs.aws.amazon.com/imagebuilder/latest/userguide/what-is-image-builder.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/image-builder-overview

- id: vm-hibernate
  group: vm-core
  capability: VM hibernation
  what_for: Pause a pre-warmed VM with its memory saved to disk, stop paying for compute, and resume later with apps still running.
  match: direct
  answer: EC2 hibernation maps to Azure VM hibernation. Both save RAM to the OS disk and charge only for storage (and IPs) while hibernated.
  providers:
    aws: [ec2-hibernation]
    azure: [vm-hibernation]
  differences:
    - Both support only certain instance types or sizes, OS versions, and memory sizes. Check the support matrix on each side.
    - On EC2, the root EBS volume must be encrypted and large enough to hold RAM, and hibernation must be enabled at launch. On Azure, hibernation must be enabled on the VM, and you must trigger it through the platform (portal, CLI, or API). Hibernating from inside the guest OS keeps the VM billed.
    - EC2 Spot Instances can use hibernate as the interruption behavior. Azure Spot VMs evict with Deallocate or Delete instead.
  pricing:
    aws: No instance charge while hibernated. You pay for EBS storage, including the saved RAM contents.
    azure: No VM charge while hibernated. You pay for OS and data disks and for static IPs.
  exams:
    aws: [SOA-C03]
    azure: [AZ-104]
  related: [virtual-servers]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/hibernate-resume

- id: mac-instances
  group: vm-core
  capability: macOS cloud machines
  what_for: Build, sign, and test iOS and macOS apps on real Apple hardware in the cloud.
  match: none
  answer: Azure has no first-party macOS VM offering comparable to EC2 Mac instances. On Azure, macOS builds usually run on Microsoft-hosted macOS agents in Azure Pipelines or GitHub Actions, or on third-party Mac hosting.
  providers:
    aws: [ec2-mac]
    azure: []
  differences:
    - EC2 Mac instances are bare-metal Mac minis or Mac Studios (Intel, M1, M1 Ultra, M2, M2 Pro, M4, M4 Pro) on Dedicated Hosts, with a 24-hour minimum host allocation and one instance per host.
    - Hosted CI runners on Azure DevOps or GitHub provide ephemeral macOS build machines, but they're CI jobs, not persistent VMs you administer.
  pricing:
    aws: Billed per Dedicated Host per second, with a 24-hour minimum. Savings Plans apply.
    azure: There's no Azure service to price. Hosted macOS CI minutes are billed by Azure DevOps or GitHub under their own plans.
  exams:
    aws: [SAA-C03]
    azure: []
  related: [dedicated-hardware]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-mac-instances.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
  flags:
    - '"No Azure equivalent" is based on the absence of macOS in the Azure VM size and image catalog. Third-party Mac clouds exist but aren''t covered here.'

- id: bare-metal
  group: vm-core
  capability: General-purpose bare-metal servers
  what_for: Run directly on the physical server without a provider hypervisor, for nested virtualization, low-level tooling, or licensing that requires it.
  match: partial
  answer: EC2 offers .metal sizes for many instance families, and Azure doesn't. On Azure, the closest options are Azure Dedicated Host (single-tenant but still virtualized), nested virtualization on supported VM sizes, or purpose-built bare-metal services such as Azure VMware Solution hosts.
  providers:
    aws: [ec2-bare-metal]
    azure: [dedicated-host, azure-vmware-solution]
  differences:
    - EC2 bare metal instances behave like regular instances (EBS, VPC, Auto Scaling) and run your own hypervisor if you want one.
    - Azure Dedicated Host gives physical isolation and host-level control, but VMs still run on the Azure hypervisor.
    - For VMware workloads specifically, Azure VMware Solution (dedicated bare-metal hosts) and Amazon EVS (EC2 bare metal) are the comparable pair. See the VMware row.
  pricing:
    aws: .metal sizes are priced per second like other sizes of the same family.
    azure: Dedicated Host is billed per host per hour. Azure VMware Solution is billed per host (node), hourly or reserved.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [dedicated-hardware, vmware-cloud]
  sources:
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts
  flags:
    - Azure also had BareMetal Infrastructure and Large Instances for SAP HANA and similar specialist workloads. Its overview page now redirects, so it's not mapped here.

# ───────────────────────── PURCHASE OPTIONS & LICENSING ─────────────────────────
- id: purchase-spot
  group: vm-pricing
  capability: Spot (interruptible) VMs
  what_for: Run fault-tolerant work (batch, CI, stateless web, rendering) on spare capacity at a large discount, accepting that it can be reclaimed.
  match: direct
  answer: EC2 Spot Instances map to Azure Spot Virtual Machines. Both are steeply discounted spare capacity that can be reclaimed, but the warning time and eviction options differ.
  providers:
    aws: [ec2-spot]
    azure: [spot-vms]
  differences:
    - Notice. EC2 gives a two-minute interruption notice plus an earlier "rebalance recommendation" signal. Azure gives up to 30 seconds via Scheduled Events, best effort.
    - Eviction behavior. EC2 can terminate, stop, or hibernate. Azure can Deallocate (default; disks kept and billed) or Delete.
    - Price cap. Both let you set a max price. Azure can also evict when the price rises above your cap. With a cap of -1, Azure evicts only for capacity.
    - Scaling. Both integrate with scale groups (ASG mixed instances policy and capacity rebalancing; VMSS Spot priority mix and instance mix) and with Batch and Kubernetes node pools.
    - Neither side's Spot capacity is covered by an SLA.
  pricing:
    aws: Spot prices vary by instance type and AZ based on long-term supply and demand. Billing is per second. Savings Plans and RIs don't apply.
    azure: Spot prices vary by size and region. You pay the lower of the current Spot price or your max price. Reservations and the savings plan don't apply.
  exams:
    aws: [CLF-C02, SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [auto-scaling, batch-jobs, commitment-savings-plan]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms

- id: commitment-savings-plan
  group: vm-pricing
  capability: Spend-based commitment discounts (savings plans)
  what_for: Commit to a steady hourly spend for 1 or 3 years and get a discount that follows your workloads across sizes and regions.
  match: direct
  answer: AWS Compute Savings Plans map to the Azure savings plan for compute. Both are a 1- or 3-year $/hour spend commitment applied automatically to eligible compute.
  providers:
    aws: [savings-plans]
    azure: [savings-plan-compute]
  differences:
    - Coverage. Compute Savings Plans cover EC2 (any family, size, OS, tenancy, Region), Fargate, and Lambda. EC2 Instance Savings Plans give a deeper discount locked to a family in one Region. The Azure savings plan for compute covers VMs, App Service, Container Apps, Functions Premium, and other compute. A separate Azure savings plan for databases also exists.
    - Payment. AWS offers All, Partial, or No upfront. Azure bills the commitment monthly or upfront.
    - Use-it-or-lose-it. On both sides, unused hourly commitment expires.
    - Reservation trade-in. Azure lets you trade eligible reservations into a savings plan. AWS has no RI-to-Savings-Plan trade-in.
    - AWS also offers SageMaker AI Savings Plans and Database Savings Plans. Compare those separately.
  pricing:
    aws: Discounts of up to 72% vs On-Demand, depending on plan type, term, and payment option.
    azure: Discounts vary by product and term (not by commitment size) and are applied hourly to the highest-discount usage first.
  exams:
    aws: [CLF-C02, SAA-C03, SAP-C02]
    azure: [AZ-900, AZ-104, AZ-305]
  related: [commitment-reserved, purchase-spot]
  sources:
    - https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html
    - https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview

- id: commitment-reserved
  group: vm-pricing
  capability: Reserved instances
  what_for: Get the deepest discount for a stable VM footprint by committing to a specific family and region for 1 or 3 years.
  match: direct
  answer: EC2 Reserved Instances map to Azure Reservations (Reserved VM Instances). Both are 1- or 3-year discounts tied to a VM configuration and region, and both providers now steer flexible workloads toward savings plans.
  providers:
    aws: [reserved-instances]
    azure: [azure-reservations]
  differences:
    - Flexibility. Regional EC2 RIs (Linux, default tenancy) have instance size flexibility within a family. Azure reservations have instance size flexibility within a size group.
    - Changing your mind. EC2 Standard RIs can be modified and sold on the RI Marketplace, and Convertible RIs can be exchanged. Neither can be cancelled. Azure reservations can be cancelled (subject to a USD 50,000 per 12-month cap) or traded in for a savings plan.
    - Policy change. From Feb 1, 2027, new Azure reservations for services covered by savings plans (including VMs) can't be exchanged, and older ones keep one final exchange.
    - Capacity. Zonal EC2 RIs also reserve capacity in an AZ. Azure reservations are billing-only, so use on-demand capacity reservations for guaranteed capacity.
  pricing:
    aws: All, Partial, or No upfront, with 1- or 3-year terms. Standard RIs discount more than Convertible.
    azure: Paid upfront or monthly for 1- or 3-year terms. The discount applies automatically to matching running VMs every hour.
  exams:
    aws: [CLF-C02, SAA-C03, SAP-C02]
    azure: [AZ-900, AZ-104, AZ-305]
  related: [commitment-savings-plan, capacity-reserve]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html
    - https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
    - https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/exchange-and-refund-azure-reservations

- id: capacity-reserve
  group: vm-pricing
  capability: Capacity reservations
  what_for: Guarantee that VM capacity of a given size is there when you need it (DR, launches, events), separately from discounts.
  match: direct
  answer: EC2 On-Demand Capacity Reservations map to Azure on-demand capacity reservation. Both hold capacity at pay-as-you-go rates whether you use it or not, and both stack with commitment discounts.
  providers:
    aws: [capacity-reservations]
    azure: [capacity-reservation]
  differences:
    - Scope. EC2 reserves in one Availability Zone. Azure reserves in a region or a specific availability zone, and it carries an SLA.
    - Future-dated. EC2 can schedule future-dated reservations (with a commitment period, at least 32 vCPUs, and C/G/I/M/R/T/U/X families). EC2 also has interruptible capacity reservations and, for ML, Capacity Blocks.
    - Discounts. On AWS, Savings Plans and regional RIs apply, but zonal RI discounts don't. On Azure, reservations and the savings plan apply.
  pricing:
    aws: Billed at the On-Demand rate for the reserved instance type, used or unused. Immediate reservations have no term, and future-dated ones carry a minimum commitment.
    azure: Billed at the pay-as-you-go rate for the reserved size, used or unused. No term commitment.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [commitment-reserved, gpu-instances]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview

- id: dedicated-hardware
  group: vm-pricing
  capability: Dedicated (single-tenant) hosts
  what_for: Run VMs on a physical server only you use, for compliance or for licenses counted per socket or core.
  match: direct
  answer: EC2 Dedicated Hosts map to Azure Dedicated Host. Both give you a whole physical server, billed per host, with control over placement.
  providers:
    aws: [dedicated-hosts]
    azure: [dedicated-host]
  differences:
    - AWS has two options. Dedicated Hosts expose sockets and cores and support host affinity and broad BYOL. Dedicated Instances give hardware isolation without host visibility. Azure Dedicated Host is the only host-level product, and Azure also has "isolated" VM sizes that take a whole host.
    - Maintenance. Azure Dedicated Host lets you control platform maintenance windows through maintenance configurations. EC2 Dedicated Hosts support host recovery and host maintenance settings.
    - Licensing. On EC2, AWS-provided RHEL or SUSE AMIs can't be used on Dedicated Hosts (you must bring your own AMI). Azure Dedicated Host is commonly used with Azure Hybrid Benefit for Windows Server and SQL Server.
    - Sharing. EC2 Dedicated Hosts can be shared across accounts with AWS RAM. Azure host groups are shared through RBAC across subscriptions in a tenant.
  pricing:
    aws: Billed per host per second, with On-Demand, Savings Plans, or host reservations available. Instances on the host have no separate instance charge.
    azure: Billed per host. VMs on the host show a price of zero, and software licenses, storage, and network are billed separately. Reservations are available.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  related: [license-byol, mac-instances, bare-metal]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts
    - https://learn.microsoft.com/en-us/azure/virtual-machines/isolation

- id: license-byol
  group: vm-pricing
  capability: Bring-your-own-license and license tracking
  what_for: Reuse existing Windows Server, SQL Server, RHEL, or SUSE licenses in the cloud and stay compliant.
  match: partial
  answer: AWS License Manager (tracking and enforcement) plus Dedicated Hosts for BYOL map loosely to Azure Hybrid Benefit. Azure's offering is a licensing benefit applied per VM, not a license-tracking service.
  providers:
    aws: [license-manager]
    azure: [hybrid-benefit]
  differences:
    - Microsoft licensing. Azure Hybrid Benefit lets Windows Server and SQL Server licenses with active Software Assurance (or qualifying subscriptions) run on shared Azure VMs at the base compute rate. On AWS, Microsoft licenses without License Mobility generally require Dedicated Hosts, and License Manager tracks the rules.
    - Linux. Both support bring-your-own RHEL or SLES subscriptions (Azure Hybrid Benefit for Linux BYOS; on EC2, your own AMIs through the vendors' cloud access programs).
    - Tracking. License Manager enforces vCPU, core, socket, or instance limits and can discover software. On Azure, usage tracking is done in Cost Management and, for SQL, through SQL Server enabled by Azure Arc. There's no general-purpose license-rule engine.
  pricing:
