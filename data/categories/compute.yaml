- id: secure-boot-vtpm
  group: vm-security
  capability: Secure Boot and virtual TPM
  what_for: Stop bootkits and rootkits, and seal keys (BitLocker and similar) to a known-good boot state.
  match: direct
  answer: EC2 UEFI Secure Boot plus NitroTPM maps to Azure Trusted Launch (Secure Boot, vTPM, and boot integrity monitoring).
  providers:
    aws: [nitrotpm]
    azure: [trusted-launch]
  differences:
    - Defaults. Trusted Launch is the default for new Azure Gen2 VMs and scale sets, and existing Gen1 VMs can be upgraded. On EC2, NitroTPM and Secure Boot must be enabled in the AMI (boot mode UEFI, TPM support).
    - Monitoring. Azure adds guest attestation and boot integrity monitoring surfaced in Defender for Cloud. AWS exposes NitroTPM attestation documents for your own checks.
    - Driver gotchas. On Azure, installing CUDA on Secure Boot Linux VMs other than Ubuntu needs Secure Boot disabled. Check GPU driver signing on both sides.
  pricing:
    aws: No extra charge.
    azure: No extra charge for Trusted Launch. Defender for Cloud features are billed separately.
  exams:
    aws: [SCS-C03]
    azure: [AZ-104, SC-500]
  related: [confidential-compute]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/nitrotpm.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch

- id: vm-remote-access
  group: vm-security
  capability: Secure remote access to VMs
  what_for: SSH or RDP into private VMs without public IPs, open inbound ports, or self-managed jump boxes.
  match: partial
  answer: AWS Systems Manager Session Manager and EC2 Instance Connect Endpoint map to Azure Bastion. Bastion is a managed RDP/SSH gateway, while Session Manager is agent-based shell access through the Systems Manager service.
  providers:
    aws: [session-manager, ec2-instance-connect-endpoint]
    azure: [bastion]
  differences:
    - How it works. Session Manager uses the SSM Agent's outbound connection, with no inbound ports and IAM-controlled, logged sessions. EC2 Instance Connect Endpoint is a VPC endpoint that proxies SSH or RDP to private IPs. Bastion is a managed service in your VNet (or shared, for the Developer SKU) that brokers RDP and SSH over TLS.
    - Logging. Session Manager can log session content to CloudWatch Logs or S3. Bastion Premium offers graphical session recording.
    - Azure Run Command and serial console cover the "run a script without logging in" case (like SSM Run Command).
  pricing:
    aws: Session Manager is free for EC2 (advanced-tier on-premises instances are billed). EC2 Instance Connect Endpoint is free, apart from cross-AZ data transfer.
    azure: Billed hourly per Bastion SKU and scale unit, plus outbound data. The Developer SKU is free.
  exams:
    aws: [SOA-C03, SCS-C03]
    azure: [AZ-104, AZ-700, SC-500]
  related: [patching]
  sources:
    - https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-ec2-instance-connect-endpoint.html
    - https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
    - https://learn.microsoft.com/en-us/azure/virtual-machines/run-command-overview

- id: patching
  group: vm-security
  capability: OS patch management
  what_for: Assess and install OS updates across fleets of servers on a schedule, with compliance reporting.
  match: direct
  answer: AWS Systems Manager Patch Manager maps to Azure Update Manager. Both scan and patch Windows and Linux machines on schedules, in the cloud and on-premises (through hybrid activations or Azure Arc).
  providers:
    aws: [patch-manager]
    azure: [update-manager]
  differences:
    - Control. Patch Manager uses patch baselines (approval rules), patch groups, maintenance windows, and Quick Setup patch policies across accounts and Regions. Update Manager uses maintenance configurations, dynamic scopes, periodic assessment, and Azure Policy.
    - Azure extras. Hotpatching (critical updates without reboot on supported Windows Server editions) and automatic VM guest patching.
    - Hybrid. On AWS, on-premises nodes register as hybrid managed nodes. On Azure, they must be Arc-enabled servers.
  pricing:
    aws: Patch Manager is free for EC2. On-premises nodes on the advanced tier are billed per node-hour.
    azure: Free for Azure VMs. Arc-enabled servers are billed per server per day when managed, unless included with Azure Local, Arc-enabled ESUs, or Defender for Servers Plan 2.
  exams:
    aws: [SOA-C03]
    azure: [AZ-104]
  related: [vm-remote-access]
  sources:
    - https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager.html
    - https://learn.microsoft.com/en-us/azure/update-manager/overview
    - https://azure.microsoft.com/en-us/pricing/details/azure-update-management-center/
