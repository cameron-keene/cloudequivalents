# ───────────────────────── SCALING & PLACEMENT ─────────────────────────
- id: auto-scaling
  group: vm-scaling
  capability: VM auto scaling groups
  what_for: Keep a fleet of identical (or mixed) VMs healthy and grow or shrink it automatically with demand or a schedule.
  match: direct
  answer: Amazon EC2 Auto Scaling maps to Azure Virtual Machine Scale Sets with autoscale. Both manage a group of VMs, replace unhealthy ones, and scale on metrics, schedules, or forecasts.
  slug: aws-ec2-auto-scaling-vs-azure-vmss
  providers:
    aws: [ec2-auto-scaling]
    azure: [vmss]
  differences:
    - Templates. An ASG launches from a launch template. A scale set embeds its VM model (or, in Flexible mode, can manage VMs you attach).
    - Modes. Azure has Flexible orchestration (recommended; members are standard VMs) and Uniform orchestration (identical scale-set VMs managed through VMSS APIs). AWS has one ASG model.
    - Policies. ASGs offer target tracking, step, simple, scheduled, and predictive scaling. Azure autoscale (Azure Monitor) offers metric rules, schedules, and predictive autoscale (CPU-based, scale sets only).
    - Warm capacity. ASG warm pools keep pre-initialized instances stopped or running. VMSS standby pools do the same for scale sets.
    - Spot mixing. ASG mixed instances policies set On-Demand/Spot ratios and allocation strategies. VMSS offers a Spot priority mix and instance mix (several VM sizes).
    - Upgrades. ASG instance refresh rolls out new templates. VMSS uses upgrade policies (manual, automatic, or rolling) and automatic OS image upgrades.
  pricing:
    aws: There's no charge for EC2 Auto Scaling. You pay for the instances and CloudWatch alarms or metrics used.
    azure: There's no charge for scale sets or autoscale. You pay for the VMs, disks, and networking.
  exams:
    aws: [SAA-C03, SOA-C03, DOP-C02]
    azure: [AZ-104, AZ-305]
  related: [virtual-servers, purchase-spot, placement-control]
  sources:
    - https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html
    - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
    - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes
    - https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-predictive

- id: placement-control
  group: vm-scaling
  capability: VM placement control
  what_for: Pack VMs close together for low latency, or spread them across hardware so one failure doesn't take down replicas.
  match: partial
  answer: EC2 placement groups have no single Azure equivalent. Cluster placement maps to proximity placement groups, while spread and partition placement map to availability sets or scale-set fault domains.
  providers:
    aws: [placement-groups]
    azure: [proximity-placement-groups]
  differences:
    - Cluster ↔ proximity placement group. Both co-locate VMs for low latency. Azure pins the group to one datacenter when the first VM deploys, so declare all needed sizes up front (the "intent") to avoid allocation failures.
    - Spread and partition ↔ availability sets or fault domains. Azure spreads VMs across fault and update domains inside a datacenter, or across zones with zonal deployments. EC2 spread puts each instance on distinct racks, and partition gives named rack groups (Hadoop, Kafka, Cassandra).
    - EC2 also has a "precision time" strategy (hosts close to high-precision time sources). Azure has no named equivalent.
  pricing:
    aws: Placement groups are free.
    azure: Proximity placement groups and availability sets are free.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-104, AZ-305]
  related: [auto-scaling, hpc-networking]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/co-location

- id: rightsizing
  group: vm-scaling
  capability: Rightsizing recommendations
  what_for: Find over-provisioned or idle VMs and get specific suggestions to downsize or shut them down.
  match: partial
  answer: AWS Compute Optimizer maps partly to Azure Advisor's cost recommendations. Advisor is a broader best-practice engine; Compute Optimizer is a dedicated, deeper rightsizing service.
  providers:
    aws: [compute-optimizer]
    azure: [azure-advisor]
  differences:
    - Scope. Compute Optimizer covers EC2, Auto Scaling groups, EBS, Lambda, ECS on Fargate, RDS/Aurora, commercial licenses, and more, with performance-risk ratings and Graviton migration suggestions. Advisor covers VM and VMSS right-sizing or shutdown along with reliability, security, performance, and operational recommendations across many Azure services.
    - Data. Compute Optimizer uses CloudWatch metrics (optionally enhanced, with longer lookback). Advisor uses Azure Monitor utilization with configurable CPU thresholds and lookback.
    - On AWS, Cost Optimization Hub aggregates Compute Optimizer and other savings recommendations. On Azure, Advisor score and Cost Management fill that role.
  pricing:
    aws: Basic recommendations are free. Enhanced infrastructure metrics are billed per resource per hour.
    azure: Azure Advisor is free.
  exams:
    aws: [SOA-C03, SAP-C02]
    azure: [AZ-104, AZ-305]
  related: [instance-families, commitment-savings-plan]
  sources:
    - https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
    - https://learn.microsoft.com/en-us/azure/advisor/advisor-overview

# ───────────────────────── BATCH & HPC ─────────────────────────
- id: batch-jobs
  group: hpc
  capability: Managed batch computing
  what_for: Queue thousands of independent or array jobs and let the service provision, scale, and tear down the compute.
  match: direct
  answer: AWS Batch maps to Azure Batch. Both are free schedulers that run jobs on pools of VMs (including Spot) that you pay for.
  slug: aws-batch-vs-azure-batch
  providers:
    aws: [aws-batch]
    azure: [azure-batch]
  differences:
    - Workload format. AWS Batch jobs are container-based (job definitions) on EC2, Fargate, or EKS compute environments. Azure Batch runs tasks as command lines, with optional containers, on VM pools you define (image, size, start task, application packages).
    - Scheduling. AWS Batch has job queues with priorities, fair-share scheduling, array jobs, dependencies, and multi-node parallel jobs. Azure Batch has jobs, tasks, task dependencies, job schedules, multi-instance (MPI) tasks, and pool autoscale formulas.
    - Azure Batch accounts use either Batch service or user subscription pool allocation mode. The second puts pool VMs in your subscription, so your quotas and reservations apply.
  pricing:
    aws: There's no extra charge for AWS Batch. You pay for the EC2, Fargate, or EKS resources it launches.
    azure: Azure Batch is free. You pay for the pool VMs, storage, and networking. Spot VMs reduce pool costs.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [hpc-clusters, purchase-spot]
  sources:
    - https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html
    - https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
    - https://learn.microsoft.com/en-us/azure/batch/plan-to-manage-costs

- id: hpc-clusters
  group: hpc
  capability: HPC cluster management (Slurm and other schedulers)
  what_for: Stand up a traditional HPC cluster (head node, scheduler, autoscaling compute, shared file system) for simulations or AI training.
  match: direct
  answer: AWS ParallelCluster (self-managed) and AWS Parallel Computing Service (managed Slurm) map to Azure CycleCloud and CycleCloud Workspace for Slurm.
  providers:
    aws: [parallelcluster, aws-pcs]
    azure: [cyclecloud]
  differences:
    - Managed vs self-managed. AWS PCS runs the Slurm controller for you. On Azure, CycleCloud (and the Workspace for Slurm template) deploy a CycleCloud server and Slurm cluster in your subscription that you operate.
    - Schedulers. ParallelCluster and PCS are Slurm-only (ParallelCluster dropped the AWS Batch scheduler in v3.16.0). CycleCloud supports Slurm, PBS Pro, LSF, Grid Engine, and HTCondor.
    - Packaging. Workspace for Slurm comes preconfigured with PMIx, Pyxis, and enroot for containerized AI/HPC jobs. PCS and ParallelCluster integrate with FSx for Lustre, EFA, and AMIs you build.
  pricing:
    aws: ParallelCluster has no charge, so you pay for the resources. PCS charges an hourly cluster-controller fee (by controller size) and an hourly node-management fee per EC2 instance (an advanced tier for P and Trn families), plus the EC2 instances. Slurm accounting is optional and billed extra.
    azure: You pay for the VMs (including the CycleCloud server VM), storage, and networking that CycleCloud deploys.
  exams:
    aws: [SAP-C02]
    azure: [AZ-305]
  related: [batch-jobs, hpc-networking, large-scale-training-clusters]
  sources:
    - https://docs.aws.amazon.com/parallelcluster/latest/ug/what-is-aws-parallelcluster.html
    - https://docs.aws.amazon.com/pcs/latest/userguide/what-is-service.html
    - https://learn.microsoft.com/en-us/azure/cyclecloud/overview
    - https://learn.microsoft.com/en-us/azure/cyclecloud/overview-ccws

- id: hpc-networking
  group: hpc
  capability: Low-latency HPC interconnect
  what_for: Give tightly coupled MPI or multi-node GPU jobs a fast network with OS bypass and RDMA.
  match: partial
  answer: AWS Elastic Fabric Adapter (EFA) maps to InfiniBand on Azure H-series and ND-series VMs. Both give OS-bypass, RDMA-class networking for MPI and NCCL, but the technologies differ.
  providers:
    aws: [efa]
    azure: [hpc-infiniband]
  differences:
    - Technology. EFA is AWS's own Ethernet-based fabric using the SRD protocol through libfabric. Azure uses NVIDIA (Mellanox) InfiniBand, with standard verbs, UCX, or HPC-X MPI stacks.
    - Scope. EFA works on many supported instance types (HPC, GPU, and some general purpose) within a subnet or AZ, usually with cluster placement groups. Azure InfiniBand is available only on RDMA-capable H- and ND-series sizes, within one scale set or availability set.
  pricing:
    aws: No extra charge for EFA. It comes with supported instance types.
    azure: No separate charge. InfiniBand is included in the price of RDMA-capable sizes.
  exams:
    aws: [SAP-C02]
    azure: [AZ-305]
  related: [hpc-clusters, placement-control, gpu-instances]
  sources:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/efa.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/high-performance-compute/setup-infiniband

