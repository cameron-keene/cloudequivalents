# ───────────────────────── LOAD BALANCING ─────────────────────────
- id: application-load-balancing
  group: load-balancing
  capability: Layer 7 (HTTP/HTTPS) load balancing
  what_for: Route web and API requests by host name, path, or header across healthy backends, with TLS termination.
  match: direct
  answer: Application Load Balancer maps to Azure Application Gateway v2 (with an optional WAF). For AKS, Application Gateway for Containers is the Kubernetes-native option. Application Gateway v1 retired on April 28, 2026.
  providers:
    aws: [application-load-balancer]
    azure: [application-gateway, app-gateway-for-containers]
  differences:
    - Deployment. ALB is a managed endpoint that needs no dedicated subnet sizing. Application Gateway v2 is deployed into its own dedicated subnet and autoscales in capacity units.
    - Features. ALB can authenticate users (OIDC or Cognito) and invoke Lambda targets. Application Gateway offers URL rewrites, mutual TLS, and Private Link, with WAF built in on the WAF_v2 tier.
    - Global. Both are regional. For global HTTP load balancing, use CloudFront or Global Accelerator on AWS, and Front Door on Azure.
  pricing:
    aws: Per ALB-hour plus per Load Balancer Capacity Unit (LCU)-hour.
    azure: Fixed gateway-hour plus per capacity unit-hour, by tier (Standard_v2 or WAF_v2).
  exams:
    aws: [SAA-C03, ANS-C01, SOA-C03]
    azure: [AZ-104, AZ-700]
  flags:
    - Application Gateway v1 retired April 28, 2026, and Microsoft is decommissioning remaining v1 deployments. Older study material may still show v1 SKUs.
  related: [network-load-balancing, web-application-firewall, cdn]
  sources:
    - https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
    - https://learn.microsoft.com/en-us/azure/application-gateway/overview
    - https://learn.microsoft.com/en-us/azure/application-gateway/v1-retirement
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: network-load-balancing
  group: load-balancing
  capability: Layer 4 (TCP/UDP) load balancing
  what_for: Spread TCP or UDP connections across servers with very high throughput and low latency, for non-HTTP protocols or extreme scale.
  match: direct
  answer: Network Load Balancer maps to Azure Load Balancer (Standard). Basic Load Balancer retired on September 30, 2025.
  providers:
    aws: [network-load-balancer]
    azure: [azure-load-balancer]
  differences:
    - Architecture. Azure Load Balancer is a pass-through, software-defined service with no proxy. NLB also passes traffic through but can terminate TLS.
    - Features. Azure Load Balancer adds outbound rules (SNAT for backends), HA ports (all ports and protocols on internal load balancers, often for NVAs), and inbound NAT rules. NLB offers static or Elastic IPs per AZ, TLS listeners, and security groups.
  pricing:
    aws: Per NLB-hour plus per NLCU-hour.
    azure: Per rule-hour (the first five rules at a flat rate, then per extra rule) plus per GB processed, inbound and outbound. There's no hourly charge when no rules are configured.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  flags:
    - Basic Load Balancer retired September 30, 2025. Existing Basic load balancers keep running without support or an SLA, so upgrade to Standard.
  related: [application-load-balancing, appliance-load-balancing, global-anycast]
  sources:
    - https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
    - https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
    - https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-basic-upgrade-guidance
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: appliance-load-balancing
  group: load-balancing
  capability: Transparent load balancing for network appliances
  what_for: Insert scalable third-party firewalls or inspection appliances into traffic paths without changing source and destination addresses.
  match: direct
  answer: Gateway Load Balancer maps to Azure Gateway Load Balancer. Both transparently steer traffic through a pool of virtual appliances using encapsulation.
  providers:
    aws: [gateway-load-balancer]
    azure: [gateway-load-balancer]
  differences:
    - Encapsulation. AWS uses GENEVE. Azure uses VXLAN.
    - Insertion. AWS inserts appliances with Gateway Load Balancer endpoints in route tables. Azure chains the Gateway Load Balancer to a Standard public load balancer frontend or a VM's public IP configuration.
  pricing:
    aws: Per GWLB-hour and GLCU-hour, plus GWLB endpoint-hours and data processed.
    azure: Billed like Standard Load Balancer (rules and data processed).
  exams:
    aws: [ANS-C01, SCS-C03]
    azure: [AZ-700]
  related: [managed-firewall, network-load-balancing]
  sources:
    - https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
    - https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview

# ───────────────────────── EDGE ─────────────────────────
- id: cdn
  group: edge-delivery
  capability: Content delivery network (CDN)
  what_for: Cache and accelerate websites, APIs, downloads, and video from edge locations near users, with TLS and attack protection.
  match: direct
  answer: Amazon CloudFront maps to Azure Front Door (Standard or Premium), which combines CDN caching with global layer 7 load balancing and WAF. Front Door (classic) retires March 31, 2027, Azure CDN Standard from Microsoft (classic) retires September 30, 2027, and Azure CDN from Edgio shut down on January 15, 2025.
  providers:
    aws: [cloudfront]
    azure: [front-door]
  differences:
    - Tiers. Front Door Standard covers content delivery and custom WAF rules. Premium adds managed WAF rules, bot protection, and Private Link to origins. CloudFront has one service with optional features, plus flat-rate plans (Free, Pro, Business, and Premium) that bundle CloudFront with WAF, DDoS protection, and other services.
    - Load balancing. Front Door is also a global HTTP load balancer with origin groups and health probes. CloudFront supports origin groups for failover, and multi-region routing usually adds Route 53 or Global Accelerator.
    - Edge compute. CloudFront has CloudFront Functions and Lambda@Edge. Front Door has rule sets and edge actions (preview).
  pricing:
    aws: Pay-as-you-go per GB out to the internet and per 10,000 requests, by region (with a free tier), or a flat monthly plan.
    azure: A monthly base fee per profile by tier, plus per GB out (edge to client and edge to origin) and per 10,000 requests.
  exams:
    aws: [CLF-C02, SAA-C03, ANS-C01]
    azure: [AZ-700, AZ-305]
  faq:
    - q: Should I use Azure CDN or Front Door?
      a: Use Front Door Standard or Premium. Microsoft's classic CDN and classic Front Door tiers no longer accept new profiles and are retiring, and Azure CDN from Edgio has already shut down.
  related: [edge-functions-lightweight, edge-functions-full, web-application-firewall, global-anycast]
  sources:
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/flat-rate-pricing-plan.html
    - https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
    - https://learn.microsoft.com/en-us/azure/frontdoor/classic-retirement-faq
    - https://learn.microsoft.com/en-us/azure/cdn/classic-cdn-retirement-faq
    - https://learn.microsoft.com/en-us/previous-versions/azure/cdn/edgio-retirement-faq
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: edge-functions-lightweight
  group: edge-delivery
  capability: Lightweight edge request logic
  what_for: Rewrite URLs, redirect, add security headers, validate tokens, or run A/B tests at the edge on every request.
  match: partial
  answer: CloudFront Functions maps to Azure Front Door rule sets (no-code rules) and Front Door edge actions (custom JavaScript, in preview).
  providers:
    aws: [cloudfront-functions]
    azure: [front-door-rules-engine, front-door-edge-actions]
  differences:
    - Code. CloudFront Functions run JavaScript on viewer request and viewer response events, with sub-millisecond startup and an optional CloudFront KeyValueStore. Edge actions run JavaScript on client requests only during preview, with a 16 KB code limit and a 10 ms execution limit.
    - No-code. Many CloudFront Functions use cases (redirects, header changes, URL rewrites) are handled on Azure by rule set actions without code.
    - Maturity. CloudFront Functions is generally available. Edge actions was in preview when verified.
  pricing:
    aws: Per million invocations (included in flat-rate plans).
    azure: Rule sets are included in Front Door pricing (with limits by tier). Check the pricing page for edge actions.
  exams:
    aws: [DVA-C02, ANS-C01]
    azure: [AZ-700]
  flags:
    - Front Door edge actions was in public preview when verified, so limits and pricing may change at GA.
  related: [edge-functions-full, cdn]
  sources:
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions.html
    - https://learn.microsoft.com/en-us/azure/frontdoor/front-door-rules-engine
    - https://learn.microsoft.com/en-us/azure/frontdoor/edge-actions

- id: edge-functions-full
  group: edge-delivery
  capability: Full serverless functions at the CDN edge
  what_for: Run richer logic close to users, such as calling other services, generating responses, or changing origin requests and responses.
  match: none
  answer: Azure has no equivalent of Lambda@Edge. Front Door edge actions (preview) covers lightweight request logic only, so heavier logic usually runs in Azure Functions or Container Apps in one or more regions behind Front Door.
  providers:
    aws: [lambda-at-edge]
    azure: []
  differences:
    - Lambda@Edge runs Node.js or Python, can trigger on all four CloudFront events (viewer and origin requests and responses), and can make network calls. CloudFront Functions is cheaper and faster for simple viewer-side logic.
  pricing:
    aws: Per request plus duration in GB-seconds (higher rates than regional Lambda).
    azure: Not applicable.
  exams:
    aws: [DVA-C02, ANS-C01]
    azure: [AZ-700]
  related: [edge-functions-lightweight, cdn]
  sources:
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-at-the-edge.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions.html

- id: global-anycast
  group: edge-delivery
  capability: Global anycast entry point for TCP/UDP apps
  what_for: Give a global app fixed anycast IPs that route users over the provider backbone to the nearest healthy region, with fast failover.
  match: partial
  answer: AWS Global Accelerator maps to the Azure global (cross-region) load balancer for layer 4, or Front Door for HTTP(S). Microsoft says the global load balancer most closely matches Global Accelerator's layer 4 behavior.
  providers:
    aws: [global-accelerator]
    azure: [cross-region-load-balancer]
  differences:
    - Backends. Global Accelerator endpoints can be ALBs, NLBs, EC2 instances, or Elastic IPs in multiple Regions. Azure's global load balancer fronts regional Standard public load balancers only.
    - Traffic control. Global Accelerator has traffic dials and endpoint weights, and custom routing accelerators for mapping users to specific instances. Azure's global load balancer routes to the closest healthy regional load balancer.
  pricing:
    aws: Fixed fee per accelerator-hour plus a data transfer premium per GB.
    azure: Billed like Standard Load Balancer (rules and data processed) on the global tier.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-700]
  related: [network-load-balancing, cdn, dns-traffic-routing]
  sources:
    - https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
    - https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

# ───────────────────────── MONITORING ─────────────────────────
- id: flow-logs
  group: network-monitoring
  capability: Network flow logs
  what_for: Record which IPs and ports talked to each other, for troubleshooting, security investigations, and cost analysis.
  match: direct
  answer: VPC Flow Logs maps to virtual network flow logs in Azure Network Watcher. NSG flow logs, the older option, can't be created anymore and retire on September 30, 2027.
  providers:
    aws: [vpc-flow-logs]
    azure: [vnet-flow-logs]
  differences:
    - Destinations. VPC Flow Logs go to CloudWatch Logs, S3, or Firehose. Azure flow logs go to a storage account, and traffic analytics can process them into Log Analytics.
    - Scope. Both can be enabled per network, subnet, or network interface.
  pricing:
    aws: Billed as vended logs by GB ingested, by destination.
    azure: Per GB of flow logs collected, plus storage and optional traffic analytics.
  exams:
    aws: [SOA-C03, SCS-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  flags:
    - Azure NSG flow logs retire September 30, 2027, and after that date Microsoft deletes the existing NSG flow log resources.
  related: [network-diagnostics, traffic-mirroring]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
    - https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
    - https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: network-diagnostics
  group: network-monitoring
  capability: Network path and access analysis
  what_for: Find out why two resources can't connect, or prove that no unintended path exists.
  match: partial
  answer: VPC Reachability Analyzer and Network Access Analyzer map to Azure Network Watcher tools such as connection troubleshoot, IP flow verify, next hop, and effective security rules.
  providers:
    aws: [reachability-analyzer]
    azure: [network-watcher]
  differences:
    - Method. Reachability Analyzer analyzes configuration without sending packets and explains which component blocks a path. Network Watcher combines configuration checks (IP flow verify, next hop, effective rules) with active tests (connection troubleshoot, connection monitor) and packet capture.
    - Audit. Network Access Analyzer checks for unintended access across your network against scopes you define. Azure has no single equivalent, so you combine Network Watcher, Azure Policy, and Defender for Cloud.
  pricing:
    aws: Per analysis.
    azure: Per diagnostic check and connection monitor test (with free monthly amounts).
  exams:
    aws: [ANS-C01, SOA-C03]
    azure: [AZ-104, AZ-700]
  related: [flow-logs, traffic-mirroring]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html
    - https://docs.aws.amazon.com/vpc/latest/network-access-analyzer/what-is-network-access-analyzer.html
    - https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview

- id: traffic-mirroring
  group: network-monitoring
  capability: Packet mirroring
  what_for: Copy live network traffic to security or monitoring appliances for intrusion detection and deep troubleshooting.
  match: partial
  answer: VPC Traffic Mirroring maps to Azure virtual network TAP, which was in public preview in select regions when verified. For one-off captures, Network Watcher packet capture is generally available.
  providers:
    aws: [traffic-mirroring]
    azure: [virtual-network-tap, network-watcher]
  differences:
    - Status. VPC Traffic Mirroring is generally available. Virtual network TAP is in preview with limitations (for example, VMs behind a Basic Load Balancer can't be sources).
    - Filters. Traffic Mirroring supports filters and session priorities. Check the preview docs for current virtual network TAP filtering options.
  pricing:
    aws: Per mirrored network interface-hour.
    azure: Check the preview terms and pricing page for virtual network TAP.
  exams:
    aws: [ANS-C01, SCS-C03]
    azure: [AZ-700]
  flags:
    - Virtual network TAP was in public preview in select regions when verified.
  related: [flow-logs, network-diagnostics]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/mirroring/what-is-traffic-mirroring.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-tap-overview
