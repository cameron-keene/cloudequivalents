- id: private-dns
  group: dns
  capability: Private DNS zones
  what_for: Use your own internal domain names for resources inside private networks.
  match: direct
  answer: Route 53 private hosted zones map to Azure Private DNS zones, linked to virtual networks.
  providers:
    aws: [route-53-private-zones]
    azure: [azure-private-dns]
  differences:
    - Auto-registration. Azure Private DNS can automatically register VM records in linked virtual networks. Route 53 private zones don't register instances automatically (EC2 gets provider-assigned hostnames instead).
    - Routing. Route 53 private zones support routing policies, including geoproximity. Azure Private DNS doesn't.
  pricing:
    aws: Per hosted zone per month plus queries.
    azure: Per zone per month plus queries.
  exams:
