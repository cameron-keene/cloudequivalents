- id: hybrid-dns
  group: dns
  capability: Hybrid DNS resolution
  what_for: Let on-premises systems resolve cloud private names and cloud resources resolve on-premises names, without running DNS servers.
  match: direct
  answer: Route 53 Resolver endpoints and forwarding rules map to Azure DNS Private Resolver inbound and outbound endpoints with forwarding rulesets.
  providers:
    aws: [route-53-resolver]
    azure: [dns-private-resolver]
  differences:
