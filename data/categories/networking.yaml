    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: service-endpoints
  group: private-access
  capability: Free backbone access to storage services
  what_for: Let private subnets reach object storage and similar services over the provider backbone, without NAT and at no extra charge.
  match: partial
  answer: Gateway VPC endpoints (for S3 and DynamoDB) map most closely to Azure virtual network service endpoints. Both are free, use route or subnet configuration rather than an IP in your network, and let the service lock access to your network.
