    azure: [service-endpoints]
  differences:
    - Mechanism. A gateway endpoint adds a prefix-list route to your route tables, and bucket policies can require the endpoint. A service endpoint tags traffic with the subnet identity, and the service's firewall allows that subnet.
    - Coverage. Gateway endpoints cover only S3 and DynamoDB. Service endpoints cover more Azure services (such as Storage, SQL, Key Vault, and Cosmos DB). Standard service endpoints add network identifiers and network security perimeter integration for some services.
    - On-premises. Neither works from on-premises networks. Use interface endpoints or private endpoints for that.
  pricing:
    aws: Free.
    azure: Free.
  exams:
