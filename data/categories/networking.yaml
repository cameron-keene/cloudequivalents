- id: dedicated-connection
  group: hybrid-connectivity
  capability: Dedicated private connection to the cloud
  what_for: Get predictable bandwidth and latency between your data center and the cloud over a private circuit, not the internet.
  match: direct
  answer: AWS Direct Connect maps to Azure ExpressRoute. Both offer provider-hosted circuits and direct ports at colocation facilities.
  providers:
    aws: [direct-connect]
    azure: [expressroute]
  differences:
    - Speeds. Direct Connect ranges from 50 Mbps (hosted, through partners) to 400 Gbps dedicated ports. ExpressRoute provider circuits range from 50 Mbps to 10 Gbps, and ExpressRoute Direct ports are 10, 100, or 400 Gbps.
    - Microsoft services. ExpressRoute Microsoft peering reaches Microsoft 365 and Azure public services. Direct Connect public virtual interfaces reach AWS public endpoints.
    - Scope. An ExpressRoute circuit reaches all regions in its geopolitical region (Standard), or worldwide with Premium. Direct Connect reaches any Region through a Direct Connect gateway.
    - Encryption. Neither encrypts by default. Both support MACsec on dedicated or direct ports, or IPsec VPN over the circuit.
  pricing:
    aws: Per port-hour plus data transfer out per GB, by location.
    azure: Monthly circuit fee by bandwidth, metered (per GB outbound) or unlimited data plans, plus the gateway, and Premium add-on if needed.
