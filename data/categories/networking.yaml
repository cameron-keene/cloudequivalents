- id: dns-firewall
  group: dns
  capability: DNS query filtering
  what_for: Block workloads from resolving malicious or unapproved domains, and log DNS queries for investigation.
  match: direct
  answer: Route 53 Resolver DNS Firewall maps to Azure DNS resolver policy, which can use a Microsoft-managed threat intelligence feed.
  providers:
    aws: [route-53-dns-firewall]
    azure: [dns-resolver-policy]
  differences:
    - Managed lists. DNS Firewall offers AWS-managed domain lists (for example, malware and botnet command-and-control domains). Azure offers a managed threat intelligence feed sourced from the Microsoft Security Response Center.
    - Logging. Azure resolver policy can log queries to Log Analytics, storage, or Event Hubs. On AWS, query logging is a separate Resolver feature.
  pricing:
    aws: Per domain stored per month plus per million queries processed.
    azure: Per policy and per million queries processed (see DNS pricing).
  exams:
