    - Site-to-site over the backbone. Global Reach links ExpressRoute circuits so your sites exchange traffic over Microsoft's network. SiteLink does the same for SiteLink-enabled private or transit virtual interfaces attached to the same Direct Connect gateway, bypassing AWS Regions.
  pricing:
