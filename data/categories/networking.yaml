  group: hybrid-connectivity
  capability: Private circuits spanning regions and sites
  what_for: Use one private connection to reach networks in several cloud regions, or link your own sites over the cloud backbone.
  match: partial
  answer: Microsoft maps Direct Connect gateways to ExpressRoute Global Reach. The closest AWS feature for linking your own sites over the cloud backbone is Direct Connect SiteLink, which works through a Direct Connect gateway. A Direct Connect gateway also connects one circuit to VPCs and transit gateways in many Regions.
  providers:
