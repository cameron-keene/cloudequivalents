# ───────────────────────── PRIVATE ACCESS ─────────────────────────
- id: private-endpoints
  group: private-access
  capability: Private endpoints for cloud and partner services
  what_for: Reach managed services (storage, databases, APIs) or another team's service through a private IP in your network, with no internet path.
