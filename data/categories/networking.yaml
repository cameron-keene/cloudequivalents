    azure: [private-link]
  differences:
    - DNS. AWS interface endpoints can turn on private DNS for the service's default name automatically. Azure private endpoints usually rely on Azure Private DNS zones (privatelink.* zones) linked to the virtual network, often managed centrally with Azure Policy.
    - Granularity. An Azure private endpoint maps to one specific resource instance (for example, one storage account). Many AWS interface endpoints map to a whole service in a Region, controlled with endpoint policies.
  pricing:
    aws: Per endpoint per AZ-hour plus per GB processed.
    azure: Per private endpoint-hour plus per GB inbound and outbound.
