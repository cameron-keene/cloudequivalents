- id: dns-traffic-routing
  group: dns
  capability: DNS-based traffic routing and failover
  what_for: Send users to the nearest or healthiest endpoint, split traffic by weight, or fail over between regions using DNS answers.
  match: direct
  answer: Route 53 routing policies and health checks map to Azure Traffic Manager.
  providers:
    aws: [route-53-routing]
    azure: [traffic-manager]
  differences:
    - Methods. Route 53 has simple, weighted, latency, failover, geolocation, geoproximity, IP-based, and multivalue routing. Traffic Manager has priority, weighted, performance, geographic, multivalue, and subnet routing, and nested profiles to combine them.
    - Integration. Route 53 routing lives in your hosted zone. Traffic Manager is a separate profile with its own trafficmanager.net name, which you point to with a CNAME (or an Azure DNS alias record).
    - Alternatives. For HTTP apps, Microsoft recommends Front Door for faster failover than DNS.
  pricing:
    aws: Routing policy queries are charged per million (higher for latency, geo, and IP-based), plus per health check per month.
    azure: Per million DNS queries plus per monitored endpoint per month.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  related: [public-dns, cdn, global-anycast]
  sources:
    - https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
    - https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

