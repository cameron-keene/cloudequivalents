# ───────────────────────── VIRTUAL NETWORKS ─────────────────────────
- id: virtual-network
  group: virtual-networks
  capability: Private virtual network
  what_for: Give your cloud resources an isolated private network with your own IP ranges, subnets, routing, and security rules.
  match: direct
  answer: Amazon VPC maps to Azure Virtual Network (VNet). Both are regional, isolated networks with your own IPv4 and IPv6 address space, divided into subnets with routing and security controls.
  providers:
    aws: [vpc]
    azure: [virtual-network]
  differences:
    - Subnets and zones. An AWS subnet sits in one Availability Zone, so you create one subnet per AZ. An Azure subnet is regional and spans all zones, so one subnet can hold zone-redundant resources.
    - Internet access. A VPC reaches the internet only through gateways you attach (internet gateway, NAT gateway). Azure has no internet gateway object. Outbound access comes from NAT Gateway, load balancer outbound rules, public IPs, or a firewall, and new VNets now default to private subnets.
    - Reserved addresses. Both clouds reserve five IP addresses in each subnet.
  pricing:
    aws: The VPC itself is free. You pay for NAT gateways, endpoints, public IPv4 addresses, VPN, Transit Gateway, and data transfer.
    azure: Virtual networks are free (up to limits). You pay for peering traffic, gateways, NAT Gateway, public IPs, and data transfer.
  exams:
    aws: [CLF-C02, SAA-C03, ANS-C01]
    azure: [AZ-900, AZ-104, AZ-700]
  faq:
    - q: Is an Azure VNet the same as an AWS VPC?
      a: Close enough to map one-to-one in most designs. The biggest practical difference is that Azure subnets span availability zones, while AWS subnets are tied to a single AZ.
  related: [subnets-zones, route-tables, vnet-peering, internet-egress]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: subnets-zones
  group: virtual-networks
  capability: Subnets and availability zone placement
  what_for: Split a network into address ranges for tiers (web, app, data) and spread them across failure zones.
  match: partial
  answer: VPC subnets map to Azure virtual network subnets, but placement differs. AWS subnets belong to one Availability Zone, while Azure subnets are regional and you pick the zone per resource.
  providers:
    aws: [vpc-subnets]
    azure: [virtual-network]
  differences:
    - High availability. On AWS, a three-AZ tier needs three subnets. On Azure, one subnet can serve all zones. If you move a resource to another zone, whether it keeps its private IP depends on the resource type.
    - Public and private. AWS calls a subnet public if its route table points to an internet gateway. On Azure, private subnets turn off default outbound access, and new VNets created with API versions released after March 31, 2026 default to private.
    - Delegation. Some Azure PaaS services need a dedicated, delegated subnet. AWS services usually just place network interfaces in your subnets.
  pricing:
    aws: Free.
    azure: Free.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  related: [virtual-network, internet-egress]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: public-ip-addresses
  group: virtual-networks
  capability: Static public IP addresses
  what_for: Keep a fixed public IP for an app, NAT, or allowlisting, and optionally bring your own IP ranges.
  match: direct
  answer: Elastic IP addresses map to Azure Standard public IP addresses. Public IP prefixes give contiguous ranges, and custom IP prefixes let you bring your own ranges (like AWS BYOIP).
  providers:
    aws: [elastic-ip]
    azure: [public-ip-addresses]
  differences:
    - Lifecycle. Basic SKU public IPs retired on September 30, 2025, so use Standard (static, zone-redundant, secure by default) on Azure.
    - Charges. AWS charges for every public IPv4 address, whether attached or idle. Azure charges per public IP and prefix, by SKU.
  pricing:
    aws: Per public IPv4 address-hour (in use or idle). BYOIP addresses aren't charged.
    azure: Per public IP or prefix-hour, by SKU and tier.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  related: [nat-gateway, internet-egress]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-eips.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-basic-upgrade-guidance
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix

- id: ip-address-management
  group: virtual-networks
  capability: IP address management (IPAM)
  what_for: Plan and allocate non-overlapping IP ranges across many networks, accounts, and regions, and track usage.
  match: partial
  answer: Amazon VPC IPAM maps to IP address management in Azure Virtual Network Manager, which allocates non-overlapping ranges from IP address pools.
  providers:
    aws: [vpc-ipam]
    azure: [virtual-network-manager]
  differences:
    - Scope. VPC IPAM integrates with AWS Organizations, monitors compliance, tracks public IPs, and keeps historical IP data. Azure IPAM is one feature of Virtual Network Manager, which also deploys connectivity and security admin rules.
  pricing:
    aws: Free tier, or the Advanced tier billed per active IP address-hour.
    azure: Virtual Network Manager is billed per managed virtual network (or subscription, depending on the pricing model), and IPAM is part of it.
  exams:
    aws: [ANS-C01]
    azure: [AZ-700]
  flags:
    - Virtual Network Manager pricing has changed over time. Check the current pricing page.
  related: [virtual-network, global-network]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html
    - https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-ip-address-management

# ───────────────────────── ROUTING & EGRESS ─────────────────────────
- id: route-tables
  group: routing-egress
  capability: Custom route tables
  what_for: Control where subnet traffic goes, for example through a firewall, a gateway, or a peered network.
  match: direct
  answer: VPC route tables map to Azure user-defined routes (UDRs) in route tables associated with subnets.
  providers:
    aws: [vpc-route-tables]
    azure: [user-defined-routes]
  differences:
    - Defaults. A VPC has a main route table, and only routes you add send traffic out. Azure adds system routes automatically (including to the internet), and UDRs override them.
    - Next hops. AWS routes target gateways, endpoints, peering connections, and network interfaces. Azure UDRs target a virtual appliance IP, virtual network gateway, internet, or none (drop).
    - Gateway routing. AWS can attach route tables to internet and virtual private gateways (ingress routing). Azure uses UDRs on the GatewaySubnet for similar designs.
  pricing:
    aws: Free.
    azure: Free.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  related: [dynamic-routing, managed-firewall]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: dynamic-routing
  group: routing-egress
  capability: BGP routing with network appliances
  what_for: Let third-party routers, firewalls, or SD-WAN appliances inside the cloud network advertise routes dynamically and fail over automatically.
  match: direct
  answer: Amazon VPC Route Server maps to Azure Route Server. Both peer with your appliances over BGP and program the learned routes into the virtual network.
  providers:
    aws: [vpc-route-server]
    azure: [route-server]
  differences:
    - VPC Route Server updates VPC, subnet, and internet gateway route tables. For transit gateway route tables, AWS uses Transit Gateway Connect instead.
    - Azure Route Server also exchanges routes with ExpressRoute and VPN gateways in the same virtual network (branch-to-branch, if enabled).
  pricing:
    aws: Billed hourly (see the VPC Route Server tab on the VPC pricing page).
    azure: Billed per hour while the route server is deployed.
  exams:
    aws: [ANS-C01]
    azure: [AZ-700]
  related: [route-tables, transit-hub]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/dynamic-routing-route-server.html
    - https://learn.microsoft.com/en-us/azure/route-server/overview

- id: internet-egress
  group: routing-egress
  capability: Internet gateway (inbound and outbound internet access)
  what_for: Allow resources with public IPs to talk to the internet.
  match: partial
  answer: Azure has no internet gateway resource. Resources reach the internet through a public IP, NAT Gateway, load balancer outbound rules, or Azure Firewall. Default outbound access (implicit internet access for VMs) is being phased out with private subnets.
  providers:
    aws: [internet-gateway]
    azure: [public-ip-addresses, private-subnets]
  differences:
    - Control. On AWS, a subnet without a route to an internet gateway has no internet path. On Azure, VMs in older subnets could get implicit default outbound access, which Microsoft is retiring in favor of explicit outbound methods.
    - IPv6 egress-only. AWS has an egress-only internet gateway for IPv6. On Azure, use NAT Gateway StandardV2 (IPv6) or NSG rules.
  pricing:
    aws: Internet gateways are free. You pay for public IPv4 addresses and data transfer.
    azure: You pay for public IPs, NAT Gateway, or Firewall, plus data transfer.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  flags:
    - Microsoft's default outbound change applies to new virtual networks created with API versions released after March 31, 2026. Existing virtual networks aren't changed.
  related: [nat-gateway, block-public-access, subnets-zones]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access

- id: nat-gateway
  group: routing-egress
  capability: Managed NAT for outbound traffic
  what_for: Let private resources reach the internet (for updates or APIs) from fixed public IPs, without accepting inbound connections.
  match: direct
  answer: AWS NAT gateway maps to Azure NAT Gateway. Both give private subnets outbound-only internet access from static public IPs.
  providers:
    aws: [nat-gateway]
    azure: [azure-nat-gateway]
  differences:
    - Zones. A standard (zonal) AWS NAT gateway lives in one AZ, so you deploy one per AZ. Regional NAT gateways now expand across AZs automatically. Azure NAT Gateway Standard is zonal, and StandardV2 is zone-redundant.
    - IPs. Azure NAT Gateway can use up to 16 public IPs (or prefixes) for more SNAT ports. Microsoft's comparison notes that AWS NAT gateways have a single public IP by default, but check current AWS limits for secondary addresses.
    - Private NAT. AWS NAT gateways also support private NAT (to other networks without a public IP). Azure NAT Gateway is for internet egress only.
  pricing:
    aws: Per NAT gateway-hour plus per GB processed.
    azure: Per NAT gateway-hour plus per GB processed, plus the public IPs.
  exams:
    aws: [SAA-C03, ANS-C01, SOA-C03]
    azure: [AZ-104, AZ-700]
  related: [internet-egress, public-ip-addresses]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
    - https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
    - https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

# ───────────────────────── NETWORK SECURITY ─────────────────────────
- id: instance-firewall
  group: network-security
  capability: Stateful instance-level firewall rules
  what_for: Allow only the traffic each server needs, for example letting the web tier reach the database on one port.
  match: direct
  answer: Security groups map to Azure network security groups (NSGs), with application security groups (ASGs) standing in for rules that reference other security groups.
  providers:
    aws: [security-groups]
    azure: [network-security-groups]
  differences:
    - Rule types. Security groups have allow rules only (everything else is denied). NSGs have prioritized allow and deny rules, plus default rules that allow traffic within the virtual network and from the load balancer.
    - Attachment. Security groups attach to network interfaces. NSGs attach to subnets, NICs, or both, and both levels are evaluated.
    - References. Security group rules can reference other security groups. NSG rules reference ASGs or service tags (such as Storage or AzureLoadBalancer).
  pricing:
    aws: Free.
    azure: Free.
  exams:
    aws: [SAA-C03, SCS-C03, ANS-C01]
    azure: [AZ-104, AZ-700, SC-500]
  related: [subnet-acl, managed-firewall]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
    - https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: subnet-acl
  group: network-security
  capability: Stateless subnet access control lists
  what_for: Add a coarse allow or deny layer at the subnet boundary, such as blocking a known bad IP range.
  match: partial
  answer: Azure has no stateless network ACL. The closest option is an NSG associated with the subnet, which is stateful and supports deny rules. Virtual Network Manager security admin rules can enforce organization-wide rules that override NSGs.
  providers:
    aws: [network-acls]
    azure: [network-security-groups, virtual-network-manager]
  differences:
    - Statefulness. Network ACLs are stateless, so return traffic needs its own rule (including ephemeral ports). NSGs are stateful.
    - Central rules. Virtual Network Manager security admin rules apply across many virtual networks and are evaluated before NSGs, which is useful for guardrails like blocking high-risk ports.
  pricing:
    aws: Free.
    azure: NSGs are free. Virtual Network Manager is billed separately.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-700]
  related: [instance-firewall]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
    - https://learn.microsoft.com/en-us/azure/virtual-network-manager/overview

- id: block-public-access
  group: network-security
  capability: Block internet access at the account level
  what_for: Guarantee that networks can't reach or be reached from the internet unless explicitly exempted.
  match: partial
  answer: VPC Block Public Access has no single Azure switch. The closest combination is private subnets (no default outbound access) plus Azure Policy rules that deny public IPs and internet-facing resources.
  providers:
    aws: [vpc-block-public-access]
    azure: [private-subnets]
  differences:
    - VPC Block Public Access blocks internet gateway traffic for an account and Region in one setting, with exclusions per VPC or subnet. On Azure, the guardrail is assembled from private subnets, policies, NSG or security admin rules, and routing through Azure Firewall.
  pricing:
    aws: Free.
    azure: Private subnets and Azure Policy are free.
  exams:
    aws: [SCS-C03, ANS-C01]
    azure: [AZ-700, SC-500]
  related: [internet-egress, subnet-acl]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access

- id: managed-firewall
  group: network-security
  capability: Managed network firewall
  what_for: Inspect and filter traffic between networks and to the internet, with domain filtering, threat intelligence, and intrusion prevention.
  match: direct
  answer: AWS Network Firewall maps to Azure Firewall. Both are managed, stateful, autoscaling firewalls with domain filtering, threat intelligence, and intrusion prevention.
  providers:
    aws: [network-firewall]
    azure: [azure-firewall]
  differences:
    - Rules. Network Firewall uses stateless rules plus Suricata-compatible stateful rules (and AWS-managed threat signatures). Azure Firewall uses network, application (FQDN), and DNAT rule collections in a firewall policy, with IDPS and TLS inspection in the Premium tier.
    - Deployment. Network Firewall places endpoints in a subnet in each AZ, and you route traffic through them. Azure Firewall is deployed in a hub virtual network (or a secured Virtual WAN hub), with UDRs sending spoke traffic to it.
    - Tiers. Azure Firewall comes in Basic (up to 250 Mbps), Standard, and Premium. Network Firewall has a single tier with optional features.
  pricing:
    aws: Per firewall endpoint-hour plus per GB processed (and advanced inspection for TLS).
    azure: Per deployment-hour by tier plus per GB processed.
  exams:
    aws: [SCS-C03, ANS-C01]
    azure: [AZ-700, SC-500]
  related: [web-application-firewall, firewall-policy-management, route-tables]
  sources:
    - https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html
    - https://learn.microsoft.com/en-us/azure/firewall/overview
    - https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: web-application-firewall
  group: network-security
  capability: Web application firewall (WAF)
  what_for: Block common web attacks (SQL injection, cross-site scripting, bots, floods) before they reach your app.
  match: direct
  answer: AWS WAF maps to Azure Web Application Firewall, which runs on Application Gateway (regional) or Front Door (global).
  providers:
    aws: [aws-waf]
    azure: [azure-waf]
  differences:
    - Attachment. AWS WAF web ACLs attach to CloudFront, ALB, API Gateway, AppSync, Cognito, App Runner, and Verified Access. Azure WAF policies attach to Application Gateway, Front Door, or Application Gateway for Containers.
    - Rule sets. AWS offers managed rule groups (including paid Bot Control and Fraud Control) and marketplace rules. Azure offers Microsoft's default rule set (OWASP-based), bot manager rules, custom rules, and rate limiting.
    - AWS WAF Classic is going through a planned end-of-life process, so migrate any Classic web ACLs.
  pricing:
    aws: Per web ACL and rule per month plus per million requests, and extra for Bot Control and Fraud Control.
    azure: On Application Gateway, the WAF_v2 tier's hourly and capacity unit pricing. On Front Door, Premium includes managed rules, and Standard supports custom rules only.
  exams:
    aws: [SCS-C03, SAA-C03]
    azure: [AZ-700, SC-500]
  related: [managed-firewall, ddos-protection, cdn]
  sources:
    - https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html
    - https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html
    - https://learn.microsoft.com/en-us/azure/web-application-firewall/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: ddos-protection
  group: network-security
  capability: DDoS protection
  what_for: Keep apps available during volumetric and protocol floods, with expert help and cost protection for critical workloads.
  match: direct
  answer: AWS Shield maps to Azure DDoS Protection. Both include free, always-on baseline protection (Shield Standard and Azure infrastructure DDoS protection) and a paid tier (Shield Advanced, and DDoS Network Protection or IP Protection).
  providers:
    aws: [shield]
    azure: [ddos-protection]
  differences:
    - Billing. Shield Advanced is a monthly subscription per organization (one-year commitment) plus data transfer out. DDoS Network Protection is a monthly price covering up to 100 public IPs, and DDoS IP Protection is priced per protected IP.
    - Extras. Shield Advanced and DDoS Network Protection both include rapid response and cost protection. DDoS IP Protection doesn't.
  pricing:
    aws: Shield Standard is free. Shield Advanced is a monthly fee plus data transfer usage fees.
    azure: Infrastructure protection is free. Network Protection is a monthly fee (covering up to 100 IPs, with overage per IP), and IP Protection is per IP per month.
  exams:
    aws: [SCS-C03, SAA-C03]
    azure: [AZ-700, SC-500]
  related: [web-application-firewall]
  sources:
    - https://docs.aws.amazon.com/waf/latest/developerguide/shield-chapter.html
    - https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
    - https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: firewall-policy-management
  group: network-security
  capability: Central firewall and security policy management
  what_for: Apply the same firewall, WAF, and DDoS policies across many accounts or subscriptions and keep new resources compliant.
  match: partial
  answer: AWS Firewall Manager maps to Azure Firewall Manager for firewall policies. Azure Policy fills the gap for enforcing WAF, DDoS, and NSG settings across subscriptions.
  providers:
    aws: [firewall-manager]
    azure: [azure-firewall-manager]
  differences:
    - Scope. Firewall Manager on AWS covers WAF, Shield Advanced, security groups, Network Firewall, DNS Firewall, and third-party firewalls across an organization, and auto-remediates. Azure Firewall Manager centers on Azure Firewall policies and secured hubs, with DDoS and WAF policy association.
  pricing:
    aws: Per policy per Region per month, plus the AWS Config rules it uses.
    azure: Firewall Manager itself is free. You pay for the firewall policies and deployments created through it (policy pricing is on the pricing page).
  exams:
    aws: [SCS-C03]
    azure: [AZ-700, SC-500]
  related: [managed-firewall, web-application-firewall]
  sources:
    - https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html
    - https://learn.microsoft.com/en-us/azure/firewall-manager/overview

# ───────────────────────── HYBRID & NETWORK-TO-NETWORK ─────────────────────────
- id: vnet-peering
  group: hybrid-connectivity
  capability: Network peering
  what_for: Connect two private networks directly so their resources can talk over private IPs.
  match: direct
  answer: VPC peering maps to virtual network peering (local or global). Both are non-transitive and route over the provider's backbone.
  providers:
    aws: [vpc-peering]
    azure: [vnet-peering]
  differences:
    - Gateway transit. Azure peering supports gateway transit, so spokes can use a hub's VPN or ExpressRoute gateway. VPC peering can't share gateways (use Transit Gateway for that).
    - Transitive routing. Neither is transitive. Azure hub-and-spoke designs add a firewall or NVA in the hub, or use Virtual WAN or Virtual Network Manager connectivity.
  pricing:
    aws: Free to create. Data transfer within an AZ over peering is free, and cross-AZ and cross-Region transfer is charged.
    azure: Per GB of inbound and outbound data on each side of the peering, with higher rates for global peering.
  exams:
    aws: [SAA-C03, ANS-C01]
    azure: [AZ-104, AZ-700]
  related: [transit-hub, virtual-network]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/networking

- id: transit-hub
  group: hybrid-connectivity
  capability: Hub-and-spoke transit routing
  what_for: Connect many networks, VPNs, and private circuits through a central router instead of a mesh of peerings.
  match: partial
  answer: AWS Transit Gateway maps to Azure Virtual WAN. Many Azure designs instead build a customer-managed hub virtual network (with Azure Firewall or an NVA, plus gateways), optionally deployed with Virtual Network Manager.
  providers:
    aws: [transit-gateway]
    azure: [virtual-wan, virtual-network-manager]
  differences:
    - Scope. Transit Gateway is regional and peers with other transit gateways across Regions. Virtual WAN hubs in a Standard virtual WAN are fully meshed across regions automatically.
    - Security. Virtual WAN can host Azure Firewall or partner NVAs in secured hubs, managed through Firewall Manager. On AWS, inspection usually uses an inspection VPC with Network Firewall or a Gateway Load Balancer, or native Network Firewall attachments.
    - Routes. Microsoft's comparison notes that Transit Gateway allows 100 BGP prefixes per attachment, while Virtual WAN private peering allows 1,000. Check current quotas for your design.
  pricing:
    aws: Per attachment-hour plus per GB processed.
    azure: Virtual WAN Standard hubs are billed per hub-hour plus data processed and per connection unit (VPN, ExpressRoute, and user VPN scale units).
  exams:
    aws: [SAA-C03, ANS-C01, SAP-C02]
    azure: [AZ-700, AZ-305]
  related: [vnet-peering, global-network, managed-firewall]
  sources:
    - https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
    - https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
