    - Scaling. Cosmos DB for Gremlin is partitioned by a key you choose, with RU throughput and global distribution. Neptune scales with instances (or serverless capacity) and read replicas.
  pricing:
    aws: Per instance-hour or serverless NCU-hour, plus storage and I/O. Neptune Analytics bills per memory-optimized capacity-hour.
