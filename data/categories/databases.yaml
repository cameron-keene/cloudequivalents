rows:
# ───────────────────────── RELATIONAL ENGINES ─────────────────────────
- id: managed-postgresql
  group: relational-engines
  capability: Managed PostgreSQL
  what_for: Run community PostgreSQL without managing servers, patching, backups, or failover.
  match: direct
  answer: Amazon RDS for PostgreSQL maps to Azure Database for PostgreSQL (flexible server). Both run community PostgreSQL with automated backups, point-in-time restore, standby-based HA, read replicas, and a large set of extensions.
  providers:
    aws: [rds-postgresql]
    azure: [azure-database-for-postgresql]
  differences:
    - Compute tiers. RDS uses DB instance classes (burstable t, general m, memory-optimized r and x). Azure has Burstable, General Purpose, and Memory Optimized tiers, and you can stop a server to save compute cost on both clouds.
    - HA. RDS Multi-AZ uses a standby instance, or a Multi-AZ DB cluster with two readable standbys. Azure zone-redundant HA keeps a synchronous warm standby in another zone; the standby isn't readable.
    - Connection pooling. Azure has PgBouncer built into the server (General Purpose and Memory Optimized). On AWS you use RDS Proxy, a separate paid service.
    - Version lifecycle. RDS offers paid Extended Support after a major version's standard support ends. Azure offers in-place major version upgrades. Check each provider's version calendar.
  pricing:
    aws: Per instance-hour by class, plus storage (GB-month, with provisioned IOPS for io1/io2 or gp3 above the baseline), backup storage beyond the free allowance, and Extended Support fees for old versions.
    azure: Per vCore-hour by tier, plus provisioned storage (and IOPS on Premium SSD v2), backup storage beyond the free allowance, and the standby billed like a second server when HA is on.
  exams:
    aws: [SAA-C03, SOA-C03, DVA-C02]
    azure: [AZ-305, AZ-104]
  related: [managed-mysql, ha-standby, read-replicas, connection-pooling, cloud-native-postgresql]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_PostgreSQL.html
    - https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - cloud-sql-postgresql
    match: direct
    answer: The Google Cloud equivalent of Amazon RDS for PostgreSQL is Cloud SQL for PostgreSQL.
    differences:
    - 'Cloud SQL has two editions: Enterprise and Enterprise Plus (higher performance and availability features).'
    - Machine sizes are vCPU and memory choices rather than db.* instance classes.
    - AlloyDB for PostgreSQL is Google's higher-end PostgreSQL option, comparable to Aurora.
    pricing: Billed per vCPU and GB of memory per hour by edition (Enterprise or Enterprise Plus), plus storage, backups, and network. Committed use discounts are available.
    sources:
    - https://docs.cloud.google.com/sql/docs/postgres/introduction
    - https://docs.cloud.google.com/sql/docs/mysql/editions-intro
    - https://cloud.google.com/sql/pricing

- id: managed-mysql
  group: relational-engines
  capability: Managed MySQL
  what_for: Run MySQL as a managed service with backups, HA, and replicas handled for you.
  match: direct
  answer: Amazon RDS for MySQL maps to Azure Database for MySQL (flexible server). Both run MySQL Community Edition with automated backups, zone-redundant HA, and read replicas.
  providers:
    aws: [rds-mysql]
    azure: [azure-database-for-mysql]
  differences:
    - Versions. Azure lists MySQL 5.7, 8.0, and 8.4 for flexible server. RDS also supports current MySQL major versions and charges Extended Support for older ones such as 5.7. Check both version calendars.
    - Tiers. Azure has Burstable, General Purpose, and Business Critical tiers. RDS uses instance classes, with Multi-AZ DB clusters (two readable standbys) as an extra HA option.
    - Cloud-native option. On AWS, Aurora MySQL is the higher-end MySQL-compatible engine. Azure's MySQL equivalent is the Business Critical tier of flexible server, not a separate engine.
  pricing:
    aws: Per instance-hour by class, plus storage, IOPS, backups beyond the free allowance, and Extended Support fees.
    azure: Per vCore-hour by tier, plus storage, extra IOPS, backups beyond the free allowance, and a standby when HA is on.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [AZ-305]
  related: [managed-postgresql, managed-mariadb, aurora-mysql-compatible]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_MySQL.html
    - https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - cloud-sql-mysql
    match: direct
    answer: Amazon RDS for MySQL maps to Cloud SQL for MySQL.
    differences:
    - Cloud SQL Enterprise Plus edition adds faster maintenance, advanced DR, and a data cache.
    - There is no Aurora MySQL counterpart; AlloyDB is PostgreSQL-only.
    pricing: Billed per vCPU and GB of memory per hour by edition (Enterprise or Enterprise Plus), plus storage, backups, and network. Committed use discounts are available.
    sources:
    - https://docs.cloud.google.com/sql/docs/mysql/introduction
    - https://docs.cloud.google.com/sql/docs/mysql/editions-intro
    - https://cloud.google.com/sql/pricing

- id: managed-mariadb
  group: relational-engines
  capability: Managed MariaDB
  what_for: Run MariaDB as a managed database service.
  match: none
  answer: Azure no longer has a managed MariaDB service. Azure Database for MariaDB retired on Sep 19, 2025, and Microsoft's migration target is Azure Database for MySQL (flexible server). Amazon RDS for MariaDB is still available.
  providers:
    aws: [rds-mariadb]
    azure: [azure-database-for-mariadb]
  differences:
    - MariaDB and MySQL have diverged (for example, in JSON handling, system-versioned tables, and some replication features). Test applications against MySQL before moving, or run MariaDB yourself on Azure VMs.
  pricing:
    aws: Per instance-hour plus storage, as for other RDS engines.
    azure: Not applicable (retired).
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [managed-mysql]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_MariaDB.html
    - https://learn.microsoft.com/en-us/lifecycle/products/azure-database-for-mariadb
  gcp:
    services: []
    match: none
    answer: Google Cloud has no managed MariaDB service. Migrate to Cloud SQL for MySQL or self-manage MariaDB on Compute Engine.
    differences:
    - Check MariaDB-specific features (such as system-versioned tables) before moving to MySQL.
    pricing: Not applicable.
    sources:
    - https://docs.cloud.google.com/sql/docs/mysql/introduction

- id: managed-sql-server
  group: relational-engines
  capability: Managed Microsoft SQL Server
  what_for: Run SQL Server databases without managing Windows, SQL Server installs, patching, or backups.
  match: partial
  answer: Amazon RDS for SQL Server maps to Azure SQL Managed Instance (instance-level compatibility, closest to RDS) or Azure SQL Database (database-scoped PaaS). Azure is the native home of SQL Server, so it has more options and deeper engine features than RDS.
  providers:
    aws: [rds-sql-server]
    azure: [azure-sql-managed-instance, azure-sql-database]
  differences:
    - Compatibility. SQL Managed Instance offers near-100% Enterprise Edition compatibility, including SQL Agent, cross-database queries, CLR, and native VNet integration. RDS for SQL Server supports many instance-level features, but without sysadmin or OS access.
    - Versions. RDS runs specific SQL Server versions and editions you choose and upgrade. Azure SQL Database and Managed Instance always run the latest engine (Managed Instance also offers an update policy aligned to SQL Server versions).
    - Licensing. RDS is license-included (or Developer Edition for non-production). Azure lets you bring existing licenses with Azure Hybrid Benefit for a lower vCore price.
    - Scale. Azure SQL Database Hyperscale scales to 128 TB with up to 30 named read replicas. RDS for SQL Server scales up by instance and storage size (check current limits), and its read replicas need Enterprise Edition.
    - Hybrid. The Managed Instance link replicates between on-premises SQL Server and Managed Instance for migration or DR. RDS relies on native backup and restore or AWS DMS.
  pricing:
    aws: Per instance-hour, including the SQL Server license, by edition and class, plus storage and backups.
    azure: Per vCore-hour (or DTU for SQL Database), with or without the SQL license (Azure Hybrid Benefit), plus storage and backup storage. SQL Managed Instance has a free trial offer for the first 12 months.
  exams:
    aws: [SAA-C03, SOA-C03]
    azure: [DP-300, AZ-305]
  faq:
    - q: Should I pick Azure SQL Database or SQL Managed Instance when coming from RDS for SQL Server?
      a: Choose SQL Managed Instance if you use instance-scoped features (SQL Agent jobs, cross-database queries, linked servers, CLR, Service Broker) or want a lift-and-shift. Choose Azure SQL Database (often Hyperscale) for new or single-database apps that don't need those features.
  related: [sql-server-full-control, serverless-relational, global-database, managed-postgresql]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html
    - https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview
    - https://learn.microsoft.com/en-us/azure/azure-sql/database/sql-database-paas-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - cloud-sql-sqlserver
    match: direct
    answer: Amazon RDS for SQL Server maps to Cloud SQL for SQL Server, a managed SQL Server with license-included pricing.
    differences:
    - Like RDS, Cloud SQL doesn't give sysadmin or OS access; for that, run SQL Server on Compute Engine.
    - Cloud SQL doesn't support bring-your-own SQL Server licenses; licenses are billed by Google.
    pricing: Billed per vCPU and GB of memory per hour by edition (Enterprise or Enterprise Plus), plus storage, backups, and network. Committed use discounts are available. SQL Server licenses are billed per vCPU on top.
    sources:
    - https://docs.cloud.google.com/sql/docs/sqlserver/introduction
    - https://cloud.google.com/sql/pricing

- id: sql-server-full-control
  group: relational-engines
  capability: SQL Server (or Oracle) with OS-level control
  what_for: Keep managed backups and patching while still customizing the operating system, database configuration, or third-party agents.
  match: partial
  answer: Amazon RDS Custom maps most closely to SQL Server on Azure Virtual Machines with the SQL IaaS Agent extension, which adds automated backup, patching, and license management to a VM you fully control.
  providers:
    aws: [rds-custom]
    azure: [sql-server-on-azure-vms]
  differences:
    - Model. RDS Custom is still an RDS service, where AWS automates tasks and you can customize the host. SQL Server on Azure VMs is IaaS, and the free SQL IaaS Agent extension adds management features on top.
    - Engines. RDS Custom covers Oracle and SQL Server. On Azure, Oracle with OS access means Oracle on Azure VMs, while the managed Oracle option is Oracle AI Database@Azure.
    - HA. On Azure VMs, you design HA yourself with Always On availability groups or failover cluster instances (shared disks or Azure NetApp Files).
  pricing:
    aws: Per instance-hour (license-included for SQL Server, or bring your own media), plus storage.
    azure: VM pricing plus the SQL Server license (pay-as-you-go per hour, or Azure Hybrid Benefit), plus managed disks. The extension is free.
  exams:
    aws: [SAA-C03]
    azure: [DP-300, AZ-305]
  related: [managed-sql-server, managed-oracle]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-custom.html
    - https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-on-azure-vm-iaas-what-is-overview
  gcp:
    services:
    - sql-server-on-compute-engine
    match: partial
    answer: Amazon RDS Custom has no Google Cloud counterpart. For OS-level control, run SQL Server on Compute Engine with license-included images or your own licenses.
    differences:
    - You manage HA, backups, and patching yourself (Backup and DR can protect SQL Server on VMs).
    - There is no managed-but-customizable middle ground like RDS Custom.
    pricing: Compute Engine VM pricing plus per-vCPU SQL Server license fees for license-included images.
    sources:
    - https://docs.cloud.google.com/compute/docs/instances/sql-server/creating-sql-server-instances
    - https://cloud.google.com/products/compute/pricing

- id: managed-oracle
  group: relational-engines
  capability: Managed Oracle Database
  what_for: Run Oracle Database (including Exadata or Autonomous Database) close to your cloud applications without managing the database infrastructure.
  match: partial
  answer: Amazon RDS for Oracle has no Azure-native equivalent. The Azure option is Oracle AI Database@Azure, where Oracle runs Exadata, Autonomous, and Base Database services in Azure data centers. Its direct AWS counterpart is Oracle Database@AWS.
  providers:
    aws: [rds-oracle, oracle-database-at-aws]
    azure: [oracle-database-at-azure]
  differences:
    - Who runs it. RDS for Oracle is an AWS service on RDS instances. Oracle Database@Azure and Oracle Database@AWS are operated by Oracle (OCI) on Exadata hardware inside the hyperscaler's data centers, with some management done in the OCI console.
    - Scope. Oracle Database@Azure offers Exadata (dedicated or Exascale), Autonomous AI Database, and Base Database Service. RDS for Oracle offers single instances with Multi-AZ and read replicas, but not RAC or Exadata.
    - Buying. Oracle Database@Azure is purchased through an Azure Marketplace private offer, billed by Azure, and counts toward your Azure consumption commitment (MACC). You can bring your own Oracle license.
  pricing:
    aws: RDS for Oracle is billed per instance-hour (bring your own license, or license-included for Standard Edition 2), plus storage. Oracle Database@AWS is billed through AWS Marketplace at Oracle's prices.
    azure: Billed through Azure Marketplace at Oracle's published prices (license-included or bring your own license).
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [sql-server-full-control, managed-db2]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Oracle.html
    - https://docs.aws.amazon.com/odb/latest/UserGuide/what-is-odb.html
    - https://learn.microsoft.com/en-us/azure/oracle/oracle-db/database-overview
  gcp:
    services:
    - oracle-database-google-cloud
    match: partial
    answer: RDS for Oracle and Oracle Database@AWS map to Oracle Database@Google Cloud, which runs Oracle Exadata and Autonomous Database services, operated by Oracle, in Google Cloud data centers.
    differences:
    - There is no Google-managed Oracle like RDS for Oracle; Oracle operates the service on OCI technology.
    - Purchasing goes through Google Cloud Marketplace with Oracle pricing.
    pricing: Priced by Oracle through Google Cloud Marketplace offers.
    sources:
    - https://docs.cloud.google.com/oracle/database/docs/overview
    flags:
    - No public Google Cloud price page for Oracle Database@Google Cloud was found on 2026-10-27.

- id: managed-db2
  group: relational-engines
  capability: Managed IBM Db2
  what_for: Run IBM Db2 as a managed cloud database.
  match: none
  answer: Azure has no managed Db2 service. On Azure, Db2 runs on virtual machines you manage, or through IBM or partner offerings in Azure Marketplace. Amazon RDS for Db2 offers Standard and Advanced editions as a managed service.
  providers:
    aws: [rds-db2]
    azure: []
  differences:
    - On Azure VMs you're responsible for Db2 installation, HA (for example, HADR or pureScale), backups, and patching.
  pricing:
    aws: Per instance-hour plus storage, with the IBM license brought by you or bought through AWS.
    azure: Not applicable.
  exams:
    aws: [SAA-C03]
    azure: [AZ-305]
  related: [managed-oracle]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Db2.html
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases

# ───────────────────────── CLOUD-NATIVE / SERVERLESS ─────────────────────────
  gcp:
    services: []
    match: none
    answer: Google Cloud has no managed IBM Db2 service. Run Db2 on Compute Engine or migrate to Cloud SQL or AlloyDB.
    differences:
    - Database Migration Service doesn't list Db2 as a source.
    pricing: Not applicable.
    sources:
    - https://docs.cloud.google.com/database-migration/docs/overview
- id: cloud-native-postgresql
  group: relational-cloud-native
  capability: Cloud-native PostgreSQL (separate compute and storage)
  what_for: Get PostgreSQL with shared, auto-growing, zone-resilient storage, fast failover, and many low-lag read replicas.
  match: partial
  answer: Microsoft maps Amazon Aurora PostgreSQL to Azure HorizonDB, a PostgreSQL service with disaggregated compute and storage. HorizonDB was in public preview when verified, so for production today the usual Azure target is Azure Database for PostgreSQL (flexible server).
  providers:
    aws: [aurora-postgresql]
    azure: [azure-horizondb, azure-database-for-postgresql]
  differences:
    - Maturity. Aurora PostgreSQL has been generally available for years and includes Global Database, Serverless v2, Limitless Database, Babelfish, and zero-ETL. HorizonDB is in preview, and Microsoft advises confirming its status before planning a production migration.
    - Architecture. Both separate stateless compute from a distributed, zone-resilient storage layer and add read replicas that share storage. HorizonDB uses a database-as-a-log design with separate WAL and data storage fleets.
    - Flexible server is a classic single-node-plus-standby design. It's mature, but it isn't a shared-storage cluster.
  pricing:
    aws: Per instance-hour (or ACU-hour for Serverless v2), plus storage per GB-month, and I/O requests on Aurora Standard (I/O-Optimized has no I/O charge but higher instance and storage prices).
    azure: HorizonDB is billed for compute and storage per its preview pricing page. Flexible server is billed per vCore-hour plus storage.
  exams:
    aws: [SAA-C03, SAP-C02, DVA-C02]
    azure: [AZ-305]
  flags:
    - HorizonDB was in preview when verified. Check for GA, region availability, and pricing before planning on it.
  related: [managed-postgresql, aurora-mysql-compatible, serverless-relational, sharded-postgresql]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.AuroraPostgreSQL.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.StorageReliability.html
    - https://learn.microsoft.com/en-us/azure/horizondb/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - alloydb
    match: direct
    answer: Aurora PostgreSQL maps to AlloyDB for PostgreSQL, a PostgreSQL-compatible database with disaggregated storage, read pool instances, and a columnar engine for analytics.
    differences:
    - AlloyDB's columnar engine accelerates analytical queries inside the operational database.
    - Storage is billed for what you use, like Aurora; compute is billed by primary and read pool machine size.
    pricing: Billed for vCPU and memory of primary and read pool instances, plus database storage and backup storage.
    sources:
    - https://docs.cloud.google.com/alloydb/docs/overview
    - https://docs.cloud.google.com/alloydb/docs/columnar-engine/about
    - https://cloud.google.com/alloydb/pricing

- id: aurora-mysql-compatible
  group: relational-cloud-native
  capability: Cloud-native MySQL-compatible database
  what_for: Get a MySQL-compatible engine with shared multi-AZ storage, fast replicas, and higher throughput than standard MySQL.
  match: partial
  answer: Azure has no Aurora MySQL-style engine. The closest option is Azure Database for MySQL (flexible server), using the Business Critical tier with zone-redundant HA and read replicas.
  providers:
    aws: [aurora-mysql]
    azure: [azure-database-for-mysql]
  differences:
    - Storage. Aurora MySQL keeps data on a shared cluster volume copied across three AZs, and replicas read the same volume. MySQL flexible server uses a primary and standby with their own storage, and read replicas use asynchronous MySQL replication.
    - Features. Aurora MySQL adds Backtrack, fast cloning, Global Database, and Serverless v2. Flexible server has no equivalents for those.
  pricing:
    aws: Per instance-hour or ACU-hour, plus storage and I/O (Standard) or a higher I/O-Optimized price.
    azure: Per vCore-hour by tier, plus storage and IOPS.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [managed-mysql, cloud-native-postgresql]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.AuroraMySQL.html
    - https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
  gcp:
    services:
    - cloud-sql-mysql
    match: partial
    answer: Aurora MySQL has no cloud-native MySQL counterpart on Google Cloud. The closest option is Cloud SQL for MySQL Enterprise Plus edition.
    differences:
    - Cloud SQL uses attached storage per instance, not Aurora's shared distributed storage.
    - Read replicas are separate instances with their own storage.
    pricing: Billed per vCPU and GB of memory per hour by edition (Enterprise or Enterprise Plus), plus storage, backups, and network. Committed use discounts are available.
    sources:
    - https://docs.cloud.google.com/sql/docs/mysql/editions-intro
    - https://cloud.google.com/sql/pricing

- id: serverless-relational
  group: relational-cloud-native
  capability: Serverless relational database (autoscale and pause)
  what_for: Pay only for the database compute you use, scale automatically with load, and pause when idle.
  match: partial
  answer: Microsoft maps Amazon Aurora Serverless v2 to Azure SQL Database serverless (and SQL database in Microsoft Fabric). Both scale compute between limits you set and can pause when idle, but they run different engines (Aurora is MySQL or PostgreSQL; Azure SQL is SQL Server).
  providers:
    aws: [aurora-serverless-v2]
    azure: [azure-sql-database-serverless, sql-database-in-fabric]
  differences:
    - Engine. For serverless PostgreSQL or MySQL on Azure, there's no autoscaling tier. Flexible servers can be stopped and resized, but they don't autoscale.
    - Scaling. Aurora Serverless v2 scales in 0.5-ACU steps and can scale to 0 ACUs with automatic pause. Azure SQL serverless scales between minimum and maximum vCores, bills per second, and auto-pauses after a delay (General Purpose).
    - Fabric. SQL database in Fabric runs the Azure SQL engine on shared Fabric capacity and mirrors data into OneLake automatically.
  pricing:
    aws: Per ACU-hour consumed plus storage and I/O (or I/O-Optimized).
    azure: SQL serverless bills compute per vCore-second used (nothing while paused) plus storage. Fabric SQL database draws from the Fabric capacity you buy.
  exams:
    aws: [SAA-C03, DVA-C02]
    azure: [DP-300, AZ-305]
  related: [cloud-native-postgresql, managed-sql-server]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html
    - https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
    - https://learn.microsoft.com/en-us/fabric/database/sql/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - spanner
    match: partial
    answer: Aurora Serverless v2 has no direct counterpart. Spanner with its managed autoscaler adjusts compute capacity automatically, but it doesn't pause to zero, and Cloud SQL instances don't autoscale compute.
    differences:
    - Spanner compute is measured in processing units and can be very small, but there is always a minimum capacity.
    - Spanner is a different engine (GoogleSQL or PostgreSQL dialect), not a drop-in MySQL/PostgreSQL.
    pricing: Spanner bills compute capacity (processing units or nodes) per hour by edition and region, plus storage.
    sources:
    - https://docs.cloud.google.com/spanner/docs/managed-autoscaler
    - https://docs.cloud.google.com/spanner/docs/instances
    - https://cloud.google.com/spanner/pricing

- id: distributed-sql
  group: relational-cloud-native
  capability: Serverless, active-active distributed SQL
  what_for: Run a strongly consistent relational database that's active in several zones or regions at once, with no failover and no instances to manage.
  match: none
  answer: Azure has no equivalent of Amazon Aurora DSQL. For multi-region active-active on Azure, Cosmos DB (NoSQL) offers multi-region writes; for relational workloads, Azure SQL failover groups and PostgreSQL cross-region replicas are active-passive.
  providers:
    aws: [aurora-dsql]
    azure: []
  differences:
    - Aurora DSQL is PostgreSQL-compatible but not a full PostgreSQL (it uses optimistic concurrency and supports a subset of features), so even on AWS, apps may need changes.
  pricing:
    aws: Per distributed processing unit (DPU) consumed plus storage per GB-month.
    azure: Not applicable.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [AZ-305]
  related: [global-database, multi-region-nosql]
  sources:
    - https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html
  gcp:
    services:
    - spanner
    match: partial
    answer: Aurora DSQL maps partly to Spanner, a globally distributed, strongly consistent relational database with multi-region configurations and up to 99.999% availability.
    differences:
    - Spanner is provisioned in compute capacity (with optional autoscaling); DSQL is serverless and billed per use.
    - Spanner offers a PostgreSQL dialect but is not wire-compatible PostgreSQL for every feature.
    pricing: Billed for compute capacity per hour by edition and region, plus storage and replication.
    sources:
    - https://docs.cloud.google.com/spanner/docs/instances
    - https://docs.cloud.google.com/spanner/docs/postgresql-interface
    - https://cloud.google.com/spanner/pricing

- id: sharded-postgresql
  group: relational-cloud-native
  capability: Horizontally sharded PostgreSQL
  what_for: Spread one PostgreSQL database across many nodes to scale writes and storage beyond a single server.
  match: partial
