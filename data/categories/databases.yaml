- id: key-value-document
  group: nosql
  capability: Serverless key-value and document database
  what_for: Store items by partition key with single-digit-millisecond reads and writes at any scale, without managing servers.
  match: direct
  answer: Amazon DynamoDB maps to Azure Cosmos DB for NoSQL. Both partition data by key, scale throughput elastically, offer serverless and provisioned capacity, and provide change streams and multi-region replication. Their data models, consistency, indexing, and pricing differ, so plan data-model changes rather than a straight port.
  providers:
    aws: [dynamodb]
    azure: [cosmos-db-nosql]
  differences:
    - Capacity units. DynamoDB uses on-demand (per request) or provisioned read and write capacity units. Cosmos DB uses request units (RUs) for all operations, with provisioned, autoscale, or serverless accounts.
    - Indexing and queries. DynamoDB queries by key, with local and global secondary indexes you define. Cosmos DB indexes every property by default and supports a SQL-like query language, including cross-partition queries.
    - Consistency. DynamoDB offers eventually consistent or strongly consistent reads per request. Cosmos DB has five levels (strong, bounded staleness, session, consistent prefix, and eventual), with session as the default.
    - Limits. DynamoDB items are limited to 400 KB, and Cosmos DB items to 2 MB. Both cap throughput per partition, so key design matters on both.
    - Vector search. Cosmos DB for NoSQL has built-in DiskANN vector indexing. DynamoDB typically pairs with OpenSearch or S3 Vectors for vectors.
  pricing:
    aws: On-demand per million read and write request units, or provisioned capacity per hour (with reserved capacity), plus storage per GB-month and optional features (backups, streams, global tables).
    azure: Provisioned RU/s per hour (standard or autoscale, with reserved capacity), or serverless per million RUs, plus storage per GB-month, multiplied by the number of regions.
  exams:
    aws: [SAA-C03, DVA-C02, DEA-C01]
    azure: [DP-420, AZ-305]
  faq:
    - q: Is Cosmos DB the same as DynamoDB?
      a: They solve the same problem and Microsoft maps them, but they aren't API-compatible. Cosmos DB for NoSQL has its own SDKs, query language, and RU-based pricing. Microsoft publishes guidance for migrating DynamoDB apps to Cosmos DB.
  related: [multi-region-nosql, nosql-change-streams, nosql-cache, simple-table-store, document-database]
  sources:
    - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
    - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html
    - https://learn.microsoft.com/en-us/azure/cosmos-db/overview
    - https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - firestore
    match: direct
    answer: Amazon DynamoDB maps to Firestore, a serverless document database. For very high-throughput key-value access, Bigtable is the other option.
    differences:
    - Firestore is a document model with collections and indexes; DynamoDB is key-value with partition and sort keys.
    - Firestore Enterprise edition adds an advanced query engine and a different pricing model.
    pricing: Standard edition bills per document read, write, and delete plus storage. Enterprise edition bills by bytes read and written (in tranches), storage, and egress.
    sources:
    - https://docs.cloud.google.com/firestore/native/docs/overview
    - https://docs.cloud.google.com/firestore/native/docs/editions-overview
    - https://cloud.google.com/firestore/pricing

- id: multi-region-nosql
  group: nosql
  capability: Multi-region, multi-active NoSQL replication
  what_for: Let users in several regions read and write the same data locally, and keep running if a region fails.
  match: direct
  answer: DynamoDB global tables map to Cosmos DB global distribution with multi-region writes. Both replicate every write to all regions and let any region accept writes.
  providers:
    aws: [dynamodb-global-tables]
    azure: [cosmos-db-global-distribution]
  differences:
    - Consistency. Global tables offer multi-Region eventual consistency (default) or multi-Region strong consistency (MRSC), and all replicas in a table must use the same mode. Global tables can also span multiple AWS accounts. Cosmos DB applies its account consistency level, and strong consistency isn't available with multi-region writes.
    - Conflicts. Global tables use last writer wins (in eventual mode). Cosmos DB offers last writer wins (on a timestamp or custom property) or custom merge procedures.
    - SLA. Cosmos DB offers a 99.999% read and write availability SLA with multi-region writes. DynamoDB global tables also have a 99.999% SLA.
  pricing:
    aws: Replicated write request units in each Region plus storage per Region and cross-Region transfer.
    azure: Provisioned RU/s and storage billed in every region. Multi-region writes multiply RU costs across regions.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [DP-420, AZ-305]
  related: [key-value-document, distributed-sql]
  sources:
    - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
    - https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally
  gcp:
    services:
    - firestore
    - bigtable
    match: partial
    answer: DynamoDB global tables map partly to Firestore multi-region locations (one database replicated across regions) and Bigtable replication with multi-cluster routing (writes in any cluster, eventually consistent).
    differences:
    - Firestore multi-region locations are fixed configurations, not arbitrary region sets.
    - Bigtable reads and writes to different clusters are eventually consistent, as with global tables.
    pricing: Multi-region Firestore and replicated Bigtable clusters cost more for storage and capacity.
    sources:
    - https://docs.cloud.google.com/firestore/native/docs/locations
    - https://docs.cloud.google.com/bigtable/docs/replication-overview

- id: nosql-change-streams
  group: nosql
  capability: NoSQL change data capture stream
  what_for: React to every insert or update in a table to trigger functions, sync search indexes, or feed analytics.
  match: direct
  answer: DynamoDB Streams maps to the Azure Cosmos DB change feed. Both expose an ordered log of item changes that Lambda or Azure Functions can trigger on.
  providers:
    aws: [dynamodb-streams]
    azure: [cosmos-db-change-feed]
  differences:
    - Retention. DynamoDB Streams keeps changes for 24 hours. The Cosmos DB change feed in latest-version mode is persistent for as long as the item exists, and you can read it from the beginning.
    - Deletes. DynamoDB Streams includes deletes and old and new item images. The Cosmos DB default (latest version) mode omits deletes and intermediate versions; the all-versions-and-deletes mode adds them for a retention window.
    - Consumers. DynamoDB Streams uses Lambda triggers or the Kinesis adapter. Cosmos DB uses Functions triggers, the change feed processor, the pull model, or Spark.
  pricing:
    aws: Stream read requests (free for Lambda triggers) per 100,000 requests.
    azure: Reading the change feed consumes RUs from the container's throughput.
  exams:
    aws: [DVA-C02, SAA-C03]
    azure: [DP-420]
  related: [key-value-document]
  sources:
    - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
    - https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed
  gcp:
    services:
    - bigtable
    match: partial
    answer: DynamoDB Streams maps to Bigtable change streams for Bigtable. Firestore changes are consumed through Eventarc triggers or client listeners rather than a stream API.
    differences:
    - Spanner also has change streams for relational data.
    pricing: Change streams add storage and processing costs.
    sources:
    - https://docs.cloud.google.com/bigtable/docs/change-streams-overview
    - https://docs.cloud.google.com/spanner/docs/change-streams

