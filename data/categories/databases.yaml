- id: in-memory-cache
  group: specialty-databases
  capability: Managed in-memory cache (Redis-compatible)
  what_for: Speed up apps by caching data, sessions, and leaderboards in memory, with sub-millisecond latency.
  match: direct
  answer: Amazon ElastiCache maps to Azure Managed Redis. Azure Cache for Redis, the older service, is retiring (Enterprise tiers on March 31, 2027, and Basic, Standard, and Premium tiers on September 30, 2028), so new designs should use Azure Managed Redis.
  providers:
    aws: [elasticache]
    azure: [azure-managed-redis]
  differences:
    - Engines. ElastiCache offers Valkey (the open-source Redis fork AWS now favors, priced lower), Redis OSS, and Memcached. Azure Managed Redis runs Redis Enterprise software, with modules such as search, JSON, and time series. Azure has no managed Memcached.
    - Deployment. ElastiCache offers serverless caches (no capacity planning) or node-based clusters. Azure Managed Redis uses fixed SKUs in Memory Optimized, Balanced, Compute Optimized, and Flash Optimized tiers.
    - Multi-region. ElastiCache uses Global Datastore (one writable primary Region). Azure Managed Redis supports active geo-replication, where every region can write.
  pricing:
    aws: Serverless bills per GB-hour of data stored plus ElastiCache Processing Units. Node-based bills per node-hour (reserved nodes available). Valkey is priced lower than Redis OSS.
    azure: Per instance-hour by tier and size, with high availability (two nodes) on by default.
  exams:
    aws: [SAA-C03, DVA-C02]
    azure: [AZ-305]
  flags:
    - Azure Cache for Redis retirement dates are from Microsoft's retirement notice. Plan migrations to Azure Managed Redis.
  related: [durable-in-memory, nosql-cache]
  sources:
    - https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
    - https://learn.microsoft.com/en-us/azure/redis/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - memorystore-valkey
    match: direct
    answer: Amazon ElastiCache maps to Memorystore for Valkey, a managed cache compatible with open-source Redis clients.
    differences:
    - Memorystore for Valkey supports cluster mode, replicas, and optional persistence.
    - Valkey is the open-source fork of Redis; check feature parity with ElastiCache for Redis OSS or Valkey.
    pricing: Billed per node-hour by node type and replica count.
    sources:
    - https://docs.cloud.google.com/memorystore/docs/valkey/product-overview
    - https://cloud.google.com/memorystore/valkey/pricing

- id: durable-in-memory
  group: specialty-databases
  capability: Durable in-memory primary database
  what_for: Use a Redis-compatible store as your primary database, with in-memory speed and no data loss on failure.
  match: none
  answer: Microsoft states that Azure has no direct equivalent of Amazon MemoryDB. Azure Managed Redis supports persistence (RDB or AOF) and high availability, but it's designed as a cache, not a durable primary database with a multi-AZ transaction log.
  providers:
    aws: [memorydb]
    azure: []
  differences:
    - MemoryDB commits every write to a distributed Multi-AZ transaction log before acknowledging it, so a failover loses no acknowledged writes. Redis persistence on Azure Managed Redis is periodic or append-only to disk and isn't intended as the system of record.
  pricing:
    aws: Per node-hour plus data written per GB, and snapshot storage.
    azure: Not applicable.
  exams:
    aws: [SAA-C03, DVA-C02]
    azure: [AZ-305]
  related: [in-memory-cache]
  sources:
    - https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb.html
    - https://learn.microsoft.com/en-us/azure/redis/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - memorystore-valkey
    match: partial
    answer: Amazon MemoryDB has no exact counterpart. Memorystore for Valkey with AOF persistence (fsync every second by default, or on every write) is the closest option.
    differences:
    - MemoryDB uses a multi-AZ transaction log; Memorystore AOF persistence writes to durable storage per node.
    - You must choose RDB or AOF persistence, not both.
    pricing: Billed per node-hour; AOF persistence adds cost, RDB persistence doesn't.
    sources:
    - https://docs.cloud.google.com/memorystore/docs/valkey/about-aof-persistence
    - https://cloud.google.com/memorystore/valkey/pricing

- id: ledger-database
  group: specialty-databases
  capability: Tamper-evident ledger data
  what_for: Keep a cryptographically verifiable history of changes to records, so auditors can prove nothing was altered.
  match: partial
  answer: Amazon QLDB was retired on July 31, 2025, and AWS recommended Aurora PostgreSQL for migrations. On Azure, the ledger feature in Azure SQL Database, SQL Managed Instance, and SQL Server provides tamper-evident tables inside a normal relational database.
  providers:
    aws: [qldb]
    azure: [sql-ledger]
  differences:
    - QLDB was a standalone document ledger database with its own PartiQL interface. Azure SQL ledger adds updatable or append-only ledger tables to a relational database, hashes changes into a chain, and stores database digests in immutable storage (such as immutable Blob Storage) for verification.
  pricing:
    aws: Not applicable (retired).
    azure: No extra charge for the feature. You pay for the database and digest storage.
  exams:
    aws: []
    azure: [DP-300]
  flags:
    - QLDB is retired. This row is kept for study material that still mentions it.
  related: [managed-sql-server]
  sources:
    - https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html
    - https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview

# ───────────────────────── MIGRATION & INTEGRATION ─────────────────────────
  gcp:
    services: []
    match: none
    answer: Google Cloud has no ledger database. QLDB itself is retired; use application-level hash chaining in Spanner or Cloud SQL, or append-only Cloud Storage with Bucket Lock.
    differences:
    - Bucket Lock gives WORM retention but not cryptographic verification of history.
    pricing: Not applicable.
    sources:
    - https://docs.cloud.google.com/storage/docs/bucket-lock
- id: database-migration
  group: database-migration
  capability: Database migration and continuous replication
  what_for: Move a database to the cloud (or between engines) with minimal downtime, using full load plus ongoing change capture.
  match: partial
  answer: AWS Database Migration Service maps to Azure Database Migration Service. AWS DMS is a general replication engine with many sources and targets, plus Schema Conversion for engine changes. Azure DMS focuses on migrations to Azure SQL targets and Azure Database for MySQL, while other engines use their own tools (such as the PostgreSQL migration service in flexible server).
  providers:
    aws: [database-migration-service]
    azure: [azure-database-migration-service]
  differences:
    - Scope. AWS DMS supports homogeneous and heterogeneous migrations, ongoing CDC replication, and DMS Serverless. Azure DMS supports online and offline migrations to Azure SQL, Managed Instance, SQL Server on VMs, and MySQL. Check its scenario matrix for others.
    - Schema conversion. AWS has DMS Schema Conversion (and the Schema Conversion Tool). Microsoft uses SQL Server Migration Assistant (SSMA) for Oracle, Db2, and other sources to SQL.
  pricing:
    aws: Per replication instance-hour (or DCU-hour for DMS Serverless) plus storage. Schema Conversion has no charge for the feature itself.
    azure: The Standard tier is free. Premium is billed per vCore-hour, with a free period for new instances.
  exams:
    aws: [SAA-C03, SAP-C02]
    azure: [DP-300, AZ-305]
  flags:
    - Azure DMS supported scenarios change often. Check the current scenario matrix before relying on a source and target pair.
  related: [operational-analytics]
  sources:
    - https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
    - https://learn.microsoft.com/en-us/azure/dms/dms-overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
    - database-migration-service
    - datastream
    match: direct
    answer: AWS DMS maps to Database Migration Service (one-time and continuous migrations into Cloud SQL and AlloyDB) and Datastream (serverless change data capture).
    differences:
    - Database Migration Service targets Cloud SQL and AlloyDB; for other targets, use Datastream.
    - Heterogeneous migrations (for example Oracle to PostgreSQL) include schema conversion.
    pricing: Homogeneous migrations to Cloud SQL or AlloyDB are free; heterogeneous migrations are billed per GiB processed. Datastream is billed per GiB processed.
    sources:
    - https://docs.cloud.google.com/database-migration/docs/overview
    - https://cloud.google.com/database-migration/pricing
    - https://docs.cloud.google.com/datastream/docs/overview

- id: operational-analytics
  group: database-migration
  capability: Zero-ETL replication into analytics
  what_for: Analyze operational database data in near real time without building or running ETL pipelines.
  match: partial
  answer: Aurora and RDS zero-ETL integrations (to Amazon Redshift or a SageMaker lakehouse) map to Microsoft Fabric mirroring, which continuously replicates Azure SQL, Cosmos DB, PostgreSQL, and other sources into OneLake as Delta tables.
  providers:
    aws: [rds-zero-etl]
    azure: [fabric-mirroring]
  differences:
    - Target. Zero-ETL lands data in Redshift (or a SageMaker lakehouse) for querying. Fabric mirroring lands open Delta tables in OneLake, readable by every Fabric engine and by other Delta readers.
    - Sources. Zero-ETL covers Aurora MySQL and PostgreSQL, RDS for MySQL and PostgreSQL, DynamoDB, and others (check the current list). Mirroring covers Azure SQL, Cosmos DB, Azure Database for PostgreSQL, Snowflake, and others, including open mirroring for partners.
  pricing:
    aws: No charge for the integration itself. You pay for change processing on the source and for Redshift compute and storage.
    azure: Mirroring compute for replication is free, with free OneLake storage up to a limit tied to capacity size. Queries use Fabric capacity.
  exams:
    aws: [DEA-C01]
    azure: [AZ-305]
  related: [database-migration]
  sources:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/zero-etl.html
    - https://learn.microsoft.com/en-us/fabric/mirroring/overview
  gcp:
    services:
    - datastream
    match: partial
    answer: RDS and Aurora zero-ETL integrations map partly to Datastream replication into BigQuery, or to BigQuery federated queries against Cloud SQL. AlloyDB's columnar engine handles analytics in place.
    differences:
    - Datastream is a CDC pipeline you configure, not a single checkbox integration.
    - Federated queries read live data without copying it.
    pricing: Datastream is billed per GiB processed, plus BigQuery storage and queries.
    sources:
    - https://docs.cloud.google.com/datastream/docs/overview
    - https://docs.cloud.google.com/bigquery/docs/cloud-sql-federated-queries
    - https://cloud.google.com/datastream/pricing
