  answer: Amazon Timestream for LiveAnalytics maps to Azure Data Explorer (or Eventhouse in Microsoft Fabric), which runs on the same engine. Timestream for LiveAnalytics closed to new customers on June 20, 2025, and AWS now steers new workloads to Timestream for InfluxDB.
  providers:
