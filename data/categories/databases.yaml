    match: direct
    answer: Amazon DocumentDB maps to Firestore with MongoDB compatibility, which accepts MongoDB drivers and the MongoDB Query Language on serverless Firestore Enterprise edition.
    differences:
    - Firestore is serverless with no instances to size; DocumentDB has instance-based and elastic clusters.
