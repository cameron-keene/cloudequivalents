  answer: Amazon DocumentDB maps to Azure DocumentDB (vCore-based, open-source DocumentDB engine) or Azure Cosmos DB for MongoDB (RU-based). Both clouds implement the MongoDB wire protocol on their own engines rather than running MongoDB itself.
  providers:
    aws: [documentdb]
    azure: [azure-documentdb]
  differences:
    - Engine. Amazon DocumentDB is AWS's own engine on Aurora-style storage. Azure DocumentDB is built on the open-source DocumentDB project (PostgreSQL-based), which can also run on-premises or in other clouds.
    - Scaling. Amazon DocumentDB has instance-based clusters (up to 256 TiB storage on version 8.0) and elastic clusters (sharded). Azure DocumentDB uses vCore-based clusters with sharding. Cosmos DB for MongoDB (RU) is a serverless or provisioned-throughput alternative.
    - Compatibility. Neither is full MongoDB. Test the commands, aggregation stages, and index types your app uses, and check the supported MongoDB API versions.
  pricing:
    aws: Per instance-hour plus storage and I/O (or I/O-optimized), backups, and elastic cluster shard pricing.
    azure: Azure DocumentDB bills per cluster tier (vCores and memory) plus storage. Cosmos DB for MongoDB (RU) uses RU-based pricing.
  exams:
    aws: [SAA-C03, DVA-C02]
    azure: [DP-420, AZ-305]
  flags:
    - Azure DocumentDB is the new name for the former vCore-based Azure Cosmos DB for MongoDB. Older study materials use the earlier name.
  related: [key-value-document]
  sources:
    - https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html
    - https://learn.microsoft.com/en-us/azure/documentdb/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/databases
  gcp:
    services:
