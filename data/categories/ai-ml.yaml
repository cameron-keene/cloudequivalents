# ───────────────────────── LANGUAGE ─────────────────────────
- id: text-analytics
  group: language
  capability: Text analytics (entities, sentiment, key phrases)
  what_for: Extract entities, sentiment, key phrases, and language from text through an API.
  match: direct
  answer: The Azure equivalent of Amazon Comprehend is Azure Language. Note that Azure now labels sentiment, key phrases, summarization, and entity linking as "legacy" capabilities, supported for existing implementations.
  providers:
    aws: [comprehend]
    azure: [azure-language]
  differences:
    - Azure's "core" (recommended) capabilities are PII, language detection, NER, custom NER, and Text Analytics for health. Sentiment and opinion mining, key phrases, entity linking, summarization, and custom text classification are "legacy".
    - Comprehend topic modeling, event detection, and prompt safety classification are closed to new customers (Mar 31, 2026). AWS points to Bedrock LLMs and Guardrails instead.
    - Both vendors steer new open-ended NLP (topics, events, summaries) toward LLMs (Bedrock or Foundry models).
    - Azure Language capabilities are also available as agent tools through the Azure Language MCP server.
  pricing:
    aws: Per unit of text (100 characters), with a 3-unit minimum per request, by feature. Custom models add training and endpoint-hour charges.
    azure: Per text record (1,000 characters), by feature, with a free tier and commitment tiers. Custom features add training and hosting charges.
  exams:
    aws: [AIF-C01]
    azure: [AI-901, AI-103]
  related: [custom-nlp, pii-detection, medical-nlp, translation]
  sources:
    - https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
    - https://docs.aws.amazon.com/comprehend/latest/dg/comprehend-availability-change.html
    - https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/data-ai
  flags:
    - Unit sizes (100 vs 1,000 characters) come from each vendor's pricing structure. Confirm on the pricing pages.

