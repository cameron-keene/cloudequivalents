rows:
# ───────────────────────── GENERATIVE AI ─────────────────────────
- id: foundation-model-api
  group: genai
  capability: Foundation model API platform
  what_for: Call hosted large language, image, and embedding models through one managed API, without running GPUs yourself.
  match: direct
  answer: The Azure equivalent of Amazon Bedrock is Microsoft Foundry Models (which includes Azure OpenAI). Both are managed, pay-per-token, multi-vendor model APIs.
  providers:
    aws: [bedrock]
    azure: [foundry-models, foundry]
  differences:
    - Model overlap is now large. Both offer OpenAI GPT models, Anthropic Claude, xAI Grok, Meta Llama, Mistral, DeepSeek, Cohere, and Moonshot Kimi. Check per-model region and lifecycle on each side.
    - Only on Bedrock (first-party), Amazon Nova. Bedrock also lists Qwen, Stability AI, TwelveLabs, Writer, Luma, AI21, Z.ai GLM, MiniMax, NVIDIA Nemotron, and Google Gemma.
    - Only on Foundry (first-party), Microsoft MAI and Phi models plus Model Router. Foundry also lists Black Forest Labs FLUX, Sora (video, preview), and 10,000+ catalog models, including Hugging Face models on managed compute.
    - Claude on Foundry comes in two versions, "Hosted on Azure" and "Hosted on Anthropic infrastructure". Availability and lifecycle differ per model, and some subscription types (CSP, credit-only, free trial) can't use Claude.
    - APIs. Bedrock offers Converse, InvokeModel, OpenAI-compatible Chat Completions and Responses, and the Anthropic Messages API (bedrock-runtime and bedrock-mantle endpoints). Foundry is moving to the OpenAI v1 routes and Responses API on one project endpoint, replacing the monthly api-version parameters and the Assistants API.
    - Data residency. Bedrock uses Global and Geo cross-Region inference profiles. Foundry uses Global, Data Zone, and Regional deployment types.
    - Auth. Bedrock uses IAM (SigV4) or Bedrock API keys. Foundry uses Microsoft Entra ID or keys.
  pricing:
    aws: On-demand pricing per input/output token (media models price per image or per second of video). Batch inference is priced below on-demand. Provisioned Throughput is billed per model unit per hour, with optional commitment terms. Prices vary by model and Region.
    azure: Standard (serverless) deployments are billed per token. Provisioned deployments are billed for reserved PTUs (hourly, or with monthly/annual reservations). Batch deployments are discounted vs Standard. Partner models such as Claude are billed through Azure Marketplace at the provider's rates.
  exams:
    aws: [AIF-C01, AWS-GAI-PRO]
    azure: [AI-901, AI-103]
  faq:
    - q: Is Azure OpenAI the same as Microsoft Foundry?
      a: Azure OpenAI is now one family of models inside Microsoft Foundry Models. An existing Azure OpenAI resource can be upgraded to a Foundry resource and keep its endpoint and keys.
    - q: Can I use Claude on Azure like on Bedrock?
      a: Yes, Claude models are available in Microsoft Foundry as partner models. They're billed through Azure Marketplace and have subscription-type restrictions that Bedrock doesn't have.
    - q: Can I use OpenAI GPT models on Bedrock?
      a: Yes. As of Oct 2026, Bedrock lists OpenAI GPT-5.x/GPT-6 models and gpt-oss on its model cards page, available through the Responses, Converse, and Chat Completions APIs.
  related: [model-customization, provisioned-throughput, model-catalog-open-weights, first-party-models, managed-agents]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html
    - https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry
    - https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-from-partners
    - https://learn.microsoft.com/en-us/azure/architecture/aws-professional/data-ai
  flags:
    - Model lineups change monthly. The overlap list reflects the vendor model pages on 2026-10-19.

- id: first-party-models
  group: genai
  capability: Cloud provider's own foundation models
  what_for: The cloud vendor's own model families, often the cheapest or most deeply integrated option on that cloud.
  match: partial
  answer: Amazon Nova's closest Azure counterpart is Microsoft's own models in Foundry (MAI and Phi, plus Model Router). But Microsoft's flagship LLMs on Azure are mainly OpenAI GPT models, so there's no one-to-one family match.
  providers:
    aws: [amazon-nova]
    azure: [microsoft-models, foundry-models]
  differences:
    - Nova covers understanding (Micro/Lite/Pro, Nova 2 Lite), creative (Canvas image, Reel video), speech-to-speech (Nova 2 Sonic), and multimodal embeddings, all from Amazon.
    - On Azure, first-party models include the MAI models (for example MAI-Image), Phi small language models, Model Router, and healthcare AI models. General-purpose frontier LLM work on Azure usually means Azure OpenAI GPT models, which are "sold by Azure" but built by OpenAI.
    - For speech-to-speech, Nova Sonic maps more naturally to Azure Voice Live or realtime audio models than to a Microsoft-built LLM.
  pricing:
    aws: Nova is priced per token (text), per image, or per second of video on Bedrock, with batch and Provisioned Throughput options.
    azure: Microsoft models sold by Azure are priced per token (or per image) on serverless deployments. Some offer provisioned throughput.
  exams:
    aws: [AIF-C01, AWS-GAI-PRO]
    azure: [AI-901, AI-103]
  faq:
    - q: What is the Azure equivalent of Amazon Nova?
      a: There isn't an exact one. Microsoft's own models (MAI, Phi) are the first-party counterpart, while Azure OpenAI GPT models fill the general-purpose flagship role.
  related: [foundation-model-api, realtime-voice]
  sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure

- id: model-catalog-open-weights
  group: genai
  capability: Open-weight model hub on dedicated compute
  what_for: Pick an open or specialized model from a catalog and deploy it onto GPUs dedicated to you, often to fine-tune it or meet isolation needs.
  match: direct
  answer: SageMaker JumpStart and Bedrock Marketplace map to the Microsoft Foundry model catalog's managed-compute deployments (and the Azure Machine Learning model catalog).
  providers:
    aws: [sagemaker-jumpstart, bedrock-marketplace]
    azure: [foundry-models, azure-machine-learning]
  differences:
    - Foundry advertises 10,000+ catalog models (including Hugging Face) and states that partner/community models are the large majority. Hugging Face managed-compute deployments currently use hub-based projects in the Foundry (classic) portal.
    - JumpStart supports private and curated hubs for governing which models teams may use. Bedrock Marketplace models are called through Bedrock APIs, so Guardrails, Knowledge Bases, and Agents integrate with them.
    - Billing is per instance/VM-hour on both sides when you deploy to dedicated compute.
  pricing:
    aws: SageMaker instance-hours for the endpoint (plus any model-provider software fee for Marketplace models).
    azure: VM core-hours for managed compute deployments (plus any provider fee shown in the catalog).
  exams:
    aws: [MLA-C01, AWS-GAI-PRO]
    azure: [AI-103, AI-300]
  faq:
    - q: Where do I deploy a Hugging Face model on Azure?
      a: Deploy it from the Foundry model catalog to managed compute (hub-based project in Foundry classic), or through Azure Machine Learning.
  related: [foundation-model-api, ml-inference-endpoints, model-customization]
  sources:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/amazon-bedrock-marketplace.html
    - https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview

- id: model-customization
  group: genai
  capability: Foundation model fine-tuning & distillation
  what_for: Adapt a hosted model to your domain with your own data, without managing training infrastructure.
  match: direct
  answer: Bedrock model customization maps to Foundry fine-tuning. Both offer supervised fine-tuning, reinforcement fine-tuning, and distillation for selected models.
  providers:
    aws: [bedrock-model-customization]
    azure: [foundry-fine-tuning]
  differences:
    - Bedrock offers supervised fine-tuning, reinforcement fine-tuning (reward functions written in AWS Lambda, or training from invocation logs), and managed distillation (teacher to student).
    - Foundry offers SFT, preference fine-tuning (DPO), and reinforcement fine-tuning (model-specific). Distillation is done through teacher-generated SFT data. Fine-tuned models deploy serverless or on managed compute with LoRA adapters (preview).
    - Which base models are tunable differs a lot and changes often. Check each side's supported-model table.
  pricing:
    aws: Billed per training token (tokens in corpus × epochs) plus monthly model storage. Inference on a custom model may require Provisioned Throughput or on-demand custom model pricing, depending on the model.
    azure: Billed per training token or training hour (model-dependent), plus hourly hosting for deployed fine-tuned models (Developer tier available for testing).
  exams:
    aws: [AWS-GAI-PRO, MLA-C01]
    azure: [AI-103, AI-300]
  faq:
    - q: Does Azure have reinforcement fine-tuning like Bedrock?
      a: Yes, Foundry lists reinforcement fine-tuning (RFT) for supported models, alongside SFT and DPO.
  related: [foundation-model-api, ml-training-jobs]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
    - https://learn.microsoft.com/en-us/azure/foundry/fine-tuning/overview

- id: provisioned-throughput
  group: genai
  capability: Reserved model throughput & cross-region routing
  what_for: Guarantee model capacity for production traffic, or spread requests across regions to get more throughput.
  match: direct
  answer: Bedrock Provisioned Throughput and cross-Region inference map to Foundry Provisioned (PTU) deployments and the Global/Data Zone deployment types.
  providers:
    aws: [bedrock-provisioned-throughput]
    azure: [foundry-deployment-types]
  differences:
    - Bedrock reserves capacity in model units per specific model. Some Foundry models offer fungible provisioned throughput, so quota and reservations can be shifted across eligible models.
    - Geography. Bedrock offers Global and Geo cross-Region inference profiles (for example US Geo). Foundry offers Global, Data Zone (US/EU), and Regional, each as Standard, Provisioned, or Batch.
  pricing:
    aws: Provisioned Throughput is billed hourly per model unit, with no-commitment or term options. Cross-Region inference is billed at the source Region's on-demand rates, and global profiles can be cheaper.
    azure: PTUs are billed hourly, with discounted monthly/annual Azure reservations. Global/Data Zone Standard is billed per token.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103, AI-200]
  related: [foundation-model-api]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
    - https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview

- id: genai-workflows
  group: genai
  capability: Prompt & LLM workflow orchestration
  what_for: Chain prompts, models, retrieval, and code steps into a versioned flow your app can call.
  match: partial
  answer: Bedrock Flows (with Prompt management) maps most closely to Microsoft Agent Framework workflows on Azure. The older Azure Prompt flow is deprecated and retires on April 20, 2027.
  providers:
    aws: [bedrock-flows]
    azure: [microsoft-agent-framework, prompt-flow]
  differences:
    - Bedrock Flows is a managed, visual service with nodes (prompt, knowledge base, Lambda, and more), immutable versions, and aliases called through InvokeFlow.
    - Microsoft Agent Framework is an SDK (code-first). You host it yourself or as a Foundry hosted agent, so there's no fully managed visual flow service with the same shape.
    - Prompt flow container images no longer receive updates, so don't start new work on it.
  pricing:
    aws: Flows bills per node transition, plus the model, knowledge base, and Lambda usage it triggers.
    azure: Agent Framework is open-source (no charge). You pay for the models, tools, and compute you run, such as hosted-agent container compute.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103, AI-500]
  related: [managed-agents, agent-frameworks]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html
    - https://learn.microsoft.com/en-us/azure/machine-learning/prompt-flow/overview-what-is-prompt-flow
    - https://learn.microsoft.com/en-us/agent-framework/overview/
  flags:
    - "Bedrock Flows pricing unit (per node transition) is from the Bedrock pricing page structure. Confirm current terms on the pricing page."

- id: genai-evaluation
  group: genai
  capability: Model, RAG & agent evaluation
  what_for: Score model, RAG, and agent quality and safety (automatically, with an LLM judge, or with humans) before and after release.
  match: direct
  answer: Bedrock Evaluations and AgentCore Evaluations map to Foundry observability and evaluations (built-in and custom evaluators, continuous evaluation, and tracing).
  providers:
    aws: [bedrock-evaluations, bedrock-agentcore]
    azure: [foundry-observability]
  differences:
    - Bedrock Evaluations covers models (including Marketplace, custom, and imported models, and prompt routers) and RAG sources, including ones outside Bedrock. It supports human-worker evaluation jobs.
    - AgentCore Evaluations and Optimization score agent sessions and traces (Strands, LangGraph, OpenTelemetry/OpenInference) and run A/B tests on prompt and tool-description changes.
    - Foundry combines tracing, evaluators, and monitoring dashboards (some preview), and adds Agent optimizer (preview) to propose better instructions and tools.
  pricing:
    aws: You pay for the model inference used (generator and judge models) plus any human-evaluation task fees. AgentCore Evaluations is consumption-based.
    azure: Evaluations bill for the judge/model tokens consumed. Tracing data lands in Application Insights (Azure Monitor pricing).
  exams:
    aws: [AWS-GAI-PRO, AIF-C01]
    azure: [AI-103, AI-300]
  related: [managed-agents, guardrails, rag-knowledge-bases]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
    - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    - https://learn.microsoft.com/en-us/azure/foundry/concepts/observability

- id: multimodal-extraction
  group: genai
  capability: GenAI multimodal content extraction (IDP)
  what_for: Turn documents, images, audio, and video into structured fields with a schema, using generative AI instead of hand-built templates.
  match: direct
  answer: The Azure equivalent of Amazon Bedrock Data Automation is Azure Content Understanding.
  providers:
    aws: [bedrock-data-automation]
    azure: [content-understanding]
  differences:
    - Both handle documents, images, audio, and video, use user-defined output schemas, and return confidence information.
    - Content Understanding ships prebuilt industry analyzers (tax, procurement, contracts, call center, media) and is the path Microsoft recommends for parts of the retiring Image Analysis and Custom Vision.
    - Bedrock Data Automation plugs into Bedrock Knowledge Bases as a parser for multimodal RAG.
  pricing:
    aws: Billed per page (documents), per image, or per minute (audio/video), with standard vs custom-output tiers.
    azure: Billed per unit processed (pages, images, minutes) plus the generative model tokens used for field extraction.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103]
  related: [document-ocr, image-analysis, rag-knowledge-bases]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/bda.html
    - https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
  flags:
    - Pricing units are described at a high level. Confirm exact meters on the pricing pages.

# ───────────────────────── AGENTS ─────────────────────────
- id: managed-agents
  group: agents
  capability: Managed AI agent platform
  what_for: Run AI agents that reason, call tools, and keep context, with hosting, scaling, identity, and tracing handled for you.
  match: direct
  answer: The Azure equivalent of Amazon Bedrock AgentCore is Foundry Agent Service. Both host declarative or code-based agents from any framework and model.
  providers:
    aws: [bedrock-agentcore]
    azure: [foundry-agent-service]
  differences:
    - "Shape. AgentCore is a set of modular services you can use independently: Harness (config-defined managed agent loop in an isolated microVM), Runtime (serverless hosting for code agents), Memory, Gateway, Identity, Code Interpreter, Browser, Observability, Evaluations, Optimization, Policy, Registry, and Payments."
    - Foundry Agent Service has three agent types. Prompt agents are declarative. Voice-based prompt agents run on Voice Live (preview). Hosted agents run your container or zip. You can also call the Responses API for "ephemeral" agents you define in code.
    - Frameworks. AgentCore Runtime lists Strands, LangGraph, CrewAI, LlamaIndex, Google ADK, and OpenAI Agents SDK. Foundry hosted agents list Microsoft Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK, and GitHub Copilot SDK.
    - Models. AgentCore works with models in or outside Bedrock (OpenAI, Gemini, and others). Foundry agents use Foundry catalog models.
    - Distribution. Foundry agents can be published to Microsoft Teams, Microsoft Copilot, and the Entra Agent Registry. AgentCore has its own Registry for agents, MCP servers, and skills.
    - Only AgentCore offers Payments (x402 and Machine Payments Protocol microtransactions).
  pricing:
    aws: Consumption-based per AgentCore component (for example Runtime compute while active, Gateway calls, Memory events/records, Browser and Code Interpreter sessions), plus model tokens. No upfront commitment.
    azure: Prompt agents are billed per call for inference plus tool usage. Hosted agents add container compute, and voice agents add Voice Live usage.
  exams:
    aws: [AWS-GAI-PRO, AIF-C01]
    azure: [AI-103, AI-500]
  faq:
    - q: Should I use Bedrock Agents or AgentCore?
      a: New customers should use AgentCore. Bedrock Agents was renamed Agents Classic and stopped accepting new customers on July 30, 2026.
    - q: What is the Azure equivalent of AgentCore Runtime?
      a: Foundry Agent Service hosted agents. You bring code in any supported framework, and Foundry runs it with a managed endpoint, scaling, and a dedicated Entra identity.
  related: [bedrock-agents-classic, agent-tools, agent-memory, agent-identity-governance, agent-frameworks, genai-evaluation]
  sources:
    - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    - https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry

- id: bedrock-agents-classic
  group: agents
  capability: Configuration-based agents (legacy Bedrock Agents)
  what_for: Define an agent by configuration (instructions, action groups, and knowledge bases) instead of writing orchestration code.
  match: partial
  answer: Bedrock Agents Classic is in maintenance (no new customers since July 30, 2026). On Azure, the equivalent concept is a Foundry prompt agent, and on AWS the successor is the AgentCore managed harness.
  providers:
    aws: [bedrock-agents-classic, bedrock-agentcore]
    azure: [foundry-agent-service]
  differences:
    - AWS's migration path is the AgentCore harness. Action groups become MCP tools through AgentCore Gateway, and knowledge bases become gateway-fronted tools, with memory, guardrails, and tracing added.
    - Foundry prompt agents are the declarative counterpart. They support instructions, a model, and tools (file search, code interpreter, web search, MCP, functions).
  pricing:
    aws: Agents Classic charges no separate agent fee. You pay for model tokens and the resources invoked.
    azure: Prompt agents are billed per call for inference plus tool usage.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103]
  related: [managed-agents]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
    - https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html
    - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
  flags:
    - "\"No separate agent fee\" for Agents Classic reflects historical Bedrock pricing. Confirm on the pricing page."

- id: agent-tools
  slug: aws-agentcore-gateway-vs-azure-foundry-agent-tools
  group: agents
  capability: Agent tools, MCP gateway & sandboxes
  what_for: Give agents safe access to your APIs, MCP servers, a code sandbox, and a web browser.
  match: partial
  answer: AgentCore Gateway, Code Interpreter, and Browser map to the Foundry Agent Service toolbox (a managed MCP endpoint with web search, file search, code interpreter, OpenAPI, functions, and MCP tools).
  providers:
    aws: [bedrock-agentcore]
    azure: [foundry-agent-service]
  differences:
    - AgentCore Gateway turns REST APIs, Lambda functions, and existing services into MCP tools, and fronts existing MCP servers with interceptors and Cedar-compatible policy.
    - AgentCore Browser is a managed cloud browser runtime for agents (Playwright and BrowserUse compatible). It's a standalone service, not just a tool flag.
    - The Foundry toolbox curates tools once and shares them across agents through a single managed MCP endpoint with central auth and versioning. It also offers Microsoft-ecosystem tools (SharePoint, WorkIQ, Fabric IQ).
  pricing:
    aws: Per-component consumption (Gateway API calls and indexing, and Browser and Code Interpreter session compute).
    azure: Tool usage is billed per tool (for example web search grounding and code interpreter sessions), plus model tokens.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103, AI-500]
  related: [managed-agents, agent-identity-governance]
  sources:
    - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
  flags:
    - A Foundry built-in tool equivalent to AgentCore Browser (managed headless browser) wasn't confirmed in the docs reviewed. Treat it as a gap until verified.

- id: agent-memory
  slug: aws-agentcore-memory-vs-azure-foundry-agent-memory
  group: agents
  capability: Agent memory (short- & long-term)
  what_for: Let agents remember a conversation and learn user preferences across sessions.
  match: partial
  answer: AgentCore Memory maps to Foundry Agent Service memory (preview). AgentCore's memory is GA and more configurable today.
  providers:
    aws: [bedrock-agentcore]
    azure: [foundry-agent-service]
  differences:
    - AgentCore Memory offers short-term (multi-turn) and long-term memory with configurable strategies, sharing across agents, and namespace-scoped IAM controls.
    - Foundry lists memory as a built-in tool and describes it as preview on the Foundry overview. Hosted agents also get session-level state persistence.
  pricing:
    aws: Billed per memory event and stored or retrieved long-term records.
    azure: Preview pricing. Check the Foundry pricing page.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-103]
  related: [managed-agents]
  sources:
    - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    - https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry
    - https://learn.microsoft.com/en-us/azure/foundry/agents/overview

- id: agent-identity-governance
  slug: aws-agentcore-identity-vs-azure-entra-agent-id
  group: agents
  capability: Agent identity, policy & registry
  what_for: Give each agent its own identity, control which tools it may call, and keep a governed catalog of agents and tools.
  match: partial
  answer: AgentCore Identity, Policy, and Registry map to Microsoft Entra agent identities, Foundry guardrails (tool-call controls), the Foundry control plane, and the Entra Agent Registry.
  providers:
    aws: [bedrock-agentcore]
    azure: [foundry-agent-service, foundry-guardrails]
  differences:
    - AgentCore Identity vends short-lived credentials from a token vault, and works with any IdP (Cognito, Okta, Entra ID, Auth0).
    - AgentCore Policy enforces deterministic rules on every tool call at the Gateway, written in natural language or Dogwood (Cedar-compatible).
    - On Azure, hosted agents get a dedicated Microsoft Entra identity. Guardrails can inspect tool calls and tool responses (preview), and hosted agents support network egress controls (preview).
    - Registry. AgentCore Registry catalogs agents, MCP servers, tools, and skills with an approval workflow. Foundry publishes agents to the Entra Agent Registry.
  pricing:
    aws: Consumption-based per component.
    azure: Included with Foundry/Entra usage. Some Entra agent features may require specific Entra licensing.
  exams:
    aws: [AWS-GAI-PRO]
    azure: [AI-500, AI-103]
  related: [managed-agents, guardrails, agent-tools]
  sources:
    - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
    - https://learn.microsoft.com/en-us/azure/foundry/agents/overview
    - https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
  flags:
    - Entra licensing requirements for agent identities weren't verified for this release.

- id: agent-frameworks
  group: agents
  capability: Open-source agent SDK from the cloud vendor
  what_for: Write agent logic in code with the vendor's own open-source framework, then deploy it to the vendor's agent hosting.
  match: direct
  answer: The Azure counterpart of the Strands Agents SDK is Microsoft Agent Framework. Both are open-source, code-first agent SDKs that deploy to the vendor's managed agent runtime (AgentCore Runtime or Foundry hosted agents).
  providers:
    aws: [strands-agents]
    azure: [microsoft-agent-framework]
  differences:
    - Both runtimes are framework-agnostic, so you aren't locked into the vendor SDK. LangGraph and the OpenAI Agents SDK run on both.
    - Microsoft Agent Framework combines AutoGen's agent abstractions with Semantic Kernel's enterprise features and adds graph-based workflows. Microsoft also recommends it as the replacement for Prompt flow, which retires Apr 20, 2027.
  pricing:
    aws: Open-source, no charge.
    azure: Open-source, no charge.
  exams:
    aws: [AWS-GAI-PRO]
