# ───────────────────────── INFRASTRUCTURE ─────────────────────────
- id: gpu-instances
  group: infra
  capability: NVIDIA GPU instances for AI training
  what_for: Rent top-end GPU servers for training and serving large models.
  match: direct
  answer: Amazon EC2 P-family instances (P5/P5e/P5en, P6-B200, P6-B300, P6e-GB200) map to Azure ND-series VMs (ND H100 v5, ND H200 v5, ND GB200 v6, ND GB300 v6).
  providers:
    aws: [ec2-gpu]
    azure: [nd-series]
  differences:
    - Rough generation mapping. P5 (H100) ↔ ND H100 v5. P5e/P5en (H200) ↔ ND H200 v5. P6-B200/P6-B300 ↔ ND GB300 v6 (Blackwell Ultra). P6e-GB200 UltraServers ↔ ND GB200 v6.
    - Azure offers AMD Instinct MI300X (ND MI300X v5). AWS's listed accelerated families don't include an AMD Instinct training instance.
    - Inference/graphics GPUs. AWS G6/G6e/G7/G7e map to Azure NC/NV families (not detailed in this release).
    - Capacity access differs. AWS has EC2 Capacity Blocks and SageMaker flexible training plans, while Azure uses capacity reservations and reserved instances.
  pricing:
    aws: On-demand, Savings Plans, Spot, and Capacity Blocks for ML (reserved GPU time slots).
    azure: Pay-as-you-go, Reserved VM Instances/savings plan, Spot VMs, and on-demand capacity reservations.
  exams:
    aws: [MLA-C01]
    azure: [AI-300]
  related: [custom-training-chips, large-scale-training-clusters, dl-vm-images]
  sources:
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/nd-family
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/nd-gb200-v6-series
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/nd-gb300-v6-series
    - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/nd-h200-v5-series
  flags:
    - The generation mapping is approximate (GPU model, not identical node specs). Compare GPU count, memory, and interconnect per SKU.

- id: custom-training-chips
  group: infra
  capability: Custom AI training silicon (rentable)
  what_for: Use the cloud vendor's own AI chips, rather than NVIDIA GPUs, for lower-cost training at scale.
  match: none
  answer: Azure has no rentable equivalent of AWS Trainium. Microsoft's Maia 200 is an inference accelerator used behind Microsoft Foundry and Microsoft 365 Copilot, not sold as VMs (the SDK is in preview).
  providers:
    aws: [trainium]
    azure: [maia]
  differences:
    - Trainium is rentable as EC2 Trn1/Trn2 instances and Trn3 UltraServers (GA Dec 2, 2025, up to 144 Trainium3 chips), and through SageMaker HyperPod. You program it with the Neuron SDK (native PyTorch).
    - Maia 200 (announced Jan 26, 2026) is in Azure US Central (US West 3 next), serves models such as OpenAI GPT on Foundry, and offers a Maia SDK preview. There are no Maia VM SKUs.
    - On Azure, the practical alternative for training is ND-series NVIDIA or AMD MI300X VMs.
  pricing:
    aws: EC2 pricing for Trn instances (On-demand, Savings Plans, Capacity Blocks).
    azure: Not rentable. Maia benefits reach customers indirectly through Foundry model pricing.
  exams:
    aws: [MLA-C01]
    azure: []
  related: [inference-chips, gpu-instances]
  sources:
    - https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-ec2-trn3-ultraservers/
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html
    - https://blogs.microsoft.com/blog/2026/01/26/maia-200-the-ai-accelerator-built-for-inference/

- id: inference-chips
  group: infra
  capability: Custom AI inference silicon (rentable)
