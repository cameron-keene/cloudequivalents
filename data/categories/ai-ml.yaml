  gcp:
    services:
    - rag-engine
    - vector-search
    match: direct
    answer: Bedrock Knowledge Bases maps to RAG Engine on Agent Platform, which ingests, chunks, embeds, and retrieves your data, using a managed Spanner-backed database or Vector Search and other vector stores.
    differences:
    - RAG Engine needs allowlisting in some regions for new projects (us-central1, us-east1, us-east4, europe-west1 per the docs).
    - If you use the RAG Engine-managed Spanner instance, that Spanner instance is billed to you.
    - For managed search with connectors and ranking out of the box, Agent Search is the alternative.
    pricing: Billed for embedding and generation model calls and for the vector store you use (managed Spanner or Vector Search node-hours).
    sources:
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/rag-overview
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/vector-search/overview

