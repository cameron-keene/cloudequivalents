  providers:
    aws: [inferentia]
    azure: [maia]
  differences:
    - Inf1 and Inf2 are EC2 instance families you can launch directly, programmed through the Neuron SDK.
    - Maia 200 runs Microsoft-hosted models (Foundry, Microsoft 365 Copilot), and you only benefit through those services.
  pricing:
    aws: EC2 pricing for Inf instances.
    azure: Not applicable.
  exams:
    aws: [MLA-C01]
    azure: []
  related: [custom-training-chips, ml-inference-endpoints]
  sources:
    - https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html
    - https://blogs.microsoft.com/blog/2026/01/26/maia-200-the-ai-accelerator-built-for-inference/

