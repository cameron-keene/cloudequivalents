  capability: Production model monitoring (drift)
  what_for: Get alerted when production data or predictions drift away from what the model was trained on.
  match: direct
  answer: SageMaker Model Monitor (in maintenance) maps to Azure Machine Learning model monitoring. Azure's is a fully supported, built-in service, while AWS now recommends open-source monitoring solutions for new customers.
  providers:
    aws: [sagemaker-model-monitor]
    azure: [azure-ml-model-monitoring]
  differences:
    - Azure ML signals cover data drift, prediction drift, data quality, feature attribution drift, and model performance, with alerts through Azure ML or Event Grid.
    - AWS's replacement is an open-source reference (aws-samples) built on SageMaker AI, Athena, Lambda, EventBridge, QuickSight, MLflow, and Evidently AI that you deploy in your account.
  pricing:
    aws: Monitoring jobs are billed per instance time.
    azure: Billed for the compute running monitoring jobs.
  exams:
    aws: [MLA-C01]
    azure: [AI-300]
  related: [bias-explainability, ml-inference-endpoints]
  sources:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-model-monitoring

