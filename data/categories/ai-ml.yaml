# ───────────────────────── SPEECH & CONVERSATIONAL ─────────────────────────
- id: speech-to-text
  group: speech
  capability: Speech to text
  what_for: Transcribe audio to text in real time or in batch, with custom vocabularies.
  match: direct
  answer: The Azure equivalent of Amazon Transcribe is Azure Speech speech-to-text.
  providers:
    aws: [transcribe]
    azure: [speech]
  differences:
    - Azure offers real-time, fast (synchronous file), and batch transcription, custom speech models, pronunciation assessment, and edge containers.
    - Transcribe offers streaming and batch, custom vocabularies and custom language models, speaker partitioning, PII redaction, and toxicity/content filtering. It's HIPAA-eligible.
    - Foundry also offers OpenAI speech-to-text models (for example gpt-4o-transcribe family) as an LLM-based alternative.
  pricing:
    aws: Per second of audio (with minimums), tiered by monthly volume. Medical and Call Analytics have separate rates.
    azure: Per audio hour (real-time, fast, and batch rates differ). Custom models add hosting, and a free tier is available.
  exams:
    aws: [AIF-C01]
    azure: [AI-901, AI-103]
  related: [text-to-speech, call-analytics, realtime-voice]
  sources:
    - https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
    - https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview
  flags:
    - The OpenAI transcription model family name on Foundry is indicative. Check the Foundry audio models section.

- id: text-to-speech
  group: speech
  capability: Text to speech
  what_for: Turn text into natural-sounding speech for apps, IVR, and audiobooks.
