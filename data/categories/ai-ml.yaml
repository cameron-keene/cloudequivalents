    - Both support hybrid search, reranking, and citations. Bedrock also supports image queries with multimodal embeddings.
  pricing:
    aws: Managed KB is billed on ingested size, query volume, and LLM usage. Customer-managed KBs bill for the underlying vector store plus embedding and generation tokens.
    azure: Azure AI Search tier (search units per hour), plus semantic ranker/agentic retrieval usage and embedding/LLM tokens.
  exams:
    aws: [AWS-GAI-PRO, AIF-C01]
    azure: [AI-103]
  faq:
    - q: Is Azure AI Search the same as Bedrock Knowledge Bases?
      a: Not exactly. Azure AI Search is the index and retrieval engine. Foundry IQ is the knowledge-base layer on top of it that maps most closely to Bedrock Knowledge Bases.
