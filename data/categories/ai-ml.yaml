- id: fraud-detection
  group: industry
  capability: Managed fraud detection
  what_for: Score online transactions and sign-ups for fraud risk with a managed model.
  match: none
  answer: Azure has no managed fraud-detection API comparable to Amazon Fraud Detector, and Fraud Detector itself closed to new customers on November 7, 2025. Both clouds now point to building models (AutoGluon on SageMaker AI, or Azure ML AutoML).
  providers:
    aws: [fraud-detector]
    azure: [azure-machine-learning]
  differences:
    - AWS suggests AutoGluon on SageMaker AI, and AWS WAF Fraud Control for account-creation fraud.
    - On Azure, the comparable path is Azure ML AutoML (classification) plus Azure WAF/bot protection at the edge.
  pricing:
    aws: Existing customers pay per prediction and training hour.
    azure: Compute for training and hosting.
  exams:
    aws: [MLA-C01]
    azure: [AI-300]
  related: [automl]
  sources:
    - https://docs.aws.amazon.com/frauddetector/latest/ug/frauddetector-availability-change.html
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml
  flags:
    - Microsoft Dynamics 365 Fraud Protection (a SaaS product, not Azure) wasn't evaluated in this release.
  gcp:
    services:
    - fraud-defense
    - aml-ai
    match: partial
    answer: Amazon Fraud Detector (in maintenance) maps partly to Google Cloud Fraud Defense (reCAPTCHA) for bot and account fraud, and to Anti Money Laundering AI for banks.
    differences:
    - Fraud Defense scores user interactions on web and mobile; it is not a general model builder for your own event types.
    - AML AI is a regulated-industry product for banks.
    pricing: Fraud Defense uses usage-based tiers that start with free assessments. We found no public AML AI price page.
    sources:
    - https://docs.cloud.google.com/recaptcha/docs/overview
    - https://docs.cloud.google.com/financial-services/anti-money-laundering/docs/concepts/overview

