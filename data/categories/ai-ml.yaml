  answer: The Azure equivalent of Amazon Polly is Azure Speech text-to-speech.
  providers:
    aws: [polly]
    azure: [speech]
  differences:
    - Polly voice engines are generative, long-form, neural, and standard. Polly supports SSML and lexicons.
    - Azure has neural voices, batch synthesis, and avatars, plus custom neural voice (brand voice), which is Limited Access and needs Microsoft approval.
  pricing:
    aws: Per character synthesized, by voice engine.
    azure: Per character, by voice type. Custom voice adds training and hosting.
  exams:
    aws: [AIF-C01]
    azure: [AI-901, AI-103]
  related: [speech-to-text, realtime-voice]
  sources:
