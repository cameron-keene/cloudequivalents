- id: chatbot-builder
  group: speech
  capability: Conversational bot builder (intents & dialog)
  what_for: Build voice and text chatbots with intents, slots, and dialog flows for customer service.
  match: partial
  answer: Amazon Lex maps to Microsoft Copilot Studio (low-code agents) together with Azure AI Bot Service (channels). Azure's intent engine, CLU, is deprecated and retires March 31, 2029.
  providers:
    aws: [lex]
    azure: [copilot-studio, bot-service, clu]
  differences:
    - Lex is a single AWS service (NLU, ASR, and dialog management) with LLM-assisted NLU, conditional branching, multi-Region replication, and native Amazon Connect integration.
    - Azure is modular. Copilot Studio (or the Microsoft 365 Agents SDK) handles the agent, Bot Service handles channels such as Teams and web chat, and CLU or LLMs handle intent understanding. LUIS fully retired Mar 31, 2026, and QnA Maker is retired.
    - Microsoft's own comparison maps Lex to conversational language understanding, but CLU is now on a retirement path. New projects should use Foundry models or Copilot Studio generative orchestration.
  pricing:
    aws: Per speech or text request (streaming conversations priced per interval).
    azure: Copilot Studio uses capacity packs or pay-as-you-go messages/credits. Bot Service charges for premium channels, and standard channels are free.
  exams:
    aws: [AIF-C01]
    azure: [AB-620, AI-103]
  faq:
    - q: What replaced LUIS on Azure?
      a: Conversational language understanding (CLU). But CLU is itself retiring on Mar 31, 2029, and Microsoft directs new projects to Microsoft Foundry.
  related: [work-assistant, managed-agents, speech-to-text]
  sources:
    - https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
