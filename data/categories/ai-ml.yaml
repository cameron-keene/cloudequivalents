- id: fhir-data
  group: industry
  capability: FHIR health data store
  what_for: Store, query, and exchange healthcare records using the FHIR standard.
  match: direct
  answer: The Azure equivalent of AWS HealthLake is the FHIR service in Azure Health Data Services. The older Azure API for FHIR was deprecated on September 30, 2026.
  providers:
    aws: [healthlake]
    azure: [health-data-services]
  differences:
    - HealthLake is FHIR R4 with integrated medical NLP and a data-transformation AI agent (C-CDA/CSV → FHIR), and pairs with HealthImaging and HealthOmics.
    - Azure Health Data Services bundles FHIR, DICOM (imaging), and a de-identification service, and supports SMART on FHIR.
  pricing:
    aws: Data store hours, storage, and queries/NLP usage.
    azure: Structured storage, API requests, and per-service charges (FHIR, DICOM, de-identification).
  exams:
    aws: []
    azure: []
  related: [medical-nlp, clinical-documentation]
  sources:
    - https://docs.aws.amazon.com/healthlake/latest/devguide/what-is.html
    - https://learn.microsoft.com/en-us/azure/healthcare-apis/healthcare-apis-overview
  gcp:
    services:
    - healthcare-api
    match: direct
    answer: AWS HealthLake maps to FHIR stores in the Cloud Healthcare API.
    differences:
    - HealthLake includes integrated medical NLP; Google's Healthcare NL API has shut down.
    pricing: Billed for data storage and request volume.
    sources:
    - https://docs.cloud.google.com/healthcare-api/docs/concepts/fhir
    - https://cloud.google.com/healthcare-api/pricing

- id: clinical-documentation
  group: industry
  capability: Ambient clinical documentation (AI scribe)
  what_for: Turn a recorded patient-clinician conversation into a transcript and draft clinical note.
  match: partial
  answer: Azure has no documented one-API equivalent of AWS HealthScribe. You can compose it from Azure Speech, Text Analytics for health, and Foundry models (including Microsoft healthcare AI models).
