- id: feature-store
  group: mlops
  capability: Feature store
  what_for: Store and share ML features so training and real-time inference use exactly the same values.
  match: direct
  answer: Amazon SageMaker Feature Store maps to the Azure Machine Learning managed feature store.
  providers:
    aws: [sagemaker-feature-store]
    azure: [azure-ml-feature-store]
  differences:
    - SageMaker organizes features into feature groups with an online store (latest values, ms latency) and/or offline store (history in S3). Feature Processor runs transformation code.
    - Azure uses feature-set specifications that the system materializes to offline and online stores on a schedule, with managed transformation pipelines and point-in-time joins.
  pricing:
    aws: Online store billed by read/write units and storage. Offline store billed at S3 rates.
    azure: Billed for materialization compute plus underlying storage, and the online store's backing service (for example Azure Cache for Redis).
  exams:
    aws: [MLA-C01]
    azure: [AI-300]
  related: [ml-pipelines, ml-platform]
  sources:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store.html
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-what-is-managed-feature-store
  flags:
    - Azure online store backing service (Redis) should be confirmed in the managed feature store docs for your region and version.
  gcp:
    services:
    - feature-store
    match: direct
    answer: SageMaker Feature Store maps to Agent Platform Feature Store, which uses BigQuery tables and views as the offline store and syncs features to online stores.
    differences:
    - Your BigQuery data is the source of truth; you register feature groups over BigQuery tables instead of ingesting into a separate offline store.
    - Legacy Feature Store and Optimized online serving are deprecated, with sunset on Feb 17, 2027. Use Bigtable online serving for new work.
    pricing: Billed for online serving and data sync, plus BigQuery storage and queries. See the Feature Store section of the pricing page.
    sources:
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/featurestore/latest/overview
    - https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing

