- id: guardrails
  group: safety-rag
  capability: GenAI guardrails & content safety
  what_for: Block harmful content, prompt attacks, and sensitive data in model inputs and outputs, and catch hallucinations.
  match: direct
  answer: The Azure equivalent of Amazon Bedrock Guardrails is Foundry guardrails, which are powered by Azure AI Content Safety. Content Safety is also available as a standalone API, like Bedrock's ApplyGuardrail.
  providers:
    aws: [bedrock-guardrails]
    azure: [foundry-guardrails, content-safety]
  differences:
    - Content categories differ. Bedrock filters Hate, Insults, Sexual, Violence, Misconduct, and Prompt Attack. Azure classifies Hate, Sexual, Self-harm, and Violence by severity, with Prompt Shields for jailbreak and indirect attacks.
    - Only on Bedrock, Automated Reasoning checks (logic-rule validation of responses), plus denied topics and word filters (Azure uses blocklists and custom categories).
    - Only on Azure, protected-material detection (known text and code) and task-adherence detection for agent tool use. Guardrails can also run at tool-call and tool-response intervention points for agents (preview).
    - Hallucination checks are on both sides. Bedrock has contextual grounding checks, and Azure has groundedness detection (preview).
    - Turning output filtering off on Azure-sold models requires Microsoft approval (Limited Access, modified guardrails).
    - Bedrock offers cross-account enforcement of guardrails and Classic vs Standard safeguard tiers.
  pricing:
    aws: Charged per text unit processed by each policy type (content, denied topics, PII, grounding, Automated Reasoning). Word filters are free of charge.
    azure: Content filtering on Foundry deployments is included with model usage. Standalone Content Safety APIs are billed per text record and per image, with a free tier.
  exams:
    aws: [AIF-C01, AWS-GAI-PRO]
    azure: [AI-901, AI-103]
  faq:
    - q: Does Azure have an equivalent to the Bedrock ApplyGuardrail API?
      a: Yes. Azure AI Content Safety exposes text and image moderation, Prompt Shields, groundedness, and protected-material detection as standalone APIs you can call on any content.
  related: [content-moderation, pii-detection, genai-evaluation, agent-identity-governance]
  sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
    - https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
    - https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
  flags:
    - "\"Word filters free\" reflects Bedrock pricing-page structure. Confirm current pricing."
  gcp:
    services:
    - model-armor
    match: direct
    answer: Bedrock Guardrails maps to Model Armor, which screens prompts and responses for prompt injection, jailbreaks, harmful content, sensitive data, and malicious URLs. Gemini also has built-in, configurable safety filters.
    differences:
    - Model Armor works with any model and is configured through reusable templates.
    - Gemini safety filters are configured per request and are separate from Model Armor.
    - Sensitive-data screening uses Sensitive Data Protection.
    pricing: Model Armor is billed by the volume of tokens screened. See the Model Armor pricing page.
    sources:
    - https://docs.cloud.google.com/model-armor/overview
    - https://cloud.google.com/model-armor/pricing
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/configure-safety-filters

- id: rag-knowledge-bases
  group: safety-rag
  capability: Managed RAG / knowledge bases
  what_for: Connect models and agents to your own documents so answers are grounded and cited.
  match: direct
  answer: The Azure equivalent of Amazon Bedrock Knowledge Bases is Foundry IQ knowledge bases, which run on Azure AI Search with agentic retrieval.
  providers:
    aws: [bedrock-knowledge-bases]
    azure: [foundry-iq, ai-search]
  differences:
    - Bedrock offers a Managed Knowledge Base (AWS runs ingestion, storage, and agentic multi-hop retrieval) or customer-managed vector stores (OpenSearch Serverless, Aurora, Neptune Analytics graphs, Kendra GenAI index, structured data stores).
