    - Data events. CloudTrail data events (for example, S3 object reads) are opt-in on trails. On Azure, data-plane activity comes from resource logs (such as Storage or Key Vault diagnostic logs).
    - Organization-wide. CloudTrail organization trails cover all accounts. On Azure, apply diagnostic settings at scale with Azure Policy.
  pricing:
    aws: The first copy of management events in trails is free. Data events, extra copies, and CloudTrail Lake are billed.
    azure: Activity log entries are free for 90 days. You pay for Log Analytics ingestion or storage when exporting.
